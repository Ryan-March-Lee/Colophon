<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colophon · 文献工作台</title>
<style>
  :root{
    --bg:#f5f4ef;
    --panel:#ffffff;
    --panel-2:#faf9f5;
    --hover:#efeee8;
    --ink:#1b1c1a;
    --muted:#63655e;
    --muted-2:#73756d;
    --line:#e5e3da;
    --line-2:#d2cfc3;
    --accent:#1f6b58;
    --accent-2:#175445;
    --accent-soft:#e7f1ed;
    --ok:#2f7d4f;
    --warn:#b45309;
    --c-year:#5b6f83;
    --c-author:#a2672c;
    --c-org:#7757a6;
    --c-topic:#1c7566;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype","Songti SC","Source Han Serif SC",Georgia,serif;
    --shadow:0 1px 2px rgba(20,24,20,.04),0 12px 28px -20px rgba(20,24,20,.35);
  }
  :root[data-theme="dark"]{
    --bg:#131413;
    --panel:#1b1d1b;
    --panel-2:#171917;
    --hover:#232623;
    --ink:#e9e8e1;
    --muted:#b2b5aa;
    --muted-2:#8b8e84;
    --line:#2b2e2b;
    --line-2:#3b3f3b;
    --accent:#5fb59d;
    --accent-2:#8fd0bd;
    --accent-soft:#1c332c;
    --ok:#6fbf8e;
    --warn:#d99a5b;
    --c-year:#8ea3b8;
    --c-author:#d3a06a;
    --c-org:#a98dd1;
    --c-topic:#5cb8a5;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -22px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;
    background:var(--bg);color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
  *::-webkit-scrollbar-thumb:hover{background:var(--muted-2);background-clip:content-box}
  *::-webkit-scrollbar-track{background:transparent}

  /* ---------- top bar ---------- */
  .topbar{
    height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;
    background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:9px;flex:none}
  .mark{
    width:30px;height:30px;border-radius:9px;background:var(--accent);
    display:grid;place-items:center;color:#fff;flex:none;
  }
  :root[data-theme="dark"] .mark{color:#0f1714}
  .brand-text{line-height:1.1}
  .brand h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.04em}
  .brand .sub{font-size:10px;color:var(--muted);letter-spacing:.09em;margin-top:2px}
  .search{flex:1;min-width:0;max-width:620px;position:relative;margin-left:8px}
  .search svg{position:absolute;left:11px;top:9px;color:var(--muted);pointer-events:none}
  .search input{
    width:100%;min-width:0;height:34px;border:1px solid var(--line);background:var(--panel-2);
    border-radius:9px;padding:0 12px 0 32px;font-size:13px;outline:none;
  }
  .search input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
  .search input::placeholder{color:var(--muted-2)}
  .topacts{margin-left:auto;display:flex;align-items:center;gap:6px}
  .btn{
    height:32px;padding:0 11px;border:1px solid var(--line);border-radius:8px;
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--panel);
    transition:background .12s,border-color .12s;
  }
  .btn:hover{background:var(--hover);border-color:var(--line-2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .btn.primary{color:#0f1714}
  .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn.tiny{height:27px;padding:0 8px;font-size:12px;border-radius:7px}
  .btn.icon{width:32px;padding:0;justify-content:center}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .linkbtn{font-size:11.5px;color:var(--accent);text-decoration:none;border-radius:4px;padding:1px 2px}
  .linkbtn:hover{text-decoration:underline}

  /* ---------- layout ---------- */
  .app{
    display:grid;
    grid-template-columns:246px minmax(340px,1fr) 428px;
    grid-template-rows:minmax(0,1fr);
    height:calc(100vh - 58px);
    min-height:0;
    overflow:hidden;
  }
  .app.hide-facets{grid-template-columns:0 minmax(340px,1fr) 428px}
  .app.hide-facets .facets{display:none}

  /* ---------- facets ---------- */
  .facets{
    overflow-y:auto;border-right:1px solid var(--line);background:var(--panel-2);
    padding:14px 12px 14px;display:flex;flex-direction:column;min-height:0;
  }
  .fhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
  .fhead-right{display:flex;align-items:center;gap:8px}
  .fclose{display:none;width:22px;height:22px;align-items:center;justify-content:center;border-radius:5px;color:var(--muted)}
  .fclose:hover{background:var(--hover);color:var(--ink)}
  .ftitle{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .fsub{font-size:10.5px;color:var(--muted-2)}
  .fgroup{border-top:1px solid var(--line);padding:4px 0 8px}
  .fgroup-head{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:8px 4px;border-radius:6px;
  }
  .fgroup-head:hover{background:var(--hover)}
  .fgroup-title{
    display:flex;align-items:center;gap:6px;
    font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink);
  }
  .fcount-sel{
    font-size:10px;line-height:1;padding:2px 5px;border-radius:99px;
    background:var(--c);color:#fff;font-weight:600;
  }
  :root[data-theme="dark"] .fcount-sel{color:#101613}
  .chev{color:var(--muted-2);transition:transform .15s}
  .fgroup.collapsed .chev{transform:rotate(-90deg)}
  .fgroup.collapsed .fgroup-body{display:none}
  .fgroup-body{padding-top:2px}
  .frow{
    width:100%;display:flex;align-items:center;gap:7px;padding:5px 6px;
    border-radius:7px;font-size:12.5px;text-align:left;line-height:1.35;
  }
  .frow:hover{background:var(--hover)}
  .frow.on{background:color-mix(in srgb,var(--c) 11%,transparent)}
  .frow.on .flabel{font-weight:600}
  .frow:disabled{opacity:.38;cursor:default}
  .frow:disabled:hover{background:none}
  .fbox{
    width:14px;height:14px;flex:none;border:1px solid var(--line-2);border-radius:4px;
    display:grid;place-items:center;color:#fff;background:var(--panel);
  }
  .frow.on .fbox{background:var(--c);border-color:var(--c)}
  :root[data-theme="dark"] .frow.on .fbox{color:#101613}
  .flabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fcount{font-size:10.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}
  .frow.on .fcount{color:var(--c)}
  .morebtn{
    margin-top:3px;padding:4px 6px;font-size:11px;color:var(--muted);
    border-radius:5px;
  }
  .morebtn:hover{color:var(--ink);background:var(--hover)}

  .years{display:flex;align-items:flex-end;gap:3px;padding:4px 2px 2px}
  .ybar{
    flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    gap:2px;height:64px;border-radius:5px;padding:2px 0;
  }
  .ybar:hover{background:var(--hover)}
  .ybar:disabled{cursor:default}
  .ybar:disabled:hover{background:none}
  .ybar:disabled .ybarfill{opacity:.12}
  .ybar:disabled .ybarlabel{opacity:.55}
  .ybarcount{font-size:9px;color:var(--muted-2);font-variant-numeric:tabular-nums;height:11px}
  .ybar.on .ybarcount{color:var(--c);font-weight:700}
  .ybarfill{
    width:100%;max-width:16px;border-radius:3px 3px 1px 1px;
    background:var(--c);opacity:.3;min-height:3px;transition:opacity .12s;
  }
  .ybar:hover .ybarfill{opacity:.55}
  .ybar.on .ybarfill{opacity:1}
  .ybarlabel{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums;height:12px}
  .ybar.on .ybarlabel{color:var(--c);font-weight:700}

  .src{
    margin-top:auto;padding:14px 4px 2px;border-top:1px solid var(--line);
    font-size:10.5px;color:var(--muted-2);line-height:1.6;
  }
  .srcline{display:flex;align-items:center;gap:6px;color:var(--muted)}
  .dot{width:6px;height:6px;border-radius:99px;background:var(--muted-2);flex:none}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 18%,transparent)}

  /* ---------- list ---------- */
  .listcol{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
  .listbar{padding:11px 16px 9px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;flex:none}
  .chiprow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;min-height:24px}
  .chiphint{font-size:11.5px;color:var(--muted-2)}
  .fchip{
    display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 7px;
    border:1px solid var(--line);border-radius:6px;background:var(--panel);
    font-size:11.5px;color:var(--ink);
  }
  .fchip:hover{border-color:var(--line-2);background:var(--hover)}
  .fchip .cdot{width:6px;height:6px;border-radius:99px;background:var(--c);flex:none}
  .fchip .x{color:var(--muted-2);font-size:12px;line-height:1;margin-left:1px}
  .fchip:hover .x{color:var(--ink)}
  .countrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;row-gap:6px}
  .count{font-size:11.5px;color:var(--muted);min-width:0}
  .count b{color:var(--ink);font-weight:650}
  .countacts{display:flex;align-items:center;gap:6px;margin-left:auto}
  .batch-progress{font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
  .sel{
    height:27px;border:1px solid var(--line);background:var(--panel);border-radius:7px;
    font-size:11.5px;padding:0 6px;outline:none;color:var(--muted);
  }
  .sel:focus{border-color:var(--accent)}
  .papers{flex:1;min-height:0;overflow-y:auto;padding:12px 14px 40px;display:flex;flex-direction:column;gap:9px}
  .paper{
    position:relative;padding:12px 14px 11px;border:1px solid var(--line);border-radius:12px;
    background:var(--panel);cursor:pointer;transition:border-color .12s,box-shadow .12s;
  }
  .paper:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
  .paper.on{
    border-color:color-mix(in srgb,var(--accent) 45%,var(--line));
    box-shadow:inset 3px 0 0 var(--accent),var(--shadow);
    background:linear-gradient(100deg,var(--accent-soft),var(--panel) 72%);
  }
  .paper:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .ptop{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muted-2);margin-bottom:6px}
  .pstatus{display:inline-flex;align-items:center;gap:4px}
  .pstatus .d{width:5px;height:5px;border-radius:99px;background:var(--muted-2)}
  .pstatus.read .d{background:var(--ok)}
  .pstatus.reading .d{background:var(--warn)}
  .pvenue{color:var(--muted)}
  .pcite{margin-left:auto}
  .ptitle{
    font-family:var(--serif);font-size:14.5px;line-height:1.42;font-weight:600;
    margin:0 0 4px;letter-spacing:-.005em;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .pauthors{font-size:11.5px;color:var(--muted);margin:0 0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pbrief{
    font-size:12px;color:var(--muted);line-height:1.55;margin:0 0 8px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;
  }
  .ptags{display:flex;flex-wrap:wrap;gap:4px;overflow:hidden;max-height:22px}
  .moretag{font-size:10.5px;color:var(--muted-2);padding:2px 2px}

  .tag{
    display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;
    border-radius:99px;font-size:11px;line-height:1;white-space:nowrap;
    background:color-mix(in srgb,var(--c) 10%,transparent);
    border:1px solid color-mix(in srgb,var(--c) 24%,transparent);
    color:color-mix(in srgb,var(--c) 88%,var(--ink));
  }
  .taglabel{padding:2px 0;color:inherit}
  button.taglabel:hover{text-decoration:underline}
  .tagx{color:inherit;opacity:.5;font-size:12px;line-height:1;padding:0 1px}
  .tagx:hover{opacity:1}
  .tag b{font-weight:600;font-size:10px;margin-left:3px;opacity:.7}

  .empty{
    margin:auto;text-align:center;color:var(--muted);padding:40px 20px;
  }
  .empty .em{font-size:26px;opacity:.5;margin-bottom:8px}
  .empty p{margin:0 0 10px;font-size:13px}

  /* ---------- detail ---------- */
  .detail{
    display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);
    border-left:1px solid var(--line);overflow:hidden;
  }
  .dhead{padding:15px 20px 12px;border-bottom:1px solid var(--line);flex:none}
  .dtop{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muted-2)}
  .dback{display:none;width:24px;height:22px;align-items:center;justify-content:center;border-radius:5px;color:var(--muted);margin-right:2px}
  .dback:hover{background:var(--hover);color:var(--ink)}
  .pill{
    display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;
    border-radius:99px;border:1px solid var(--line);font-size:10.5px;color:var(--muted);
    background:var(--panel-2);
  }
  .pill .d{width:5px;height:5px;border-radius:99px;background:var(--muted-2)}
  .pill.read{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,var(--line))}
  .pill.read .d{background:var(--ok)}
  .pill.reading{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,var(--line))}
  .pill.reading .d{background:var(--warn)}
  .dvenue{margin-left:auto}
  .dtitle{
    font-family:var(--serif);font-size:19px;line-height:1.34;font-weight:600;
    margin:9px 0 5px;letter-spacing:-.012em;
  }
  .dauthors{font-size:11.5px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .dorgs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
  .orgpill{
    font-size:10.5px;color:var(--muted);border:1px solid var(--line);
    border-radius:5px;padding:2px 6px;background:var(--panel-2);
  }
  .dhead .tag{margin-right:3px}
  .dacts{display:flex;gap:6px;margin-top:11px}
  .tabs{display:flex;gap:17px;padding:0 20px;border-bottom:1px solid var(--line);flex:none}
  .tab{
    position:relative;padding:10px 0 9px;font-size:12.5px;color:var(--muted);
    border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:5px;
  }
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
  .tabn{
    font-size:9.5px;padding:1px 5px;border-radius:99px;background:var(--hover);
    color:var(--muted);font-weight:500;
  }
  .tabdot{width:5px;height:5px;border-radius:99px;background:var(--accent)}

  .dbody{flex:1;overflow-y:auto;padding:15px 20px 30px;min-height:0}
  .section{margin-bottom:20px}
  .section:last-child{margin-bottom:4px}
  .slabel{
    font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:600;
    text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:6px;
  }
  .slabel .hint{font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--muted-2);font-weight:400}
  .metaflag{
    font-size:9px;letter-spacing:.04em;padding:1px 5px;border-radius:4px;
    background:var(--accent-soft);color:var(--accent);font-weight:600;
  }
  .abstract{font-size:12.8px;line-height:1.75;color:var(--ink);margin:0;opacity:.9}
  .textinput{
    width:100%;height:34px;border:1px solid var(--line);border-radius:8px;
    padding:0 10px;background:var(--panel-2);font-size:12.5px;outline:none;
  }
  .textinput:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
  .note{
    width:100%;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);
    padding:9px 11px;font-size:12.5px;line-height:1.7;resize:vertical;outline:none;
  }
  .note:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
  .autosave{font-size:10px;color:var(--muted-2);margin-top:5px;text-align:right}

  .tagline{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
  .tagline-label{flex:none;width:28px;font-size:10.5px;color:var(--muted-2);padding-top:4px}
  .tagline-vals{display:flex;flex-wrap:wrap;gap:4px;flex:1}
  .none{color:var(--muted-2);font-size:11px;padding-top:3px}
  .tagcloud{display:flex;flex-wrap:wrap;gap:4px}
  .hintline{font-size:11px;color:var(--muted-2);line-height:1.6;margin:7px 0 0}

  .addrow{display:flex;gap:5px;margin-top:9px}
  .addrow select{
    height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);
    font-size:11.5px;padding:0 4px;outline:none;flex:none;color:var(--muted);
  }
  .addrow input{
    flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:7px;
    background:var(--panel-2);padding:0 9px;font-size:12px;outline:none;
  }
  .addrow input:focus,.addrow select:focus{border-color:var(--accent);background:var(--panel)}

  .sug{
    border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:7px;
    background:var(--panel-2);
  }
  .sug-main{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12.5px}
  .sug-main b{font-weight:600}
  .sug-meta{font-size:10px;color:var(--muted-2);margin-left:auto}
  .sug-act{display:flex;gap:5px;margin-top:7px}
  .sug-act .btn{height:24px;font-size:11px;padding:0 8px}
  .sugempty{font-size:11.5px;color:var(--muted-2);display:flex;align-items:center;gap:8px}

  /* chat */
  .dbody.chat{display:flex;flex-direction:column;overflow:hidden;padding:0}
  .chat-top{padding:12px 20px 0;flex:none}
  .scopebar{
    display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;
    background:var(--accent-soft);border:1px dashed color-mix(in srgb,var(--accent) 38%,transparent);
  }
  .scopebar .lockic{color:var(--accent);flex:none;display:flex}
  .scope-txt{font-size:11.5px;line-height:1.45;color:var(--ink)}
  .scope-txt b{font-weight:650}
  .scope-txt span{display:block;font-size:10px;color:var(--muted);margin-top:1px}
  .scopebar .btn{margin-left:auto;flex:none}
  .scopebar.warn{background:color-mix(in srgb,var(--warn) 8%,var(--panel));border-color:color-mix(in srgb,var(--warn) 42%,transparent)}
  .scopebar.warn .lockic{color:var(--warn)}
  .scope-txt em{font-style:normal;color:var(--warn);font-weight:600}
  .scope-acts{display:flex;gap:6px;margin-left:auto;flex:none}
  .scope-link{background:none;border:0;color:var(--accent);font:inherit;font-size:11px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
  .cite .cp{margin-left:5px;color:var(--muted-2);font-size:10px}
  .msg .aierr{color:var(--warn)}
  .settings-card{width:min(540px,92vw)}
  .setnote{font-size:11px;color:var(--muted-2);line-height:1.65;margin:12px 0 0}
  .keyrow{display:flex;gap:6px}
  .keyrow .textinput{flex:1}
  .nokey{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px dashed color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 7%,var(--panel));border-radius:10px;padding:9px 11px}
  .nokey b{display:block;font-size:11.5px}

  /* ---------- PDF 阅读器 ---------- */

  .reader[hidden]{display:none}
  .rtop{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-height:50px}

</style>
</head>

<script>
/* ============================================================
   数据：全部从 /api/items 读取；连不上就显示重连提示，没有演示数据
   ============================================================ */
const FACETS = [
  {key:'topic',  label:'标签', c:'--c-topic',  meta:false, hint:'你自己打的'},
  {key:'year',   label:'年份', c:'--c-year',   meta:true,  hint:'来自元数据'},
  {key:'author', label:'作者', c:'--c-author', meta:true,  hint:'主要作者'},
  {key:'org',    label:'单位', c:'--c-org',    meta:true,  hint:'机构'}
];
const FKEYS = FACETS.map(f => f.key);

let apiOnline = false;
let PAPERS = [];


/* ============================================================
   工具
   ============================================================ */
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labelOf = k => (FACETS.find(f => f.key === k) || {}).label || k;
const colorOf = k => 'var(--c-' + k + ')';
const statusLabel = s => s === 'read' ? '已读' : s === 'reading' ? '在读' : '待读';
const fieldLabel = k => ({title:'标题', authors:'作者', year:'年份', venue:'期刊 / 会议'}[k] || k);

const state = {
  q:'',
  sort:'year',
  selected:{year:new Set(), author:new Set(), org:new Set(), topic:new Set()},
  paperId:null,
  reviewOnly:false,
  tab:'overview',
  chat:[],
  busy:false,
  sugg:{},
  dismissed:new Set(),
  collapsed:new Set(),
  expanded:new Set(),
  modalOpen:false,
  modalMode:'tags',
  metaBusy:null,
  batchProgress:null,
  ai:{baseUrl:'', model:'', hasKey:false, keyHint:''},
  aiExpand:false,
  expandConfirm:false,
  conversationId:null,
  scopeIds:undefined,
  readerOpen:false,
  pendingScroll:null
};

let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ============================================================
   派生数据
   ============================================================ */
function matchesQuery(p){
  if(!state.q) return true;
  const hay = [
    p.title, p.abstract, p.venue, p.authors.join(' '),
    ...p.tags.year, ...p.tags.author, ...p.tags.org, ...p.tags.topic
  ].join(' ').toLowerCase();
  return hay.includes(state.q.toLowerCase());
}

function sorter(a,b){
  if(state.sort === 'cites') return b.cites - a.cites;
  if(state.sort === 'added') return PAPERS.indexOf(a) - PAPERS.indexOf(b);
  return (parseInt(b.tags.year[0],10) || 0) - (parseInt(a.tags.year[0],10) || 0);
}

function getFiltered(skip){
  return PAPERS.filter(p => {
    if(state.reviewOnly && !p.needsReview) return false;
    if(!matchesQuery(p)) return false;
    return FKEYS.every(k => {
      if(k === skip) return true;
      const s = state.selected[k];
      return !s.size || p.tags[k].some(v => s.has(v));
    });
  }).sort(sorter);
}

function countFor(facet, value){
  return getFiltered(facet).filter(p => p.tags[facet].includes(value)).length;
}

function facetRows(key){
  const vals = Array.from(new Set(PAPERS.flatMap(p => p.tags[key])));
  const rows = vals.map(v => ({
    value:v,
    count:countFor(key, v),
    on:state.selected[key].has(v)
  }));
  if(key === 'year'){
    rows.sort((a,b) => (parseInt(b.value,10) || 0) - (parseInt(a.value,10) || 0));
  } else {
    rows.sort((a,b) => b.count - a.count || a.value.localeCompare(b.value, 'zh'));
  }
  return rows;
}

function selectedCount(){
  return FKEYS.reduce((n,k) => n + state.selected[k].size, 0);
}

function renderFacetGroup(f){
  const rows = facetRows(f.key);
  const selN = state.selected[f.key].size;
  const collapsed = state.collapsed.has(f.key);
  const body = f.key === 'year' ? renderYearChart(rows) : renderFacetRows(f, rows);

  return '<section class="fgroup' + (collapsed ? ' collapsed' : '') + '" style="--c:' + colorOf(f.key) + '">' +
    '<button class="fgroup-head" data-act="collapse" data-facet="' + f.key + '" aria-expanded="' + (!collapsed) + '">' +
      '<span class="fgroup-title">' + f.label +
        (selN ? '<b class="fcount-sel">' + selN + '</b>' : '') +
      '</span>' +
      '<svg class="chev" width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">' +
        '<path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>' +
      '</svg>' +
    '</button>' +
    '<div class="fgroup-body">' + body + '</div>' +
  '</section>';
}

function renderFacetRows(f, rows){
  const visible = rows.filter(r => r.count > 0 || r.on);
  const expanded = state.expanded.has(f.key);
  const limit = expanded ? visible.length : 6;
  let shown = visible.slice(0, limit);
  if(limit < visible.length){
    visible.forEach(r => { if(r.on && shown.indexOf(r) === -1) shown = shown.concat([r]); });
  }

  if(!visible.length){
    return '<div class="none" style="padding:5px 6px">没有匹配项</div>';
  }

  const html = shown.map(r =>
    '<button class="frow' + (r.on ? ' on' : '') + '"' +
      ' data-act="toggle-facet" data-facet="' + f.key + '" data-value="' + esc(r.value) + '"' +
      ' aria-pressed="' + r.on + '"' + (r.count === 0 && !r.on ? ' disabled' : '') +
      ' title="' + esc(r.value) + ' · ' + r.count + ' 篇">' +
      '<span class="fbox">' + (r.on ? checkSVG() : '') + '</span>' +
      '<span class="flabel">' + esc(r.value) + '</span>' +
      '<span class="fcount">' + r.count + '</span>' +
    '</button>'
  ).join('');

  const more = visible.length > 6
    ? '<button class="morebtn" data-act="more" data-facet="' + f.key + '">' +
      (expanded ? '收起' : '展开全部 ' + visible.length) + '</button>'
    : '';

  return html + more;
}

function renderYearChart(rows){
  const max = Math.max(1, ...rows.map(r => r.count));
  return '<div class="years">' + rows.map(r =>
    '<button class="ybar' + (r.on ? ' on' : '') + '"' +
      ' data-act="toggle-facet" data-facet="year" data-value="' + esc(r.value) + '"' +
      ' aria-pressed="' + r.on + '"' + (r.count === 0 && !r.on ? ' disabled' : '') +
      ' title="' + r.value + ' · ' + r.count + ' 篇">' +
      '<span class="ybarcount">' + (r.count || '') + '</span>' +
      '<span class="ybarfill" style="height:' + (4 + Math.round(24 * r.count / max)) + 'px"></span>' +
      '<span class="ybarlabel">' + r.value + '</span>' +
    '</button>'
  ).join('') + '</div>';
}

function checkSVG(){
  return '<svg width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">' +
    '<path d="M2 5.1 4.1 7.2 8 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>' +
  '</svg>';
}

function msgHTML(m){
  if(m.role === 'user'){
    return '<div class="msg user"><div class="bubble">' + esc(m.text) + '</div></div>';
  }
  if(m.pending){
    return '<div class="msg ai"><div class="typing"><i></i><i></i><i></i></div></div>';
  }
  const cites = m.cites || [];
  const citesHTML = cites.length
    ? '<div class="cites">' + cites.map(function(c, i){
        const itemId = c.itemId || c;
        const found = PAPERS.find(x => x.id === itemId);
        const title = c.title || (found ? found.title : itemId);
        const page = c.page || 0;
        return '<button data-act="cite" data-id="' + esc(itemId) + '" data-page="' + page + '"' +
          ' title="' + (page > 0 ? '打开第 ' + page + ' 页' : '打开这条文献') + '">' +
          '<b>' + (i + 1) + '</b><span class="ct">' + esc(title) + '</span>' +
          (page > 0 ? '<span class="cp">p.' + page + '</span>' : '') +
        '</button>';
      }).join('') + '</div>'
    : '';
  if(m.error){
    return '<div class="msg ai">' +
      '<div class="aimeta">AI · 出错</div>' +
      '<div class="aitext aierr">' + esc(m.text) + '</div>' +
    '</div>';
  }
  return '<div class="msg ai">' +
    '<div class="aimeta">AI · 范围 ' + (m.n || 0) + ' 篇' +
      (cites.length ? ' · ' + cites.length + ' 条引用' : '') +
      (m.model ? ' · ' + esc(m.model) : '') + '</div>' +
    '<div class="aitext">' + fmtAI(m.text, cites) + '</div>' +
    citesHTML +
  '</div>';
}

function fmtAI(text, cites){
  let h = esc(text || '');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\[(\d+)\]/g, function(match, i){
    const citation = cites[parseInt(i, 10) - 1];
    if(!citation) return match;
    const itemId = citation.itemId || citation;
    const page = citation.page || 0;
    return '<button class="cite" data-act="cite" data-id="' + esc(itemId) + '" data-page="' + page + '">[' + i + ']</button>';
  });
  h = h.replace(/\n/g, '<br>');
  return h;
}

async function loadSuggestions(itemId){
  if(!apiOnline){ toast('未连接本地服务，无法生成建议'); return; }
  if(!state.ai.hasKey){ toast('先配置模型 Key'); openSettings(); return; }
  const p = PAPERS.find(x => x.id === itemId);
  if(!p) return;

  state.sugg[itemId] = { status:'loading', items:[] };
  if(state.paperId === itemId) renderDetail();

  try{
    const res = await fetch('/api/items/' + encodeURIComponent(itemId) + '/suggest-tags', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ limit: 4 })
    });
    const data = await res.json().catch(function(){ return {}; });
    if(!res.ok){
      throw new Error(typeof data.detail === 'string' ? data.detail : ('生成失败（' + res.status + '）'));
    }
    // 重新生成时，把之前忽略的也放回来
    Array.from(state.dismissed).forEach(function(key){
      if(key.indexOf(itemId + '|') === 0) state.dismissed.delete(key);
    });
    state.sugg[itemId] = {
      status: 'ready',
      items: Array.isArray(data.tags) ? data.tags : [],
      model: data.model || ''
    };
  }catch(err){
    state.sugg[itemId] = {
      status: 'error',
      items: [],
      message: String((err && err.message) || err)
    };
  }finally{
    if(state.paperId === itemId) renderDetail();
  }
}

/* AI 回答由后端 /api/ai/ask 生成 */

async function send(text){
  if(state.busy) return;
  const scope = aiScope();
  if(!scope.length) return;
  if(!state.ai.hasKey){ toast('先配置模型 Key'); openSettings(); return; }

  state.chat.push({role:'user', text:text});
  state.chat.push({role:'ai', pending:true});
  state.busy = true;
  state.pendingScroll = 'bottom';
  renderDetail();

  try{
    const res = await fetch('/api/ai/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: text,
        itemIds: scope.map(p => p.id),
        conversationId: state.conversationId
      })
    });
    const data = await res.json().catch(function(){ return {}; });
    if(!res.ok){
      const detail = typeof data.detail === 'string' ? data.detail : ('请求失败（' + res.status + '）');
      throw new Error(detail);
    }
    state.conversationId = data.conversationId || null;
    rememberConversation();
    let answer = String(data.answer || '');
    let citations = Array.isArray(data.citations) ? data.citations : [];
    // 只保留回答里实际引用的来源，并按首次出现重新编号
    const used = [];
    answer = answer.replace(/\[(\d+)\]/g, function(match, digit){
      const index = parseInt(digit, 10) - 1;
      if(index < 0 || index >= citations.length) return match;
      let position = used.indexOf(index);
      if(position === -1){
        used.push(index);
        position = used.length - 1;
      }
      return '[' + (position + 1) + ']';
    });
    if(used.length){
      citations = used.map(function(index){ return citations[index]; });
    }
    state.chat.pop();
    state.chat.push({
      role: 'ai',
      text: answer,
      cites: citations,
      n: data.scopeCount || scope.length,
      model: data.model || ''
    });
  }catch(err){
    state.chat.pop();
    state.chat.push({
      role: 'ai',
      error: true,
      text: String((err && err.message) || err)
    });
  }finally{
    state.busy = false;
    state.pendingScroll = 'bottom';
    renderDetail();
    const input = $('#chatInput');
    if(input) input.focus();
  }
}

}

async function restoreConversation(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('colophon:conv') || 'null'); }catch(err){ saved = null; }
  if(!saved || !saved.id) return;
  const current = (state.aiExpand ? PAPERS : getFiltered()).map(p => p.id).sort().join(',');
  if(saved.ids !== current) return;
  try{
    const res = await fetch('/api/conversations/' + encodeURIComponent(saved.id));
    if(!res.ok) return;
    const data = await res.json();
    const messages = (data.messages || []).filter(m => m.role !== 'system');
    if(!messages.length) return;
    state.conversationId = saved.id;
    state.chat = messages.map(function(m){
      if(m.role === 'assistant'){
        return {
          role: 'ai',
          text: m.content,
          cites: m.citations || [],
          n: (data.scope && data.scope.count) || 0,
          model: m.model || ''
        };
      }
      return { role: 'user', text: m.content };
    });
  }catch(err){
    /* 恢复失败就当没有历史 */
  }
}

function batchProgressText(batch){

async function fetchAllMissing(){
  if(state.batchProgress) return;
  if(!apiOnline){ toast('未连接本地服务，无法抓取元数据'); return; }
  const papers = getFiltered().filter(p => p.needsReview);
  if(!papers.length) return;
  const batch = {done:0, total:papers.length};
  state.batchProgress = batch;
  renderListbar(papers);
  let ok = 0;
  let attempted = 0;
  let summary;
  try{
    for(const {id} of papers){
      const res = await fetch('/api/import/queue/fetch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({itemId:id, limit:1})
      });
      if(!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      ok += data.ok;
      attempted += data.total;
      batch.done++;
      $('#batchProgress').textContent = batchProgressText(batch);
    }
    summary = '补全 <b>' + ok + '</b> / ' + attempted + ' 篇' +
      (batch.total > attempted ? '，跳过 ' + (batch.total - attempted) + ' 篇' : '') +
      (attempted > ok ? '，其余可单篇抓取（扫描件会让模型读首页）' : '');
  }catch(err){
    summary = '批量抓取中断，已处理 ' + batch.done + '/' + batch.total + ' 篇，请稍后再试';
  }finally{
    await refreshPapers();
    state.batchProgress = null;
    renderListbar(getFiltered());
  }
  toast(summary);
}

function renderModal(){

    '<section class="mergesec">' +
      '<div class="slabel">手动合并 <span class="hint">把旧写法并到保留的写法</span></div>' +
      '<div class="addrow">' +
        '<select id="mergeFacet" aria-label="合并维度">' +

          '<option value="org">单位</option>' +

      '<datalist id="mergeFromList"></datalist>' +

  const groups = FACETS.map(function(f){

    });

      '<div class="libhead"><span>' + f.label + '</span><span>' + vals.length + '</span></div>' +
      '<div class="libvals">' + vals.map(function(v){
        const n = PAPERS.filter(p => p.tags[f.key].indexOf(v) !== -1).length;
        return '<span class="tag"><span class="taglabel">' + esc(v) + '</span><b>' + n + '</b></span>';
      }).join('') + '</div>' +

  modal.innerHTML = '<div class="modal-card">' +
    '<div class="mhead">' +
      '<div><h3>标签库</h3><p>' + summary + '</p></div>' +
      '<button class="btn icon" data-act="close-lib" title="关闭">' +
        '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">' +
          '<path d="M2 2l8 8M10 2l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>' +
        '</svg>' +
      '</button>' +
    '</div>' +
    mergeSection +
    '<section>' +
      '<div class="slabel">全部词表</div>' +
      groups +
    '</section>' +
    '<p class="mnote">合并会改写所有文献上的标签；旧名会记为别名，之后输入旧名仍指向新名。</p>' +
  '</div>';
  paintMergeOptions();
}

function paintMergeOptions(){
  const sel = $('#mergeFacet');
  if(!sel) return;
  const facet = sel.value;
  const values = Array.from(new Set(PAPERS.flatMap(p => p.tags[facet] || [])))
    .sort(function(a, b){ return a.localeCompare(b, 'zh'); });
  const options = values.map(v => '<option value="' + esc(v) + '"></option>').join('');
  const fromList = $('#mergeFromList');
  const toList = $('#mergeToList');
  if(fromList) fromList.innerHTML = options;
  if(toList) toList.innerHTML = options;

  const label = facet === 'author' ? '作者' : (facet === 'org' ? '单位' : '标签');
  const from = $('#mergeFrom');
  const to = $('#mergeToList');
  if(from) from.placeholder = '要并掉的' + label + '写法';
  if(to) to.placeholder = '保留的' + label + '写法';
}

function selectPaper(id){

/* ---------- 写入：先本地生效，再落库 ---------- */

const saveTimers = {};
const pendingPatch = {};

function scheduleSave(itemId, patch){
  if(!apiOnline) return;
  pendingPatch[itemId] = Object.assign(pendingPatch[itemId] || {}, patch);
  clearTimeout(saveTimers[itemId]);
  saveTimers[itemId] = setTimeout(function(){
    const body = pendingPatch[itemId];
    delete pendingPatch[itemId];
    delete saveTimers[itemId];
    fetch('/api/items/' + encodeURIComponent(itemId), {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    }).catch(function(){ toast('保存失败，改动只在本页'); });
  }, 600);
}

async function addTag(facet, value){
  const p = PAPERS.find(x => x.id === state.paperId);
  if(!p || !value) return;
  value = value.trim();
  if(!value) return;
  if(p.tags[facet].indexOf(value) !== -1){
    toast('这篇已经有「' + esc(value) + '」了');
    return;
  }

  if(facet === 'year') p.tags.year = [value];
  else p.tags[facet].push(value);
  renderAll();
  toast('已加入 <b>' + labelOf(facet) + '：' + esc(value) + '</b>');

  if(!apiOnline) return;
  try{
    const res = await fetch('/api/items/' + encodeURIComponent(p.id) + '/tags', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({facet: facet, name: value})
    });
    if(!res.ok) throw new Error('save');
    await refreshPapers();
  }catch(err){
    toast('保存失败，改动只在本页');
  }
}

async function removeTag(facet, value){
  const p = PAPERS.find(x => x.id === state.paperId);
  if(!p) return;
  if(facet === 'year') p.tags.year = [];
  else p.tags[facet] = p.tags[facet].filter(x => x !== value);
  renderAll();
  toast('已移除「' + esc(value) + '」');

  if(!apiOnline) return;
  try{
    const url = '/api/items/' + encodeURIComponent(p.id) + '/tags?facet=' +
      encodeURIComponent(facet) + '&name=' + encodeURIComponent(value);
    const res = await fetch(url, {method:'DELETE'});
    if(!res.ok) throw new Error('save');
    await refreshPapers();
  }catch(err){
    toast('保存失败，改动只在本页');
  }
}

async function mergeTags(facet, from, to){
  const s = state.selected[facet];
  if(s.has(from)){ s.delete(from); s.add(to); }

  if(apiOnline){
    try{
      const res = await fetch('/api/merge', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({facet: facet, from_name: from, to_name: to})
      });
      if(!res.ok) throw new Error('merge');
      await refreshPapers();
      toast('已合并：' + esc(from) + ' → <b>' + esc(to) + '</b>');
      renderModal();
      return;
    }catch(err){
      toast('合并失败');
      return;
    }
  }

  let n = 0;
  PAPERS.forEach(function(p){
    const arr = p.tags[facet];
    if(arr.indexOf(from) !== -1){
      p.tags[facet] = Array.from(new Set(arr.map(v => v === from ? to : v)));
      n++;
    }
  });
  toast('已合并 ' + n + ' 处：' + esc(from) + ' → <b>' + esc(to) + '</b>');
  renderAll();
  renderModal();
}

function syncScope(ps){
  const ids = (state.aiExpand ? PAPERS : ps).map(p => p.id).sort().join(',');
  if(state.scopeIds !== undefined && state.scopeIds !== ids && state.chat.length && !state.busy){
    state.chat = [];
    state.conversationId = null;
    forgetConversation();
    toast('范围变了，已开始新对话');
  }
  state.scopeIds = ids;
}

function renderAll(){
  let ps = getFiltered();
  if(!ps.length){
    state.paperId = null;
  } else if(!ps.some(p => p.id === state.paperId)){
    state.paperId = ps[0].id;
    state.pendingScroll = 'top';
  }
  syncScope(ps);
  renderFacets();
  renderListbar(ps);
  renderList(ps);
  renderDetail();
  if(state.modalOpen) renderModal();
}

/* 事件委托 */
document.addEventListener('click', function(e){
  if(e.target.id === 'modal'){
    if(state.modalMode === 'import') closeImportBrowser();
    else { state.modalOpen = false; renderModal(); }
    return;
  }

  const el = e.target.closest('[data-act]');
  if(!el) return;
  const act = el.dataset.act;

  if(act === 'toggle-facet'){ toggleFacet(el.dataset.facet, el.dataset.value); }
  else if(act === 'toggle-review'){
    state.reviewOnly = !state.reviewOnly;
    state.pendingScroll = 'top';
    renderAll();
  }
  else if(act === 'clear-facet'){
    state.selected[el.dataset.facet].delete(el.dataset.value);
    state.pendingScroll = 'top';
    renderAll();
  }
  else if(act === 'clear-all'){ clearAll(); }
  else if(act === 'reset-all'){ resetAll(); }
  else if(act === 'collapse'){
    const k = el.dataset.facet;
    if(state.collapsed.has(k)) state.collapsed.delete(k); else state.collapsed.add(k);
    renderFacets();
  }
  else if(act === 'more'){
    const k = el.dataset.facet;
    if(state.expanded.has(k)) state.expanded.delete(k); else state.expanded.add(k);
    renderFacets();
  }
  else if(act === 'toggle-facets'){ $('#app').classList.toggle('show-facets'); }
  else if(act === 'close-facets'){ $('#app').classList.remove('show-facets'); }
  else if(act === 'close-detail'){ $('#app').classList.remove('show-detail'); }
  else if(act === 'select'){ selectPaper(el.dataset.id); }
  else if(act === 'tab'){
    state.tab = el.dataset.tab;
    state.pendingScroll = state.tab === 'ai' ? 'bottom' : 'top';
    renderDetail();
  }
  else if(act === 'to-ai'){
    state.tab = 'ai';
    state.pendingScroll = 'bottom';
    renderDetail();
  }
  else if(act === 'status'){
    const p = PAPERS.find(x => x.id === state.paperId);
    if(!p) return;
    p.status = p.status === 'read' ? 'todo' : 'read';
    toast('已标记为 <b>' + statusLabel(p.status) + '</b>');
    renderAll();
    scheduleSave(p.id, {status: p.status});
  }
  else if(act === 'open-pdf'){ openReader(); }
  else if(act === 'reader-close'){ closeReader(); }
  else if(act === 'reader-prev'){ goToPage(pdfView.current - 1, true); }
  else if(act === 'reader-next'){ goToPage(pdfView.current + 1, true); }
  else if(act === 'reader-zoom-in'){ zoomBy(1.15); }
  else if(act === 'reader-zoom-out'){ zoomBy(1 / 1.15); }
  else if(act === 'reader-fit'){ fitWidth(); }
  else if(act === 'reader-rotate'){ rotatePage(); }
  else if(act === 'reader-attach'){ $('#attachInput').click(); }
  else if(act === 'copy-cite'){
    const p = PAPERS.find(x => x.id === state.paperId);
    if(!p) return;
    const year = (p.tags.year && p.tags.year[0]) || 'n.d.';
    const authors = (p.authors && p.authors.length) ? p.authors.join(', ') : '佚名';
    const venue = p.venue ? p.venue + ', ' : '';
    const text = authors + '. ' + p.title + '. ' + venue + year + '.';
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('引用已复制'); }, function(){ toast('复制失败，可手动选择'); });
    } else { toast('当前浏览器不支持自动复制'); }
  }
  else if(act === 'filter-tag'){
    const f = el.dataset.facet, v = el.dataset.value;
    state.selected[f].add(v);
    state.pendingScroll = 'top';
    renderAll();
    toast('已筛入 <b>' + labelOf(f) + '：' + esc(v) + '</b>');
  }
  else if(act === 'del-tag'){
    removeTag(el.dataset.facet, el.dataset.value);
  }
  else if(act === 'accept-sug'){
    const p = PAPERS.find(x => x.id === state.paperId);
    if(!p) return;
    const value = el.dataset.value;
    const box = state.sugg[p.id];
    if(box && box.items) box.items = box.items.filter(s => s.name !== value);
    addTag('topic', value);
  }
  else if(act === 'dismiss-sug'){
    const p = PAPERS.find(x => x.id === state.paperId);
    if(!p) return;
    state.dismissed.add(p.id + '|topic|' + el.dataset.value);
    renderDetail();
  }
  else if(act === 'gen-sug' || act === 'regen-sug'){
    loadSuggestions(state.paperId);
  }
  else if(act === 'add-tag'){
    addTag($('#addFacet').value, $('#addValue').value);
  }
  else if(act === 'quick'){ send(el.dataset.q); }
  else if(act === 'cite'){
    const page = parseInt(el.dataset.page || '0', 10) || 0;
    if(page > 0) citeJump(el.dataset.id, page);
    else selectPaper(el.dataset.id);
  }
  else if(act === 'expand-on'){ state.expandConfirm = true; renderDetail(); }
  else if(act === 'expand-cancel'){ state.expandConfirm = false; renderDetail(); }
  else if(act === 'expand-confirm'){
    state.expandConfirm = false;
    state.aiExpand = true;
    state.chat = [];
    state.conversationId = null;
    forgetConversation();
    renderAll();
    toast('范围已扩到<b>全库 ' + PAPERS.length + ' 篇</b>');
  }
  else if(act === 'expand-off'){
    state.aiExpand = false;
    state.chat = [];
    state.conversationId = null;
    forgetConversation();
    renderAll();
    toast('已缩回当前筛选');
  }
  else if(act === 'open-settings'){ openSettings(); }
  else if(act === 'close-settings'){ state.modalOpen = false; renderModal(); }
  else if(act === 'save-settings'){ saveAISettings(); }
  else if(act === 'clear-key'){ clearAIKey(); }
  else if(act === 'clear-chat'){
    state.chat = [];
    state.conversationId = null;
    forgetConversation();
    state.pendingScroll = 'top';
    renderDetail();
  }
  else if(act === 'open-lib'){ state.modalMode = 'tags'; state.modalOpen = true; renderModal(); }
  else if(act === 'close-lib'){ state.modalOpen = false; renderModal(); }
  else if(act === 'edit-meta'){ state.modalMode = 'meta'; state.modalOpen = true; renderModal(); }
  else if(act === 'close-meta'){ state.modalOpen = false; renderModal(); }
  else if(act === 'save-meta'){ saveMetaFields(); }
  else if(act === 'fetch-meta'){ fetchMeta(state.paperId); }
  else if(act === 'fetch-all'){ fetchAllMissing(); }
  else if(act === 'merge'){ mergeTags(el.dataset.facet, el.dataset.from, el.dataset.to); }
  else if(act === 'merge-manual'){
    const facet = $('#mergeFacet') ? $('#mergeFacet').value : 'topic';
    const from = $('#mergeFrom') ? $('#mergeFrom').value.trim() : '';
    const to = $('#mergeToList') ? $('#mergeToList').value.trim() : '';
    if(!from || !to){ toast('旧写法和保留写法都要填'); return; }
    if(from.toLowerCase() === to.toLowerCase()){ toast('两个写法相同，不需要合并'); return; }
    mergeTags(facet, from, to);
  }
  else if(act === 'import'){ openImportBrowser(el); }
  else if(act === 'import-close'){ closeImportBrowser(); }
  else if(act === 'import-roots'){ loadImportLocation(); }
  else if(act === 'import-up'){ loadImportLocation(importView.location?.parent); }
  else if(act === 'import-enter'){ loadImportLocation(el.dataset.path); }
  else if(act === 'import-all'){ toggleImportSelection(); }
  else if(act === 'import-selected'){ runLocalImport({paths:[...importView.selected]}); }
  else if(act === 'import-folder'){ runLocalImport({folder:importView.location?.path}); }
  else if(act === 'reconnect'){ boot(); }
  else if(act === 'theme'){
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    paintThemeBtn();
  }
});

document.addEventListener('keydown', function(e){
  if(state.readerOpen){
    if(e.key === 'Escape'){ e.preventDefault(); closeReader(); return; }
    if(e.key === 'ArrowRight'){ e.preventDefault(); goToPage(pdfView.current + 1, true); return; }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); goToPage(pdfView.current - 1, true); return; }
    if(e.key === '+' || e.key === '='){ e.preventDefault(); zoomBy(1.15); return; }
    if(e.key === '-'){ e.preventDefault(); zoomBy(1 / 1.15); return; }
  }
  if(e.key === 'Escape' && state.modalOpen){
    if(state.modalMode === 'import'){ closeImportBrowser(); return; }
    state.modalOpen = false;
    renderModal();
    return;
  }
  if(state.modalOpen && state.modalMode === 'import'){
    if(e.key === 'Tab'){
      const controls = $$('#modal button:not(:disabled), #modal input:not(:disabled)');
      const first = controls[0], last = controls[controls.length - 1];
      if(controls.length && (!$('#modal').contains(document.activeElement) ||
          document.activeElement === (e.shiftKey ? first : last))){
        e.preventDefault();
        (e.shiftKey ? last : first).focus();
      }
    }
    return;
  }
  if(e.key === '/' && !state.readerOpen && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    e.preventDefault();
    $('#search').focus();
  }
  if(e.key === 'Enter' && e.target.id === 'addValue'){
    e.preventDefault();
    addTag($('#addFacet').value, e.target.value);
    return;
  }
  if(e.key === 'Enter' && e.target.matches('.paper')){
    e.preventDefault();
    selectPaper(e.target.dataset.id);
  }
});

/* ============================================================
   PDF 阅读器（只读，不做批注）
   ============================================================ */
const pdfView = {
  doc:null, itemId:null, scale:1, fitScale:1, fit:true, rotation:0,
  pages:[], io:null, current:1, seq:0
};

function currentPaper(){
  return PAPERS.find(x => x.id === state.paperId) || null;
}

function setReaderLoading(on, text){
  const el = $('#readerLoading');
  if(!el) return;
  if(text) el.textContent = text;
  el.classList.toggle('show', !!on);
}

function updateReaderChrome(){
  const total = pdfView.doc ? pdfView.doc.numPages : 0;
  const page = $('#readerPage');
  if(page) page.textContent = total ? (pdfView.current + ' / ' + total) : '– / –';
  const z = $('#readerZoom');
  if(z){
    const pct = pdfView.fitScale ? Math.round(pdfView.scale / pdfView.fitScale * 100) : 100;
    z.textContent = pdfView.fit ? '适应宽度' : pct + '%';
  }
  const prev = $('[data-act="reader-prev"]');
  const next = $('[data-act="reader-next"]');
  if(prev) prev.disabled = !total || pdfView.current <= 1;
  if(next) next.disabled = !total || pdfView.current >= total;
}

function destroyPdf(){
  if(pdfView.io){ pdfView.io.disconnect(); pdfView.io = null; }
  pdfView.pages.forEach(function(ps){
    if(ps.task){ try { ps.task.cancel(); } catch(err) { /* 已结束 */ } }
  });
  if(pdfView.doc){
    try { pdfView.doc.destroy(); } catch(err) { /* 已在销毁 */ }
    pdfView.doc = null;
  }
  pdfView.pages = [];
  pdfView.current = 1;
  pdfView.itemId = null;
  pdfView.scale = 1;
  pdfView.fitScale = 1;
  pdfView.fit = true;
  pdfView.rotation = 0;
}

function rememberPosition(){
  if(!pdfView.itemId) return;
  try{ localStorage.setItem('colophon:pos:' + pdfView.itemId, String(pdfView.current)); }catch(err){ /* 隐私模式 */ }
}

function readerMissing(item){
  destroyPdf();
  pdfView.itemId = item.id;
  const body = $('#readerBody');
  body.classList.add('blank');
  body.innerHTML =
    '<div class="rmissing">' +
      '<div class="em">▤</div>' +
      '<p>这条还没有托管 PDF。<br>补上之后就能在这里读，原文件不会被移动。</p>' +
      '<button class="btn primary" data-act="reader-attach">选择 PDF 文件</button>' +
    '</div>';
  updateReaderChrome();
  setReaderLoading(false);
}

function openReader(){
  const p = currentPaper();
  if(!p) return;
  state.readerOpen = true;
  $('#reader').hidden = false;
  $('#readerTitle').innerHTML =
    '<span>' + esc(p.title || '未命名') + '</span>' +
    (p.fileName ? '<span class="rname">' + esc(p.fileName) + '</span>' : '');
  const body = $('#readerBody');
  body.classList.remove('blank');
  body.innerHTML = '';

  if(!p.hasFile){ readerMissing(p); return; }
  if(pdfView.itemId !== p.id) loadPdf(p);

  if(p.status === 'todo'){
    p.status = 'reading';
    scheduleSave(p.id, { status:'reading' });
    renderAll();
  }
}

function closeReader(){
  if(!state.readerOpen) return;
  rememberPosition();
  state.readerOpen = false;
  $('#reader').hidden = true;
  const body = $('#readerBody');
  body.innerHTML = '';
  body.classList.remove('blank');
  setReaderLoading(false);
  destroyPdf();
}

async function loadPdf(p){
  destroyPdf();
  pdfView.itemId = p.id;
  const body = $('#readerBody');
  body.innerHTML = '';
  body.classList.remove('blank');
  setReaderLoading(true, '正在载入 PDF…');
  updateReaderChrome();

  if(!window.pdfjsLib){
    setReaderLoading(false);
    body.classList.add('blank');
    body.innerHTML = '<div class="rmissing"><div class="em">⚠</div><p>PDF 组件没有加载成功。<br>请确认 web/vendor/pdfjs/ 下的文件存在。</p></div>';
    return;
  }

  try{
    const doc = await pdfjsLib.getDocument({
      url: '/api/items/' + encodeURIComponent(p.id) + '/file'
    }).promise;
    if(!state.readerOpen || pdfView.itemId !== p.id){
      try { doc.destroy(); } catch(err) { /* 已关闭 */ }
      return;
    }
    pdfView.doc = doc;
    await buildPages();
    setReaderLoading(false);
    updateReaderChrome();
  }catch(err){
    setReaderLoading(false);
    body.classList.add('blank');
    body.innerHTML =
      '<div class="rmissing">' +
        '<div class="em">⚠</div>' +
        '<p>这个 PDF 打不开。文件可能已损坏，或已不在原来的位置。</p>' +
        '<button class="btn" data-act="reader-close">关闭</button>' +
      '</div>';
    updateReaderChrome();
  }
}

async function buildPages(){
  const doc = pdfView.doc;
  if(!doc) return;
  const body = $('#readerBody');
  const first = await doc.getPage(1);
  const base = first.getViewport({ scale:1, rotation: pdfView.rotation });
  const avail = Math.max(240, body.clientWidth - 48);
  pdfView.fit = true;
  pdfView.scale = Math.max(0.3, Math.min(3, avail / base.width));
  pdfView.fitScale = pdfView.scale;

  // 先恢复上次的页码，再建页；否则 rebuild 会把位置写成第 1 页。
  const saved = Number(localStorage.getItem('colophon:pos:' + pdfView.itemId)) || 1;
  pdfView.current = Math.min(Math.max(1, saved), doc.numPages);

  await rebuildPages();
}

async function rebuildPages(){
  const doc = pdfView.doc;
  if(!doc) return;
  const body = $('#readerBody');
  const keep = pdfView.current || 1;

  if(pdfView.io){ pdfView.io.disconnect(); pdfView.io = null; }
  pdfView.pages.forEach(function(ps){
    if(ps.task){ try { ps.task.cancel(); } catch(err) { /* 已结束 */ } }
  });
  pdfView.pages = [];
  body.innerHTML = '';

  const frag = document.createDocumentFragment();
  for(let n = 1; n <= doc.numPages; n++){
    const page = await doc.getPage(n);
    const vp = page.getViewport({ scale: pdfView.scale, rotation: pdfView.rotation });
    const wrap = document.createElement('div');
    wrap.className = 'rpage-wrap';
    wrap.dataset.page = String(n);
    wrap.style.width = Math.floor(vp.width) + 'px';
    wrap.style.height = Math.floor(vp.height) + 'px';
    const canvas = document.createElement('canvas');
    const label = document.createElement('span');
    label.className = 'rpage-n';
    label.textContent = String(n);
    wrap.append(canvas, label);
    frag.appendChild(wrap);
    pdfView.pages.push({
      n, page, wrap, canvas,
      rendered:false, rendering:false, failed:false, task:null
    });
  }
  body.appendChild(frag);
  observePages();
  renderPage(keep);
  updateReaderChrome();
  goToPage(keep, false);
}

function observePages(){
  if(pdfView.io){ pdfView.io.disconnect(); pdfView.io = null; }
  const root = $('#readerBody');
  pdfView.io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting) renderPage(Number(entry.target.dataset.page));
    });
  }, { root: root, rootMargin: '800px 0px' });
  pdfView.pages.forEach(function(ps){
    if(!ps.rendered && !ps.failed) pdfView.io.observe(ps.wrap);
  });
}

async function renderPage(n){
  const ps = pdfView.pages.find(function(p){ return p.n === n; });
  if(!ps || ps.rendered || ps.rendering || ps.failed) return;
  ps.rendering = true;
  try{
    const vp = ps.page.getViewport({ scale: pdfView.scale, rotation: pdfView.rotation });
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor(vp.width);
    const h = Math.floor(vp.height);
    ps.wrap.style.width = w + 'px';
    ps.wrap.style.height = h + 'px';
    ps.canvas.width = Math.floor(w * dpr);
    ps.canvas.height = Math.floor(h * dpr);
    ps.canvas.style.width = w + 'px';
    ps.canvas.style.height = h + 'px';
    const ctx = ps.canvas.getContext('2d', { alpha:false });
    ps.task = ps.page.render({
      canvasContext: ctx,
      viewport: vp,
      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null
    });
    await ps.task.promise;
    ps.task = null;
    ps.rendered = true;
    if(pdfView.io) pdfView.io.unobserve(ps.wrap);
  }catch(err){
    ps.task = null;
    ps.rendered = false;
    if(err && err.name === 'RenderingCancelledException') return;
    ps.failed = true;
    console.error('PDF 页渲染失败', n, err);
  }finally{
    ps.rendering = false;
  }
}

function goToPage(n, smooth){
  const doc = pdfView.doc;
  if(!doc) return;
  const target = Math.min(Math.max(1, n), doc.numPages);
  const ps = pdfView.pages.find(function(p){ return p.n === target; });
  const body = $('#readerBody');
  if(!ps || !body) return;
  pdfView.current = target;
  renderPage(target);
  body.scrollTo({ top: Math.max(0, ps.wrap.offsetTop - 8), behavior: smooth ? 'smooth' : 'auto' });
  updateReaderChrome();
  rememberPosition();
}

function syncCurrentPage(){
  if(!pdfView.doc || !pdfView.pages.length) return;
  const body = $('#readerBody');
  const mark = body.scrollTop + Math.min(body.clientHeight * 0.4, 320);
  let cur = 1;
  pdfView.pages.forEach(function(ps){
    if(ps.wrap.offsetTop <= mark) cur = ps.n;
  });
  if(cur !== pdfView.current){
    pdfView.current = cur;
    updateReaderChrome();
    rememberPosition();
  }
}

async function zoomBy(factor){
  if(!pdfView.doc) return;
  const base = pdfView.fitScale || pdfView.scale;
  const rel = pdfView.fit ? 1 : pdfView.scale / base;
  const nextRel = Math.min(4, Math.max(0.25, rel * factor));
  pdfView.fit = false;
  pdfView.scale = base * nextRel;
  updateReaderChrome();
  await rebuildPages();
}

async function fitWidth(){
  if(!pdfView.doc) return;
  const first = await pdfView.doc.getPage(1);
  const base = first.getViewport({ scale:1, rotation: pdfView.rotation });
  const body = $('#readerBody');
  const avail = Math.max(240, body.clientWidth - 48);
  pdfView.fit = true;
  pdfView.scale = Math.max(0.3, Math.min(3, avail / base.width));
  pdfView.fitScale = pdfView.scale;
  updateReaderChrome();
  await rebuildPages();
}

async function rotatePage(){
  if(!pdfView.doc) return;
  const rel = pdfView.fit ? 1 : pdfView.scale / (pdfView.fitScale || pdfView.scale);
  pdfView.rotation = (pdfView.rotation + 90) % 360;
  const first = await pdfView.doc.getPage(1);
  const base = first.getViewport({ scale:1, rotation: pdfView.rotation });
  const body = $('#readerBody');
  const avail = Math.max(240, body.clientWidth - 48);
  pdfView.fitScale = Math.max(0.3, Math.min(3, avail / base.width));
  pdfView.scale = pdfView.fit ? pdfView.fitScale : pdfView.fitScale * rel;
  updateReaderChrome();
  await rebuildPages();
}

async function attachPdfTo(itemId, file){
  if(!file) return;
  if(!apiOnline){ toast('未连接本地服务，无法上传 PDF'); return; }
  if(!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf'){ toast('只接受 PDF 文件'); return; }
  const fd = new FormData();
  fd.append('files', file, file.name);
  setReaderLoading(true, '正在上传…');
  try{
    const res = await fetch('/api/items/' + encodeURIComponent(itemId) + '/file', { method:'POST', body: fd });
    if(!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    setReaderLoading(false);
    if(data.status === 'duplicate' && data.item_id && data.item_id !== itemId){
      toast('这个文件已经在库里的另一条上，已跳过去');
      state.paperId = data.item_id;
      state.tab = 'overview';
      renderAll();
      openReader();
      return;
    }
    await refreshPapers();
    const p = PAPERS.find(function(x){ return x.id === itemId; });
    if(!p || !p.hasFile){ toast('上传后没有找到这个文件'); return; }
    loadPdf(p);
  }catch(err){
    setReaderLoading(false);
    toast('上传失败，请检查本地服务是否在运行');
  }
}

let readerResizeTimer = null;
window.addEventListener('resize', function(){
  if(!state.readerOpen || !pdfView.doc) return;
  clearTimeout(readerResizeTimer);
  readerResizeTimer = setTimeout(function(){
    if(pdfView.fit) fitWidth(); else rebuildPages();
  }, 200);
});

/* ============================================================
   与后端同步
   ============================================================ */
async function fetchPapers(){
  const res = await fetch('/api/items', {cache:'no-store'});
  if(!res.ok) throw new Error('http ' + res.status);
  const data = await res.json();
  if(!Array.isArray(data.items)) throw new Error('bad payload');
  return data.items;
}

async function refreshPapers(){
  if(!apiOnline) return;
  try{
    PAPERS = await fetchPapers();
    renderAll();
  }catch(err){
    toast('读取书库失败，界面可能不是最新');
  }
}

const importView = {
  anchor:null, location:null, roots:[], selected:new Set(), loading:false,
  importing:false, message:'', sequence:0
};

function openImportBrowser(anchor){
  importView.anchor = anchor;
  state.modalOpen = true;
  state.modalMode = 'import';
  loadImportLocation(importView.location?.path, !importView.location);
}

function closeImportBrowser(){
  if(importView.importing) return;
  importView.sequence++;
  importView.loading = false;
  state.modalOpen = false;
  renderModal();
  importView.anchor?.focus();
}

async function importResponse(url, options){
  const res = await fetch(url, {
    ...options, headers:{...options?.headers, 'X-Colophon-Import':'1'}
  });
  const data = await res.json().catch(() => null);
  if(!res.ok || !data){
    throw new Error(typeof data?.detail === 'string' ? data.detail : '请求失败（HTTP ' + res.status + '）');
  }
  return data;
}

async function loadImportLocation(path, startAtDesktop = false){
  if(importView.importing) return;
  const seq = ++importView.sequence;
  importView.loading = true;
  importView.message = '';
  renderImportModal();
  try{
    const data = await importResponse('/api/fs/list' + (path ? '?path=' + encodeURIComponent(path) : ''));
    if(seq !== importView.sequence) return;
    importView.location = data;
    importView.selected.clear();
    if(!data.path) importView.roots = data.roots;
    const desktop = startAtDesktop && importView.roots.find(entry => entry.kind === 'desktop');
    if(desktop){
      const contents = await importResponse('/api/fs/list?path=' + encodeURIComponent(desktop.path));
      if(seq === importView.sequence) importView.location = contents;
    }
  }catch(err){
    if(seq === importView.sequence) importView.message = err.message;
  }finally{
    if(seq === importView.sequence){
      importView.loading = false;
      renderImportModal();
    }
  }
}

function importIcon(kind){
  const paths = {
    desktop:'<rect x="2" y="2.5" width="12" height="8.5" rx="1"/><path d="M8 11v3m-3 0h6"/>',
    downloads:'<path d="M8 2v8m-3-3 3 3 3-3M3 11v2.5h10V11"/>',
    documents:'<path d="M4 2h5l3 3v9H4zM9 2v3h3M6 8h4m-4 3h4"/>',
    home:'<path d="m2 7 6-5 6 5m-10-1v8h8V6m-6 8v-4h4v4"/>',
    drive:'<rect x="2" y="4" width="12" height="8" rx="1"/><path d="M2 9h12m-3 1.5h1"/>',
    folder:'<path d="M2 12.5V4h4.5L8 5.5h6v7z"/>',
    up:'<path d="M8 13V3M4 7l4-4 4 4"/>'
  };
  return '<svg class="impicon" viewBox="0 0 16 16" fill="none" stroke="currentColor"' +
    ' stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (paths[kind] || paths.folder) + '</svg>';
}

function renderImportModal(){
  const modal = $('#modal');
  const {location, selected, loading, importing, message} = importView;
  const busy = loading || importing;
  const disabled = busy ? ' disabled' : '';
  const locationName = importView.roots.find(entry => entry.path === location?.path)?.name;
  const shortcut = entry => '<button data-act="import-enter" data-path="' + esc(entry.path) + '"' + disabled +
    (entry.path === location?.path ? ' aria-current="location"' : '') + ' title="' + esc(entry.path) + '">' +
    importIcon(entry.kind) + '<span class="impname">' + esc(entry.name) + '</span></button>';
  const sidebar = importView.roots.filter(entry => entry.kind !== 'drive').map(shortcut).join('') +
    (importView.roots.some(entry => entry.kind === 'drive') ? '<h4>此电脑</h4>' +
      importView.roots.filter(entry => entry.kind === 'drive').map(shortcut).join('') : '');
  const directoryRow = (entry, hint) =>
    '<button class="improw" data-act="import-enter" data-path="' + esc(entry.path) + '"' + disabled + '>' +
      importIcon(entry.kind) + '<span class="impname">' + esc(entry.name) + '</span>' +
      '<span class="impsize">' + esc(hint) + '</span></button>';
  let rows = '';
  if(location?.path){
    rows = location.dirs.map(entry => directoryRow(entry, '文件夹')).join('') +
      location.files.map(file => '<label class="improw" title="' + esc(file.name) + '">' +
        '<input type="checkbox" data-import-check data-path="' + esc(file.path) + '"' +
        (selected.has(file.path) ? ' checked' : '') + disabled + '>' +
        '<span class="impname">' + esc(file.name) + '</span><span class="impsize">PDF</span></label>').join('');
  }else if(location){
    rows = location.roots.map(entry => directoryRow(entry, entry.path)).join('');
  }

  modal.classList.add('open');
  modal.innerHTML = '<div class="modal-card import-card" role="dialog" aria-modal="true" aria-labelledby="importTitle">' +
    '<div class="mhead"><h3 id="importTitle">导入</h3>' +
      '<button class="btn icon" data-act="import-close" aria-label="关闭" title="关闭"' +
        (importing ? ' disabled' : '') + '>×</button></div>' +
    '<div class="importbar"><button class="btn tiny icon" data-act="import-roots" title="常用位置" aria-label="常用位置"' +
      disabled + '>' + importIcon('home') + '</button>' +
      '<button class="btn tiny icon" data-act="import-up" title="上一级" aria-label="上一级"' +
      (location?.parent && !busy ? '' : ' disabled') + '>' + importIcon('up') + '</button>' +
      '<div class="importpath" title="' + esc(location?.path || '') + '">' +
      esc(locationName ? locationName + (locationName !== location.path ? '  ›  ' + location.path : '') : location?.path || '常用位置') + '</div></div>' +
    '<div class="importpane"><nav class="importnav" aria-label="常用位置与磁盘">' + sidebar + '</nav>' +
      '<div class="importbody" aria-busy="' + busy + '">' +
      '<div class="impcolumns"><span>名称</span><span>' + (location?.path ? '类型' : '位置') + '</span></div>' +
      (rows || '<div class="impempty">' + (loading ? '正在读取…' : location?.path ? '没有子文件夹或 PDF' : '没有可显示的位置') +
      '</div>') + '</div></div>' +
    (message ? '<p class="impmessage" role="status">' + esc(message) + '</p>' : '') +
    '<div class="importfoot"><div class="importsum"><span id="importCount" role="status"></span>' +
      (location?.files.length && !busy ? ' · <button class="linkbtn" data-act="import-all"></button>' : '') + '</div>' +
      '<div class="importacts"><button class="btn primary" data-act="import-selected"></button>' +
      '<button class="btn" data-act="import-folder"' + (location?.path && !busy ? '' : ' disabled') +
        '>导入当前文件夹（含子文件夹）</button></div></div></div>';
  paintImportSelection();
  if(!modal.contains(document.activeElement)){
    const card = $('.import-card', modal);
    card.tabIndex = -1;
    card.focus({preventScroll:true});
  }
}

function paintImportSelection(){
  const {location, selected, loading, importing} = importView;
  const count = selected.size;
  $('#importCount').textContent = importing ? '正在导入…' : loading ? '正在读取…' : location?.path
    ? (location.truncated ? '仅显示前 ' : '') + location.files.length + ' 个 PDF · 已选 ' + count
    : '选择一个位置';
  const button = $('[data-act="import-selected"]');
  button.disabled = !count || loading || importing;
  button.textContent = '导入选中的 PDF' + (count ? '（' + count + '）' : '');
  const all = $('[data-act="import-all"]');
  if(all) all.textContent = count === location.files.length ? '取消全选' : '全选';
}

function toggleImportSelection(){
  const {location, selected, loading, importing} = importView;
  if(loading || importing || !location?.files.length) return;
  const checked = selected.size !== location.files.length;
  selected.clear();
  if(checked) location.files.forEach(file => selected.add(file.path));
  $$('[data-import-check]').forEach(input => { input.checked = checked; });
  paintImportSelection();
}

async function runLocalImport(payload){
  if(importView.loading || importView.importing || (!payload.folder && !payload.paths?.length)) return;
  importView.importing = true;
  importView.message = '';
  renderImportModal();
  let data;
  try{
    data = await importResponse('/api/import/paths', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
    });
  }catch(err){
    importView.message = '导入失败：' + err.message;
  }finally{
    importView.importing = false;
  }
  if(!data){
    renderImportModal();
    return;
  }

  const parts = [];
  if(data.imported) parts.push(data.imported + ' 篇已入库');
  if(data.duplicates) parts.push(data.duplicates + ' 篇重复跳过');
  if(data.errors.length) parts.push(data.errors.length + ' 项失败');
  const summary = parts.join(' · ') || '没有找到可导入的 PDF';
  if(!data.imported && !data.duplicates){
    importView.message = summary;
    renderImportModal();
    return;
  }

  closeImportBrowser();
  toast(summary);
  if(data.imported) await refreshPapers();
}

async function boot(){
  try{
    PAPERS = await fetchPapers();
    apiOnline = true;
  }catch(err){
    PAPERS = [];
    apiOnline = false;
  }
  if(!PAPERS.length){
    state.paperId = null;
  }
  if(apiOnline){
    await loadAISettings();
    await restoreConversation();
  }
  paintThemeBtn();
  paintAddOptions();
  renderAll();
  if(!apiOnline){
    toast('连不上本地服务，请确认 run.py 还在运行，然后刷新页面');
  }
}

/* ============================================================
   收尾
   ============================================================ */
function paintThemeBtn(){
  const dark = document.documentElement.dataset.theme === 'dark';
  const btn = $('#themeBtn');
  if(!btn) return;
  btn.innerHTML = dark
    ? '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8h1.4M13 8h1.4M3.5 3.5l1 1M11.5 11.5l1 1M12.5 3.5l-1 1M4.5 11.5l-1 1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M13.4 9.6A5.6 5.6 0 0 1 6.4 2.6a5.6 5.6 0 1 0 7 7Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  btn.title = dark ? '切换浅色' : '切换深色';
}

function paintAddOptions(){
  const sel = $('#addFacet');
  const list = $('#addList');
  const input = $('#addValue');
  if(!sel || !list || !input) return;
  const f = sel.value;
  const vals = Array.from(new Set(PAPERS.flatMap(p => p.tags[f])));
  list.innerHTML = vals.map(v => '<option value="' + esc(v) + '"></option>').join('');
  input.placeholder = f === 'year' ? '例如 2026' : '输入或选择，回车添加';
}

/* 启动：只认本地服务，连不上就显示重连提示 */
boot();
