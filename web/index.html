function removeDeletedTagsFromPapers(papers){
  if(!deletedTagIds.size) return;
  for(const paper of papers){
    const ids = paper.topicIds;
    if(!ids?.some(id => deletedTagIds.has(id))) continue;
    paper.tags.topic = paper.tags.topic.filter((_, index) => !deletedTagIds.has(ids[index]));
    paper.topicIds = ids.filter(id => !deletedTagIds.has(id));
  }
}

async function fetchPapers(){
  const res = await fetch('/api/items', {cache:'no-store'});
  if(!res.ok) throw new Error('http ' + res.status);
  const data = await res.json();
  if(!Array.isArray(data.items)) throw new Error('bad payload');
  removeDeletedTagsFromPapers(data.items);
  return data.items;
}

async function refreshPapers(){
  if(!apiOnline) return;
  try{
    const pendingNotes = new Set([...Object.keys(activeSaves), ...Object.keys(pendingPatch).filter(id => 'note_md' in pendingPatch[id])]);
    const fresh = await fetchPapers();
    for(const paper of fresh){
      if(pendingNotes.has(paper.id) || pendingPatch[paper.id]?.note_md !== undefined){
        const local = PAPERS.find(p => p.id === paper.id);
        if(local) paper.note = local.note;
      }
    }
    PAPERS = fresh.filter(p => !deletedPaperIds.has(p.id));
    state.eval = null;
    await refreshGroups();
    renderAll();
  }catch(err){
    toast('读取书库失败，界面可能不是最新');
  }
}

  importView.loading = false;
  state.modalOpen = false;
  renderModal();

async function importResponse(url, options){
  const res = await fetch(url, {
    ...options, headers:{...options?.headers, 'X-Colophon-Import':'1'}
  });
  const data = await res.json().catch(() => null);
  if(!res.ok || !data){
    throw new Error(typeof data?.detail === 'string' ? data.detail : '请求失败（HTTP ' + res.status + '）');
  }
  return data;
}

async function loadImportLocation(path, startAtDesktop = false){
  if(importView.importing) return;
  const seq = ++importView.sequence;
  importView.loading = true;
  importView.message = '';
  renderImportModal();
  try{
    const listLocation = path => importResponse('/api/fs/list?kind=' + importView.kind + (path ? '&path=' + encodeURIComponent(path) : ''));
    const data = await listLocation(path);
    if(seq !== importView.sequence) return;
    importView.location = data;
    importView.selected.clear();
    if(!data.path) importView.roots = data.roots;
    const desktop = startAtDesktop && importView.roots.find(entry => entry.kind === 'desktop');
    if(desktop){
      const contents = await listLocation(desktop.path);
      if(seq === importView.sequence) importView.location = contents;
    }
  }catch(err){
    if(seq === importView.sequence) importView.message = err.message;
  }finally{
    if(seq === importView.sequence){
      importView.loading = false;
      renderImportModal();
    }
  }
}

function paintImportSelection(){
  const {location, selected, loading, importing} = importView;

  $('#importCount').textContent = importing ? '正在导入…' : loading ? '正在读取…' : location?.path
    ? (location.truncated ? '仅显示前 ' : '') + location.files.length + (importView.kind === 'share' ? ' 个分享包 · 已选 ' : ' 个 PDF · 已选 ') + count
    : '选择一个位置';
  const button = $('[data-act="import-selected"]');
  button.disabled = !count || loading || importing;
  button.textContent = importView.kind === 'share' ? '预览导入' : '导入选中的 PDF' + (count ? '（' + count + '）' : '');
  const all = $('[data-act="import-all"]');
  if(all) all.textContent = count === location.files.length ? '取消全选' : '全选';

function toggleImportSelection(){
  const {location, selected, loading, importing} = importView;
  if(loading || importing || !location?.files.length) return;
  const checked = selected.size !== location.files.length;
  selected.clear();
  if(checked) location.files.forEach(file => selected.add(file.path));
  $$('[data-import-check]').forEach(input => { input.checked = checked; });
  paintImportSelection();
}

async function runLocalImport(payload){
  if(importView.loading || importView.importing || (!payload.folder && !payload.paths?.length)) return;
  importView.importing = true;
  importView.message = '';
  renderImportModal();
  let data;
  try{
    data = await importResponse('/api/import/paths', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
    });
  }catch(err){
    importView.message = '导入失败：' + err.message;
  }finally{
    importView.importing = false;
  }
  if(!data){
    renderImportModal();
    return;
  }

  const parts = [];
  if(data.imported) parts.push(data.imported + ' 篇已入库，可在「文献整理」中处理');
  if(data.attached) parts.push(data.attached + ' 篇已补上 PDF');
  if(data.duplicates) parts.push(data.duplicates + ' 篇重复跳过');
  if(data.errors.length) parts.push(data.errors.length + ' 项失败');
  const summary = parts.join(' · ') || '没有找到可导入的 PDF';
  if(!data.imported && !data.attached && !data.duplicates){
    importView.message = summary + (data.errors[0]?.reason ? '：' + data.errors[0].reason : '');
    renderImportModal();
    return;
  }

  closeImportBrowser();
  toast(summary);
  if(data.imported || data.attached) await refreshPapers();
}

  const tagJoin = shareSelect('shareTagJoin',filter.tagQuery.op,'标签组合',[['and','包含全部标签'],['or','包含任一标签']]);
  const star = getGroupFilter(Retrieval.STAR_GROUP,'any',facets).terms.length > 0;
  return section(Retrieval.YEAR_GROUP,'年份',yearOptions,yearRange) + metadata +
    section('tags','内容标签',tagOptions,tagJoin,Boolean(tagOptions)) + shareCheck('仅星标','star','',star);

function shareResults(){
  const {papers, scope, facets, filter, sort, range} = shareView;
  const pool = scope === 'all' ? papers : papers.filter(p => labelState(p) === scope);
  const year = getGroupFilter(Retrieval.YEAR_GROUP,'any',facets);
  const groups = [
    {kind:Retrieval.YEAR, group_id:Retrieval.YEAR_GROUP, terms:year.terms.slice(), includeUnknown:year.includeUnknown},
    ...shareView.choices.filter(g => g.kind === Retrieval.META).map(g =>
      ({kind:g.kind, group_id:g.group_id, op:'any', terms:getGroupFilter(g.group_id,'any',facets).terms})),
    {kind:Retrieval.ATTR, group_id:Retrieval.STAR_GROUP, terms:getGroupFilter(Retrieval.STAR_GROUP,'any',facets).terms},
  ];
  if(range.from != null && range.to != null) groups[0].terms.push({range:[range.from,range.to]});
  return Retrieval.evaluate(pool,{...filter,groups}).matched.slice().sort((a,b) => sorter(a,b,sort));
}

    (shareView.selected.has(p.id) ? ' checked' : '') + '><span>' + esc(p.title) + '<small>' +
    esc([p.year,p.authors.join('、'),p.venue,LABEL_STATE_LABELS[labelState(p)]].filter(Boolean).join(' · ')) + '</small>' +
    (p.hasFile ? '' : '<span class="no-pdf-label" title="无 PDF 附件">' + importIcon('metadata') + '仅元数据</span>') + '</span></label>').join('') ||
    '<div class="impempty">没有符合条件的文献</div>';
  results.scrollTop = 0;
  for(const badge of $$('[data-share-count]')){
    const key = badge.dataset.shareCount;
    const {facets,filter,range} = shareView;
    const count = key === 'tags' ? filter.tagQuery.include.length + filter.tagQuery.exclude.length :
      getGroupFilter(key,'any',facets).terms.length + (key === Retrieval.YEAR_GROUP && range.from != null && range.to != null ? 1 : 0);
    badge.textContent = count || '';
    if(key === Retrieval.YEAR_GROUP && !getGroupFilter(key,'any',facets).includeUnknown) badge.textContent = count + 1;
  }
  paintShareCount();
}

function paintShareCount(){
  const checks = $$('#shareResults input');
  const visible = checks.filter(input => input.checked).length;
  const count = shareView.selected.size;
  const hidden = count - visible;
  $('#shareResultCount').textContent = checks.length + ' 篇结果';
  $('#shareCount').textContent = '已选 ' + count + ' 篇' + (hidden ? '（' + hidden + ' 篇不在当前结果）' : '');
  const all = $('[data-act="share-all"]');
  all.disabled = !checks.length;
  all.textContent = visible === checks.length && visible ? '取消全选当前结果' : '全选当前结果';
  $('[data-act="share-confirm"]').disabled = !count;
}

function toggleShareSelection(){
  const checks = $$('#shareResults input');
  const checked = !checks.every(input => input.checked);
  for(const input of checks){
    input.checked = checked;
    if(checked) shareView.selected.add(input.value);
    else shareView.selected.delete(input.value);
  }
  paintShareCount();
}

function resetShareFilters(){
  shareView.facets = initialFacets();
  shareView.range = {};
  shareView.filter = {q:'',tagQuery:{op:'and',include:[],exclude:[]}};
  renderShareModal();
}

function findShareTerms(input){
  const panel = input.closest('.share-filter-panel');
  const query = input.value.trim().toLocaleLowerCase();
  let matches = 0;
  for(const term of $$('[data-share-term]',panel)){
    term.hidden = !term.dataset.shareTerm.toLocaleLowerCase().includes(query);
    if(!term.hidden) matches++;
  }
  for(const group of $$('[data-share-tag-group]',panel)) group.hidden = !$('[data-share-term]:not([hidden])',group);
  $('[data-share-find-empty]',panel).hidden = Boolean(matches);
}

function changeShareOption(input){
  const {facets, filter, selected, range} = shareView;
  const {value, checked, id} = input;
  const opt = input.dataset.shareOption;
  if(opt === 'item'){
    if(checked) selected.add(value);
    else selected.delete(value);
    paintShareCount();
    return;
  }
  if(id === 'shareGroups' || id === 'shareNotes'){
    shareView[id === 'shareGroups' ? 'groups' : 'notes'] = checked;
    return;
  }
  if(id === 'shareScope') shareView.scope = value;
  else if(id === 'shareSort') shareView.sort = value;
  else if(id === 'shareTagJoin') filter.tagQuery.op = value;
  else if(id === 'shareYearFrom' || id === 'shareYearTo') range[id === 'shareYearFrom' ? 'from' : 'to'] = value ? Number(value) : null;
  else if(opt === 'include' || opt === 'exclude'){
    filter.tagQuery[opt] = filter.tagQuery[opt].filter(tag => tag !== value);
    if(checked){
      filter.tagQuery[opt].push(value);
      const other = opt === 'include' ? 'exclude' : 'include';
      filter.tagQuery[other] = filter.tagQuery[other].filter(tag => tag !== value);
      $$('.share-filters input').find(el => el.dataset.shareOption === other && el.value === value).checked = false;
    }
  }else if(opt === 'unknown') getGroupFilter(Retrieval.YEAR_GROUP,'any',facets).includeUnknown = checked;
  else if(opt === 'star') getGroupFilter(Retrieval.STAR_GROUP,'any',facets).terms = checked ? [{star:true}] : [];
  else if(opt === 'year-range'){
    const year = getGroupFilter(Retrieval.YEAR_GROUP,'any',facets);
    const term = {range:value.split(',').map(Number)};
    year.terms = year.terms.filter(t => t.range?.join(',') !== value);
    if(checked) year.terms.push(term);
  }else if(opt){
    const group = getGroupFilter(opt,'any',facets);
    const kind = groupKind(opt);
    const term = kind === Retrieval.YEAR ? Number(value) : value;
    const key = Retrieval.termKey(kind,term);
    group.terms = group.terms.filter(t => Retrieval.termKey(kind,t) !== key);
    if(checked) group.terms.push(term);
  }
  paintShareResults();
}

async function downloadShare(){
  if(shareView.busy || !shareView.selected.size) return;
  shareView.busy = true;
  shareView.message = '';
  renderShareModal();
  try{
    if(shareView.notes) await Promise.all([...shareView.selected].map(savePendingPatch));
    const response = await fetch('/api/share/export', {
      method:'POST', headers:{'Content-Type':'application/json','X-Colophon-Import':'1'},
      body:JSON.stringify({item_ids:[...shareView.selected],groups:shareView.groups,notes:shareView.notes})
    });
    if(!response.ok){
      const data = await response.json().catch(() => null);
      throw new Error(typeof data?.detail === 'string' ? data.detail : '请求失败（HTTP ' + response.status + '）');
    }
    const url = URL.createObjectURL(await response.blob());
    const link = document.createElement('a');
    link.href = url;
    const timestamp = new Date().toISOString().replaceAll(':','-');
    link.download = 'Colophon-文献分享包-' + timestamp + '.colophon.json';
    document.body.append(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
    shareView.busy = false;
    closeShare();
  }catch(err){
    shareView.busy = false;
    shareView.message = '导出失败：' + err.message;
    renderShareModal();
  }
}

async function runShareImport(path, token){
  if(!path || importView.importing || shareView.busy) return;
  const browsing = state.modalMode === 'import';
  if(browsing){
    importView.importing = true;
    importView.message = '';
    renderImportModal();
  }else{
    shareView.busy = true;
    shareView.message = '';
    renderShareModal();
  }
  let data;
  try{
    data = await importResponse('/api/share/import', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({path,token})
    });
  }catch(err){
    (browsing ? importView : shareView).message = err.message;
  }finally{
    importView.importing = false;
    shareView.busy = false;
  }
  if(!data){
    renderModal();
  }else if(!token){
    Object.assign(shareView,{mode:'preview',path,preview:data,message:''});
    state.modalMode = 'share';
    renderShareModal();
  }else{
    closeShare();
    toast('分享包已导入：新增 ' + data.added + ' 篇，合并 ' + data.merged + ' 篇，跳过冲突 ' + data.conflicts.length + ' 篇');
    await refreshPapers();
  }
}

async function boot(){
  try{
    PAPERS = await fetchPapers();
    apiOnline = true;
  }catch(err){
    PAPERS = [];
    apiOnline = false;
  }
  if(!PAPERS.length){
    state.paperId = null;
  }
  if(apiOnline){
    await refreshGroups();
    await loadAISettings();
    await restoreConversation();
  }
  if(location.hash === ORGANIZE_HASH && state.workspace === 'search') applyWorkspaceFromLocation(false);
  else renderAll();
  if(!apiOnline){
    toast('连不上本地服务，请确认 run.py 还在运行，然后刷新页面');
  }
}

/* 启动：只认本地服务，连不上就显示重连提示 */
boot();
</script>
