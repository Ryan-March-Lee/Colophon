<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colophon · 文献工作台</title>
<style>
  :root{
    --bg:#f5f4ef;
    --panel:#ffffff;
    --panel-2:#faf9f5;
    --hover:#efeee8;
    --ink:#1b1c1a;
    --muted:#63655e;
    --muted-2:#73756d;
    --line:#e5e3da;
    --line-2:#d2cfc3;
    --accent:#1f6b58;
    --accent-2:#175445;
    --accent-soft:#e7f1ed;
    --ok:#2f7d4f;
    --warn:#b45309;
    --c-year:#5b6f83;
    --c-author:#a2672c;
    --c-org:#7757a6;
    --c-venue:#346e69;
    --c-topic:#1c7566;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype","Songti SC","Source Han Serif SC",Georgia,serif;
    --shadow:0 1px 2px rgba(20,24,20,.04),0 12px 28px -20px rgba(20,24,20,.35);
  }
  :root[data-theme="dark"]{
    --bg:#131413;
    --panel:#1b1d1b;
    --panel-2:#171917;
    --hover:#232623;
    --ink:#e9e8e1;
    --muted:#b2b5aa;
    --muted-2:#8b8e84;
    --line:#2b2e2b;
    --line-2:#3b3f3b;
    --accent:#5fb59d;
    --accent-2:#8fd0bd;
    --accent-soft:#1c332c;
    --ok:#6fbf8e;
    --warn:#d99a5b;
    --c-year:#8ea3b8;
    --c-author:#d3a06a;
    --c-org:#a98dd1;
    --c-venue:#77b6ae;
    --c-topic:#5cb8a5;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -22px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;
    background:var(--bg);color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
  *::-webkit-scrollbar-thumb:hover{background:var(--muted-2);background-clip:content-box}
  *::-webkit-scrollbar-track{background:transparent}

  /* ---------- top bar ---------- */
  .topbar{
    height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;
    background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:9px;flex:none}
  .mark{
    width:30px;height:30px;border-radius:9px;background:var(--accent);
    display:grid;place-items:center;color:#fff;flex:none;
  }
  :root[data-theme="dark"] .mark{color:#0f1714}
  .brand-text{line-height:1.1}
  .brand h1{font-size:15px;margin:0;font-weight:650;letter-spacing:.04em}
  .brand .sub{font-size:10px;color:var(--muted);letter-spacing:.09em;margin-top:2px}
  .search{flex:1;min-width:0;max-width:620px;position:relative;margin-left:8px}
  .search svg{position:absolute;left:11px;top:9px;color:var(--muted);pointer-events:none}
  .search input{
    width:100%;min-width:0;height:34px;border:1px solid var(--line);background:var(--panel-2);
    border-radius:9px;padding:0 12px 0 32px;font-size:13px;outline:none;
  }
  .search input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
  .search input::placeholder{color:var(--muted-2)}
  .topacts{margin-left:auto;display:flex;align-items:center;gap:6px}
  .btn{
    height:32px;padding:0 11px;border:1px solid var(--line);border-radius:8px;
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--panel);
    transition:background .12s,border-color .12s;
  }
  .btn:hover{background:var(--hover);border-color:var(--line-2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .btn.primary{color:#0f1714}
  .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn.tiny{height:27px;padding:0 8px;font-size:12px;border-radius:7px}
  .btn.icon{width:32px;padding:0;justify-content:center}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .linkbtn{font-size:11.5px;color:var(--accent);text-decoration:none;border-radius:4px;padding:1px 2px}
  .linkbtn:hover{text-decoration:underline}

  /* ---------- layout ---------- */
  .app{
    display:grid;
    grid-template-columns:minmax(0,1fr) 428px;
    grid-template-rows:minmax(0,1fr);
    height:calc(100vh - 58px);
    min-height:0;
    overflow:hidden;
  }
  .desk{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}

  /* ---------- retrieval groups ---------- */
  .filterzone{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:9px 14px 8px;overflow:hidden}
  .group-tools{display:flex;align-items:center;gap:8px;min-height:26px;margin-bottom:7px}
  .group-kicker{font-size:10px;font-weight:650;color:var(--muted);letter-spacing:.08em;flex:none}
  .group-hint{font-size:10.5px;color:var(--muted-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .group-clear{margin-left:auto;flex:none}
  .attr-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px;min-width:0;min-height:30px;white-space:nowrap;padding:2px 0 5px}
  .year-controls,.reading-controls{display:flex;align-items:center;gap:7px;min-width:0}
  .year-controls{flex:1 1 330px;flex-wrap:wrap}
  .reading-controls{flex-wrap:wrap}
  .attr-label{font-size:10.5px;color:var(--muted);flex:none}
  .year-options{display:flex;align-items:center;gap:4px;min-width:100px;flex:1;overflow-x:auto;padding:2px}
  .metadata-filters{display:flex;flex-wrap:wrap;gap:4px 10px;margin:0 0 5px}
  .metadata-filter{display:flex;flex-wrap:wrap;align-items:center;gap:4px;min-width:0;max-width:100%}
  .metadata-filter select{max-width:min(100%,15rem)}
  .metadata-filter .filter-option{white-space:normal;height:auto;min-height:24px;max-width:100%;overflow-wrap:anywhere;text-align:left}
  .year-form{display:inline-flex;align-items:center;gap:3px;flex:none}
  .year-form input{width:54px;height:24px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);padding:0 5px;font-size:10.5px;outline:none}
  .year-form input:focus{border-color:var(--accent)}
  .year-dash{color:var(--muted-2);font-size:10px}
  .filter-option{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 7px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-size:10.5px;color:var(--muted);white-space:nowrap;flex:none}
  .filter-option:hover{border-color:var(--line-2);background:var(--hover);color:var(--ink)}
  .filter-option[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent-2);font-weight:600}
  .filter-option:disabled{opacity:.42;cursor:default}
  .filter-option .fcount{font-size:9.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}
  .year-unknown{border-style:dashed;color:var(--warn)}
  .year-unknown[aria-pressed="true"]{background:color-mix(in srgb,var(--warn) 10%,transparent);border-color:color-mix(in srgb,var(--warn) 40%,var(--line));color:var(--warn)}
  .group-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:5px}
  .query-group{--gc:var(--c-topic);min-width:0;border:1px solid var(--line);border-top:2px solid var(--gc);border-radius:6px;background:var(--panel-2);padding:5px 6px 6px}
  .query-group.unfiled{--gc:var(--warn)}
  .query-group[hidden]{display:none}
  .qg-head{display:flex;align-items:center;gap:5px;min-width:0;margin-bottom:5px}
  .qg-name{font-size:10.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .qg-mark{font-size:8.5px;color:var(--warn);flex:none}
  .qg-ops{display:inline-flex;gap:1px;margin-left:auto;flex:none;background:var(--hover);padding:2px;border-radius:5px}
  .qg-op{height:20px;min-width:27px;padding:0 4px;border-radius:3px;font-size:9px;color:var(--muted-2)}
  .qg-op:hover{color:var(--ink)}
  .qg-op[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(20,24,20,.08);font-weight:650}
  .qg-foot{font-size:9px;color:var(--muted-2);font-variant-numeric:tabular-nums;flex:none}
  .qg-options{display:flex;align-items:center;gap:4px;min-width:0;overflow:hidden;flex-wrap:wrap;max-height:26px}
  .query-group.expanded .qg-options{max-height:84px;overflow-y:auto}
  .qg-more{font-size:9.5px;color:var(--accent);white-space:nowrap;flex:none;padding:2px}
  .qg-more:hover{text-decoration:underline}
  .tag-option{--tc:var(--gc);height:22px;padding:0 6px;max-width:100%;font-size:10px}
  .tag-option .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .tag-option .fcount{color:color-mix(in srgb,var(--tc) 78%,var(--muted))}
  .group-overflow{display:flex;justify-content:center;margin-top:3px}
  .group-overflow button{font-size:10px;color:var(--muted);padding:2px 6px}
  .group-overflow button:hover{color:var(--accent);text-decoration:underline}
  .group-empty{display:flex;align-items:center;gap:10px;border:1px dashed var(--line-2);border-radius:6px;padding:8px 10px;color:var(--muted);font-size:11px}
  .group-empty .btn{margin-left:auto;flex:none}
  .actionbar{display:flex;align-items:center;gap:7px;min-height:34px;padding:4px 14px;border-bottom:1px solid var(--line);background:var(--panel-2)}
  .action-entry{height:25px;padding:0 8px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-size:10.5px;color:var(--ink);white-space:nowrap}
  .action-entry:hover{border-color:var(--line-2);background:var(--hover)}
  .action-entry[aria-pressed="true"]{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:color-mix(in srgb,var(--warn) 8%,var(--panel));color:var(--warn)}
  .action-entry b{font-variant-numeric:tabular-nums}
  .action-spacer{flex:1}
  .exprbar{display:flex;align-items:center;gap:7px;min-height:34px;padding:4px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
  .expr-label{font-size:9.5px;color:var(--muted-2);flex:none}
  .expr-text{display:flex;align-items:center;gap:4px;flex:1;min-width:0;overflow-x:auto;white-space:nowrap;font-size:10.5px;color:var(--muted)}
  .expr-seg{color:var(--ink);padding:2px 4px;border-radius:4px}
  button.expr-seg:hover{background:var(--hover);color:var(--accent)}
  .expr-and{color:var(--muted-2);flex:none}
  .expr-actions{display:flex;align-items:center;gap:7px;flex:none}
  .expr-action{font-size:10px;color:var(--accent);white-space:nowrap}
  .expr-action:hover{text-decoration:underline}
  .relax-box{display:none;position:absolute;right:14px;top:calc(100% + 3px);z-index:20;width:min(390px,calc(100vw - 28px));background:var(--panel);border:1px solid var(--line);border-radius:7px;box-shadow:var(--shadow);padding:7px}
  .exprbar{position:relative}
  .exprbar.relax-open .relax-box{display:block}
  .relax-head{font-size:10px;color:var(--muted);padding:2px 5px 6px}
  .relax-row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:6px 5px;border-radius:4px;text-align:left;font-size:10.5px}
  .relax-row:hover{background:var(--hover)}
  .relax-row b{font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
  .relax-none{font-size:10px;color:var(--muted-2);padding:7px 5px}
  .op-select{height:22px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-size:9.5px;padding:0 3px;color:var(--muted);outline:none;flex:none}
  .op-select:focus{border-color:var(--accent)}
  .qg-head .op-select{margin-left:auto}
  .group-wrap{position:relative}
  .year-gap{height:22px;padding:0 6px;border:1px dashed color-mix(in srgb,var(--warn) 45%,var(--line));border-radius:5px;color:var(--warn);font-size:9.5px;white-space:nowrap;flex:none}
  .year-gap:hover,.year-gap:focus-visible{background:color-mix(in srgb,var(--warn) 8%,transparent)}
  .filterzone.compact .group-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

  .fhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
  .fhead-right{display:flex;align-items:center;gap:8px}
  .fclose{display:none;width:22px;height:22px;align-items:center;justify-content:center;border-radius:5px;color:var(--muted)}
  .fclose:hover{background:var(--hover);color:var(--ink)}
  .ftitle{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .fsub{font-size:10.5px;color:var(--muted-2)}
  .fhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
  .fhead-right{display:flex;align-items:center;gap:8px}
  .fclose{display:none;width:22px;height:22px;align-items:center;justify-content:center;border-radius:5px;color:var(--muted)}
  .fclose:hover{background:var(--hover);color:var(--ink)}
  .ftitle{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .fsub{font-size:10.5px;color:var(--muted-2)}
  .fgroup{border-top:1px solid var(--line);padding:4px 0 8px}
  .fgroup-head{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:8px 4px;border-radius:6px;
  }
  .fgroup-head:hover{background:var(--hover)}
  .fgroup-title{
    display:flex;align-items:center;gap:6px;
    font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink);
  }
  .fcount-sel{
    font-size:10px;line-height:1;padding:2px 5px;border-radius:99px;
    background:var(--c);color:#fff;font-weight:600;
  }
  :root[data-theme="dark"] .fcount-sel{color:#101613}
  .chev{color:var(--muted-2);transition:transform .15s}
  .fgroup.collapsed .chev{transform:rotate(-90deg)}
  .fgroup.collapsed .fgroup-body{display:none}
  .fgroup-body{padding-top:2px}
  .frow{
    width:100%;display:flex;align-items:center;gap:7px;padding:5px 6px;
    border-radius:7px;font-size:12.5px;text-align:left;line-height:1.35;
  }
  .frow:hover{background:var(--hover)}
  .frow.on{background:color-mix(in srgb,var(--c) 11%,transparent)}
  .frow.on .flabel{font-weight:600}
  .frow:disabled{opacity:.38;cursor:default}
  .frow:disabled:hover{background:none}
  .fbox{
    width:14px;height:14px;flex:none;border:1px solid var(--line-2);border-radius:4px;
    display:grid;place-items:center;color:#fff;background:var(--panel);
  }
  .frow.on .fbox{background:var(--c);border-color:var(--c)}
  :root[data-theme="dark"] .frow.on .fbox{color:#101613}
  .flabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fcount{font-size:10.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}
  .frow.on .fcount{color:var(--c)}
  .morebtn{
    margin-top:3px;padding:4px 6px;font-size:11px;color:var(--muted);
    border-radius:5px;
  }
  .morebtn:hover{color:var(--ink);background:var(--hover)}

  .years{display:flex;align-items:flex-end;gap:3px;padding:4px 2px 2px}
  .ybar{
    flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    gap:2px;height:64px;border-radius:5px;padding:2px 0;
  }
  .ybar:hover{background:var(--hover)}
  .ybar:disabled{cursor:default}
  .ybar:disabled:hover{background:none}
  .ybar:disabled .ybarfill{opacity:.12}
  .ybar:disabled .ybarlabel{opacity:.55}
  .ybarcount{font-size:9px;color:var(--muted-2);font-variant-numeric:tabular-nums;height:11px}
  .ybar.on .ybarcount{color:var(--c);font-weight:700}
  .ybarfill{
    width:100%;max-width:16px;border-radius:3px 3px 1px 1px;
    background:var(--c);opacity:.3;min-height:3px;transition:opacity .12s;
  }
  .ybar:hover .ybarfill{opacity:.55}
  .ybar.on .ybarfill{opacity:1}
  .ybarlabel{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums;height:12px}
  .ybar.on .ybarlabel{color:var(--c);font-weight:700}

  .src{
    margin-top:auto;padding:14px 4px 2px;border-top:1px solid var(--line);
    font-size:10.5px;color:var(--muted-2);line-height:1.6;
  }
  .srcline{display:flex;align-items:center;gap:6px;color:var(--muted)}
  .dot{width:6px;height:6px;border-radius:99px;background:var(--muted-2);flex:none}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 18%,transparent)}

  /* ---------- list ---------- */
  .listcol{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1;background:var(--bg)}
  .listbar{padding:7px 14px 6px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:5px;flex:none;background:var(--panel-2)}
  .chiprow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;min-height:24px}
  .chiphint{font-size:11.5px;color:var(--muted-2)}
  .fchip{
    display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 7px;
    border:1px solid var(--line);border-radius:6px;background:var(--panel);
    font-size:11.5px;color:var(--ink);
  }
  .fchip:hover{border-color:var(--line-2);background:var(--hover)}
  .fchip .cdot{width:6px;height:6px;border-radius:99px;background:var(--c);flex:none}
  .fchip .x{color:var(--muted-2);font-size:12px;line-height:1;margin-left:1px}
  .fchip:hover .x{color:var(--ink)}
  .countrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;row-gap:6px}
  .count{font-size:11.5px;color:var(--muted);min-width:0}
  .count b{color:var(--ink);font-weight:650}
  .countacts{display:flex;align-items:center;gap:6px;margin-left:auto}
  .batch-progress{font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
  .sel{
    height:27px;border:1px solid var(--line);background:var(--panel);border-radius:7px;
    font-size:11.5px;padding:0 6px;outline:none;color:var(--muted);
  }
  .sel:focus{border-color:var(--accent)}
  .papers{flex:1;min-height:0;overflow-y:auto;padding:7px 12px 30px;display:flex;flex-direction:column;gap:0}
  .paper{
    position:relative;flex:none;min-height:54px;padding:6px 8px;border:0;border-bottom:1px solid var(--line);
    border-radius:0;background:transparent;cursor:pointer;transition:background .12s;
  }
  .paper:hover{background:var(--panel)}
  .paper.on{
    box-shadow:inset 2px 0 0 var(--accent);
    background:var(--accent-soft);
  }
  .paper-meta,.ptags{display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-width:0}
  .paper-meta{margin-bottom:4px}
  .paper-meta .tag,.ptags .tag{height:auto;min-height:19px;max-width:100%;padding:2px 5px;font-size:10.5px;line-height:1.25;white-space:normal;overflow-wrap:anywhere;text-align:left}
  .paper button.tag:hover,.paper button.tag[aria-pressed="true"]{border-color:var(--c);text-decoration:underline}
  .paper-meta .missing-meta{border-style:dashed;color:var(--muted)}
  .paper-meta-more{max-width:100%;font-size:10.5px;color:var(--muted);cursor:pointer}
  .paper-meta-more .tag{margin:3px 4px 0 0}
  .paper-title-row{display:flex;align-items:baseline;gap:6px;min-width:0}
  .pstatus{display:inline-flex;align-items:center;gap:4px;flex:none}
  .pstatus .d{width:5px;height:5px;border-radius:99px;background:var(--muted-2)}
  .pstatus.read .d{background:var(--ok)}
  .pstatus.reading .d{background:var(--warn)}
  .ptitle{flex:1;min-width:0;font-family:var(--serif);font-size:15px;line-height:1.4;font-weight:600;margin:0;overflow-wrap:anywhere}
  .ptitle button{display:block;width:100%;text-align:left}
  .ptags{margin-top:5px}

  .tag{
    display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;
    border-radius:99px;font-size:11px;line-height:1;white-space:nowrap;
    background:color-mix(in srgb,var(--c) 10%,transparent);
    border:1px solid color-mix(in srgb,var(--c) 24%,transparent);

  .taglabel{padding:2px 0;color:inherit}

  .tag b{font-weight:600;font-size:10px;margin-left:3px;opacity:.7}

  .empty{
    margin:auto;text-align:center;color:var(--muted);padding:40px 20px;
  }

  .empty p{margin:0 0 10px;font-size:13px}

  /* ---------- detail ---------- */
  .detail{
    display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);
    border-left:1px solid var(--line);overflow:hidden;
  }
  .dhead{padding:15px 20px 12px;border-bottom:1px solid var(--line);flex:none}
  .dtop{display:flex;align-items:center;gap:8px;font-size:10.5px;color:var(--muted-2)}
  .dback{display:none;width:24px;height:22px;align-items:center;justify-content:center;border-radius:5px;color:var(--muted);margin-right:2px}
  .dback:hover{background:var(--hover);color:var(--ink)}
  .pill{
    display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;
    border-radius:99px;border:1px solid var(--line);font-size:10.5px;color:var(--muted);
    background:var(--panel-2);
  }
  .pill .d{width:5px;height:5px;border-radius:99px;background:var(--muted-2)}
  .pill.read{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 30%,var(--line))}
  .pill.read .d{background:var(--ok)}
  .pill.reading{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,var(--line))}
  .pill.reading .d{background:var(--warn)}
  .dvenue{margin-left:auto}
  .dtitle{
    font-family:var(--serif);font-size:19px;line-height:1.34;font-weight:600;
    margin:9px 0 5px;letter-spacing:-.012em;
  }
  .dauthors{font-size:11.5px;color:var(--muted);margin:0 0 8px;line-height:1.5}
  .dorgs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px}
  .orgpill{
    font-size:10.5px;color:var(--muted);border:1px solid var(--line);
    border-radius:5px;padding:2px 6px;background:var(--panel-2);
  }
  .dhead .tag{margin-right:3px}
  .dacts{display:flex;gap:6px;margin-top:11px}
  .tabs{display:flex;gap:17px;padding:0 20px;border-bottom:1px solid var(--line);flex:none}
  .tab{
    position:relative;padding:10px 0 9px;font-size:12.5px;color:var(--muted);
    border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:5px;
  }
  .tab:hover{color:var(--ink)}
  .tab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
  .tabn{
    font-size:9.5px;padding:1px 5px;border-radius:99px;background:var(--hover);
    color:var(--muted);font-weight:500;
  }
  .tabdot{width:5px;height:5px;border-radius:99px;background:var(--accent)}

  .dbody{flex:1;overflow-y:auto;padding:15px 20px 30px;min-height:0}
  .section{margin-bottom:20px}
  .section:last-child{margin-bottom:4px}
  .slabel{
    font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:600;
    text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:6px;
  }
  .slabel .hint{font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--muted-2);font-weight:400}
  .metaflag{
    font-size:9px;letter-spacing:.04em;padding:1px 5px;border-radius:4px;
    background:var(--accent-soft);color:var(--accent);font-weight:600;
  }
  .dabs{
    font-size:12px;line-height:1.7;color:var(--muted);margin:0 0 8px;
    max-height:3.4em;overflow:hidden;position:relative;
    -webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);
    mask-image:linear-gradient(180deg,#000 60%,transparent);
  }
  .dabs.open{max-height:none;-webkit-mask-image:none;mask-image:none}
  .dabs-toggle{
    font-size:10.5px;color:var(--accent);margin:-3px 0 8px;padding:0;
  }
  .dabs-toggle:hover{text-decoration:underline}
  .dabs-miss{font-size:10.5px;color:var(--muted-2);display:block;margin:0 0 8px}
  .textinput{
    width:100%;height:34px;border:1px solid var(--line);border-radius:8px;
    padding:0 10px;background:var(--panel-2);font-size:12.5px;outline:none;
  }
  .textinput:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
  .note{
    width:100%;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);
    padding:9px 11px;font-size:12.5px;line-height:1.7;resize:vertical;outline:none;
  }
  .note:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
  .autosave{font-size:10px;color:var(--muted-2);margin-top:5px;text-align:right}

  .tagline{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
  .tagline-label{flex:none;width:28px;font-size:10.5px;color:var(--muted-2);padding-top:4px}
  .tagline-vals{display:flex;flex-wrap:wrap;gap:4px;flex:1}
  .none{color:var(--muted-2);font-size:11px;padding-top:3px}
  .tagcloud{display:flex;flex-wrap:wrap;gap:4px}
  .tagspot{display:flex;align-items:center;gap:9px;margin-top:10px;flex-wrap:wrap}
  .tagspot .hintline{flex:1;min-width:160px}
  .hintline{font-size:11px;color:var(--muted-2);line-height:1.6;margin:7px 0 0}

  .addrow{display:flex;gap:5px;margin-top:9px}
  .addrow select{
    height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);
    font-size:11.5px;padding:0 4px;outline:none;flex:none;color:var(--muted);
  }
  .addrow input{
    flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:7px;
    background:var(--panel-2);padding:0 9px;font-size:12px;outline:none;
  }
  .addrow input:focus,.addrow select:focus{border-color:var(--accent);background:var(--panel)}

  /* ---------- 打标 / 组 ---------- */
  .groupbar{display:flex;align-items:center;gap:5px;margin-top:9px;flex-wrap:wrap}
  .groupbar .glabel{font-size:11px;color:var(--muted);flex:none}

  .groupbar select{
    height:30px;max-width:190px;border:1px solid var(--line);border-radius:7px;
    background:var(--panel-2);font-size:11.5px;padding:0 4px;outline:none;color:var(--ink);
  }
  .groupbar select:focus{border-color:var(--accent);background:var(--panel)}
  .groupbar input{
    flex:1;min-width:100px;height:30px;border:1px solid var(--accent);border-radius:7px;
    background:var(--panel);padding:0 9px;font-size:12px;outline:none;
  }
  .groupbar .btn{height:30px}
  .groupbar .gnew{font-size:11px;color:var(--accent);white-space:nowrap}
  .app.workbench{grid-template-columns:minmax(0,1fr)}
  .app.workbench .filterzone,.app.workbench .actionbar,.app.workbench .exprbar,.app.workbench .detail,.app.workbench .listbar{display:none}
  .app.workbench .desk{grid-column:1}
  .app.workbench .papers{display:block;padding:20px 18px 40px}
  .wb-card{width:min(700px,100%);margin:0 auto}
  .wb-top{display:flex;align-items:center;gap:9px;font-size:11px;color:var(--muted)}
  .wb-num{font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink)}
  .wb-top .sp{margin-left:auto}
  .wb-title{font-family:var(--serif);font-size:20px;line-height:1.32;font-weight:600;margin:11px 0 6px;letter-spacing:-.01em}
  .wb-sub{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .wb-abs{font-size:12.5px;line-height:1.72;color:var(--ink);opacity:.88;max-height:156px;overflow:hidden}
  .wb-meta{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);padding:7px 9px;margin-top:11px}
  .wb-meta.warn{border-color:color-mix(in srgb,var(--warn) 32%,var(--line));background:color-mix(in srgb,var(--warn) 7%,var(--panel))}
  .wb-meta-info{flex:1;min-width:0;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  .wb-meta-title{font-size:11.5px;font-weight:600;flex:none}
  .wb-meta-miss{font-size:11px;color:var(--warn)}
  .wb-meta-doi{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
  .wb-meta-hint{font-size:10.5px;color:var(--muted-2)}
  .wb-meta-acts{display:flex;gap:5px;flex:none}
  .qtag{
    display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;
    border:1px solid color-mix(in srgb,var(--c) 28%,transparent);border-radius:99px;
    background:color-mix(in srgb,var(--c) 6%,transparent);color:color-mix(in srgb,var(--c) 88%,var(--ink));
    font-size:11px;
  }
  .qtag:hover{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:color-mix(in srgb,var(--c) 46%,transparent)}
  .qtag b{font-weight:600;font-size:9.5px;opacity:.6}
  .qtag.has{opacity:.42;cursor:default}
  .wb-tags{margin-top:15px;border-top:1px solid var(--line);padding-top:13px}
  .wbspot{font-size:11px;color:var(--muted-2);line-height:1.65;margin:0}
  .wb-foot{display:flex;align-items:center;gap:8px;margin-top:16px}
  .wb-foot .skip{margin-left:auto}
  .wb-empty{margin:auto;text-align:center;color:var(--muted);padding:40px 20px}
  /* chat */
  .dbody.chat{display:flex;flex-direction:column;overflow:hidden;padding:0}
  .chat-top{padding:12px 20px 0;flex:none}
  .scopebar{
    display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;
    background:var(--accent-soft);border:1px dashed color-mix(in srgb,var(--accent) 38%,transparent);
  }
  .scopebar .lockic{color:var(--accent);flex:none;display:flex}
  .scope-txt{font-size:11.5px;line-height:1.45;color:var(--ink)}
  .scope-txt b{font-weight:650}
  .scope-txt span{display:block;font-size:10px;color:var(--muted);margin-top:1px}
  .scopebar .btn{margin-left:auto;flex:none}
  .scopebar.warn{background:color-mix(in srgb,var(--warn) 8%,var(--panel));border-color:color-mix(in srgb,var(--warn) 42%,transparent)}
  .scopebar.warn .lockic{color:var(--warn)}
  .scope-txt em{font-style:normal;color:var(--warn);font-weight:600}
  .scope-acts{display:flex;gap:6px;margin-left:auto;flex:none}
  .scope-link{background:none;border:0;color:var(--accent);font:inherit;font-size:11px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
  .cite .cp{margin-left:5px;color:var(--muted-2);font-size:10px}
  .msg .aierr{color:var(--warn)}
  .settings-card{width:min(540px,92vw)}
  .setnote{font-size:11px;color:var(--muted-2);line-height:1.65;margin:12px 0 0}
  .keyrow{display:flex;gap:6px}
  .keyrow .textinput{flex:1}
  .nokey{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px dashed color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 7%,var(--panel));border-radius:10px;padding:9px 11px}
  .nokey b{display:block;font-size:11.5px}
  .nokey span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
  .nokey .btn{flex:none}
  .msgs{
    flex:1;overflow-y:auto;padding:14px 20px 6px;display:flex;flex-direction:column;gap:12px;min-height:0;
  }
  .chatempty{margin:auto;text-align:center;color:var(--muted);padding:10px 8px 20px}
  .ce-ic{font-size:20px;opacity:.5;margin-bottom:6px}
  .chatempty p{font-size:12px;line-height:1.7;margin:0}
  .msg{max-width:100%;font-size:12.5px;line-height:1.7}
  .msg.user{align-self:flex-end;max-width:86%}
  .msg.user .bubble{
    background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:12px 12px 3px 12px;
  }
  :root[data-theme="dark"] .msg.user .bubble{background:var(--accent);color:#0f1714}
  .msg.ai{
    align-self:stretch;background:var(--panel-2);border:1px solid var(--line);
    border-radius:3px 12px 12px 12px;padding:10px 12px;
  }
  .aimeta{font-size:9.5px;letter-spacing:.06em;color:var(--muted-2);margin-bottom:5px}
  .aitext{color:var(--ink)}
  .aitext strong{font-weight:650}
  .cite{
    font-size:10px;padding:1px 4px;border-radius:4px;background:var(--accent-soft);
    color:var(--accent);vertical-align:2px;margin:0 1px;font-variant-numeric:tabular-nums;
  }
  .cite:hover{background:var(--accent);color:#fff}
  .cites{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
  .cites button{
    display:inline-flex;gap:5px;align-items:center;max-width:100%;
    font-size:10px;color:var(--muted);background:var(--panel);border:1px solid var(--line);
    border-radius:5px;padding:2px 6px;text-align:left;
  }
  .cites button:hover{border-color:var(--line-2);color:var(--ink)}
  .cites b{color:var(--accent);font-weight:650}
  .cites .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}
  .typing{display:flex;gap:3px;padding:4px 0}
  .typing i{width:5px;height:5px;border-radius:99px;background:var(--muted-2);animation:blink 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  .composer-wrap{flex:none;padding:8px 20px 12px;border-top:1px solid var(--line);background:var(--panel)}
  .quick{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .quick button{
    font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;
    padding:4px 9px;background:var(--panel-2);
  }
  .quick button:hover{color:var(--ink);border-color:var(--line-2);background:var(--hover)}
  .composer{display:flex;gap:6px}
  .composer input{
    flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:9px;
    background:var(--panel-2);padding:0 11px;font-size:12.5px;outline:none;
  }
  .composer input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
  .composer .btn{height:36px}
  .footnote{font-size:9.5px;color:var(--muted-2);margin:6px 0 0;text-align:center}

  /* ---------- modal ---------- */
  .modal{
    position:fixed;inset:0;display:none;place-items:center;padding:24px;
    background:rgba(16,20,17,.38);backdrop-filter:blur(2px);z-index:60;
  }
  .modal.open{display:grid}
  .modal-card{
    width:min(760px,100%);max-height:82vh;overflow-y:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:18px 20px 16px;box-shadow:0 24px 70px -30px rgba(0,0,0,.5);
  }
  .mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .mhead h3{margin:0 0 3px;font-size:16px;font-weight:650;letter-spacing:.02em}
  .mhead p{margin:0;font-size:11px;color:var(--muted)}
  .mergesec{margin-bottom:16px}
  .merge{
    display:flex;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);
    border-radius:10px;margin-bottom:6px;background:var(--panel-2);flex-wrap:wrap;
  }
  .merge-path{display:flex;align-items:center;gap:6px;font-size:12px}
  .merge-why{font-size:10.5px;color:var(--muted-2);flex:1;min-width:120px}
  .merge .btn{margin-left:auto;height:25px;font-size:11px}
  .libgroup{margin-bottom:14px}
  .libhead{
    display:flex;align-items:center;justify-content:space-between;
    font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;
  }
  .libhead span:last-child{letter-spacing:0}
  .libvals{display:flex;flex-wrap:wrap;gap:4px}
  .libvals .tag{height:21px;font-size:11px}
  .libacts{display:flex;gap:9px;margin-top:5px}
  .libhead .hint{letter-spacing:0;text-transform:none;font-weight:400;color:var(--muted-2)}
  .pickgrouplist{display:flex;flex-direction:column;gap:5px;margin-top:4px}
  .pickgroup{
    display:flex;align-items:center;gap:8px;padding:8px 10px;text-align:left;
    border:1px solid var(--line);border-left:2px solid var(--c);border-radius:8px;
    background:var(--panel-2);font-size:12.5px;
  }
  .pickgroup:hover{background:var(--hover)}
  .pickgroup .gdot{width:7px;height:7px;border-radius:99px;background:var(--c);flex:none}
  .pickgroup .cnt{margin-left:auto;font-size:10.5px;color:var(--muted-2)}
  .clean-card{width:min(860px,100%)}
  .clean-policy{font-size:10.5px;line-height:1.65;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:6px}
  .clean-policy b{color:var(--ink);font-weight:600}
  .csec{margin-top:12px}
  .crow{display:flex;align-items:flex-start;gap:8px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin-bottom:4px;background:var(--panel)}
  .crow.skipped{opacity:.55}
  .cbadge{flex:none;font-size:9.5px;padding:1px 5px;border-radius:4px;background:color-mix(in srgb,var(--tone) 14%,transparent);color:var(--tone);border:1px solid color-mix(in srgb,var(--tone) 30%,transparent);margin-top:2px}
  .cbadge.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
  .cname{flex:1;min-width:0}
  .cold{font-size:12px;word-break:break-word}
  .carrow{color:var(--muted-2);margin:0 5px;font-size:11px}
  .cnew{font-size:12px;font-weight:600;color:var(--ok)}
  .cwhy{font-size:10px;color:var(--muted-2);margin-top:2px}
  .cact{display:flex;gap:3px;flex:none;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
  .tbtn{font-size:10.5px;padding:2px 6px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);color:var(--muted)}
  .tbtn:hover{border-color:var(--line-2);color:var(--ink)}
  .tbtn.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,transparent);color:var(--accent-2);font-weight:600}
  .mnote{font-size:10.5px;color:var(--muted-2);line-height:1.6;margin:4px 0 0;border-top:1px solid var(--line);padding-top:10px}

  /* ---------- 导入浏览 ---------- */
  .import-card{width:min(840px,100%);max-height:84vh;display:flex;flex-direction:column}
  .importbar{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .importpath{
    flex:1;min-width:0;font-size:12px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);
    border-radius:5px;padding:6px 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .importpane{display:grid;grid-template-columns:150px minmax(0,1fr);height:clamp(200px,49vh,470px);min-height:160px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .importnav{overflow:auto;background:var(--panel-2);border-right:1px solid var(--line);padding:7px 5px}

  .importnav button:not(:disabled):hover,.improw:not(:disabled):hover{background:var(--hover)}
  .importnav button[aria-current="location"]{background:var(--hover);box-shadow:inset 2px 0 var(--accent)}
  .importnav h4{margin:8px 8px 3px;font-size:11px;font-weight:500;color:var(--muted)}
  .importbody{
    min-height:0;overflow:auto;background:var(--panel);
  }

    border-bottom:1px solid var(--line);background:transparent;text-align:left;
    font-size:12.5px;color:var(--ink);cursor:pointer;

<script>
/* ============================================================
   数据：全部从 /api/items 读取；连不上就显示重连提示，没有演示数据
   ============================================================ */
const Retrieval = window.ColophonRetrieval;
const METADATA_FACETS = [
  {key:'year', label:'年份'},
  {key:'author', label:'作者'},
  {key:'org', label:'单位'},
  {key:'venue', label:'期刊'}
];
let apiOnline = false;
let PAPERS = [];


/* ============================================================
   工具
   ============================================================ */
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labelOf = k => k === 'topic' ? '标签' : (METADATA_FACETS.find(f => f.key === k) || {}).label || k;
const colorOf = k => 'var(--c-' + k + ')';
const statusLabel = s => s === 'read' ? '已读' : s === 'reading' ? '在读' : '待读';
const fieldLabel = k => ({title:'标题', authors:'作者', year:'年份', venue:'期刊 / 会议', orgs:'单位'}[k] || k);

const state = {
  q:'',
  sort:'year',
  mode:null,
  groupFilters:{
    '@year':{op:'any', terms:[]},
    '@attr':{op:'any', terms:[]}
  },
  groupsExpanded:false,
  expandedGroups:new Set(),
  relaxOpen:false,
  eval:null,
  rescue:[],
  paperId:null,
  tab:'tags',
  absOpen:false,
  absId:null,
  chat:[],
  busy:false,
  sugg:{},
  dismissed:new Set(),
  modalOpen:false,
  modalMode:'tags',
  metaBusy:null,
  batchProgress:null,
  ai:{baseUrl:'', model:'', hasKey:false, keyHint:''},
  aiExpand:false,
  expandConfirm:false,
  conversationId:null,
  scopeIds:undefined,
  readerOpen:false,
  pendingScroll:null,
  groups:[],          // 后端按组返回的标签树
  unfiled:[],         // 未分组的标签（后端算出来的，不是数据库行）
  clean:null,         // 数据清洗的扫描结果与逐条选择
  workbench:false,    // 未打标队列（只路由，不在这里打标）
  groupSel:null,      // 阅读器打标面板当前的组 id
  readerTags:true,    // 阅读器右侧的打标栏是否展开
  readerGroupNew:false,  // 阅读器侧栏正在内联新建组（全应用唯一的组状态）
  readerItemId:null,  // 阅读器里正在读的条目（loadPdf 完成前也有效）
  wbSkip:new Set(),   // 工作台里跳过的（本次会话内）
  wbDone:0,           // 本次会话已打标的篇数
  wbHist:[],          // 回看的上一篇
  wbId:null           // 正在看的那篇（null = 队列里的下一篇）
};

let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ============================================================
   检索状态与求值
   ============================================================ */
function getGroupFilter(id, op){
  if(!state.groupFilters[id]) state.groupFilters[id] = {op:op || 'any', terms:[]};
  if(!Array.isArray(state.groupFilters[id].terms)) state.groupFilters[id].terms = [];
  return state.groupFilters[id];
}

function metadataValues(p, key){
  return key === 'year' ? (Number.isFinite(p.year) ? [String(p.year)] : []) : Retrieval.metadataValues(p,key);
}

function groupKind(id){
  if(id === Retrieval.YEAR_GROUP) return Retrieval.YEAR;
  if(id === Retrieval.ATTR_GROUP) return Retrieval.ATTR;
  if(METADATA_FACETS.some(f => '@' + f.key === id)) return Retrieval.META;
  return Retrieval.TAG;
}

function retrievalGroups(){
  const groups = [];
  const year = getGroupFilter(Retrieval.YEAR_GROUP, 'any');
  const yearTerms = year.terms.slice();
  const years = Array.from(new Set(PAPERS.map(p => p.year).filter(Number.isFinite))).map(y => ({range:[y,y]}));
  years.push({unknown:true});
  groups.push({kind:Retrieval.YEAR, group_id:Retrieval.YEAR_GROUP, op:year.op, terms:yearTerms, options:years});

  METADATA_FACETS.slice(1).forEach(function(f){
    const id = '@' + f.key;
    const filter = getGroupFilter(id,'any');
    const options = new Map();
    PAPERS.forEach(p => metadataValues(p,f.key).forEach(function(value){
      const key = Retrieval.termKey(Retrieval.META,value);
      if(!options.has(key)) options.set(key,value);
    }));
    groups.push({kind:Retrieval.META, group_id:id, op:'any', terms:filter.terms.slice(), options:Array.from(options.values()).sort((a,b) => a.localeCompare(b,'zh'))});
  });

  const attr = getGroupFilter(Retrieval.ATTR_GROUP, 'any');
  const attrOptions = [{status:'todo'}, {status:'reading'}, {status:'read'}, {star:true}];
  groups.push({kind:Retrieval.ATTR, group_id:Retrieval.ATTR_GROUP, op:attr.op, terms:attr.terms.slice(), options:attrOptions});

  (state.groups || []).forEach(function(g){
    const selection = getGroupFilter(g.id, 'any');
    groups.push({kind:Retrieval.TAG, group_id:g.id, op:selection.op, terms:selection.terms.slice(), options:(g.tags || []).map(t => t.id)});
  });
  const unfiled = getGroupFilter(Retrieval.UNFILED, 'any');
  groups.push({kind:Retrieval.TAG, group_id:Retrieval.UNFILED, op:unfiled.op, terms:unfiled.terms.slice(), options:(state.unfiled || []).map(t => t.id)});
  return groups;
}

function retrievalFilter(){
  return {q:state.q, mode:state.mode, groups:retrievalGroups()};
}

function currentEvaluation(){
  if(!state.eval) state.eval = Retrieval.evaluate(PAPERS, retrievalFilter());
  return state.eval;
}

function sorter(a,b){
  if(state.sort === 'cites') return b.cites - a.cites;
  if(state.sort === 'added') return PAPERS.indexOf(a) - PAPERS.indexOf(b);
  return (b.year ?? -1) - (a.year ?? -1);
}

function getFiltered(){
  return currentEvaluation().matched.slice().sort(sorter);
}

function selectedCount(){
  return Object.keys(state.groupFilters).reduce(function(n,id){
    return n + ((state.groupFilters[id].terms || []).length);
  },0);
}

function findGroupDef(id){
  if(id === Retrieval.UNFILED) return {id:id,name:'未分组',color:'var(--warn)',tags:state.unfiled || []};
  return (state.groups || []).find(g => g.id === id) || null;
}

function findTagById(id){
  for(const g of (state.groups || [])) for(const t of (g.tags || [])) if(t.id === id) return {group:g,tag:t};
  for(const t of (state.unfiled || [])) if(t.id === id) return {group:null,tag:t};
  return null;
}

function groupEval(id){
  return currentEvaluation().groups.find(g => g.group_id === id) || null;
}

function optionEval(id,key){
  const g = groupEval(id);
  return g ? g.options.find(o => o.key === key) || null : null;
}

function termLabel(kind,term){
  if(kind === Retrieval.META) return term;
  if(kind === Retrieval.TAG){
    const hit = findTagById(term);
    return hit ? hit.tag.name : '已失效的标签';
  }
  if(kind === Retrieval.YEAR){
    if(term && term.unknown) return '年份未知';
    const r = term && term.range || [];
    return r.length === 2 ? (r[0] === r[1] ? String(r[0]) : r[0] + '–' + r[1]) : '年份';
  }
  if(term && term.star) return '星标';
  if(term && term.status) return statusLabel(term.status);
  return '';
}

function opLabel(op){ return op === 'all' ? '全部' : op === 'none' ? '排除' : '任一'; }

function activeExpressions(){
  const out = [];
  currentEvaluation().groups.forEach(function(g){
    if(!g.active) return;
    const filter = getGroupFilter(g.group_id);
    const def = g.kind === Retrieval.TAG ? findGroupDef(g.group_id) : null;
    const name = g.kind === Retrieval.YEAR ? '年份' : g.kind === Retrieval.ATTR ? '阅读状态 / 星标' : g.kind === Retrieval.META ? labelOf(g.group_id.slice(1)) : (def ? def.name : '标签组');
    const labels = filter.terms.map(t => termLabel(g.kind,t));
    const joiner = g.op === 'all' ? ' 且 ' : ' 或 ';
    let text = name + '：';
    if(g.op === 'none') text += '不含（' + labels.join(joiner) + '）';
    else text += labels.join(joiner);
    out.push({id:g.group_id,text:text});
  });
  if(state.mode === 'review') out.push({id:'@mode',text:'待补全模式'});
  if(state.q) out.push({id:'@query',text:'搜索「' + state.q + '」'});
  return out;
}

function tagDefinition(name){
  const hit = findTag(name);
  return hit && hit.tag && hit.tag.definition ? hit.tag.definition : '';
}

function checkSVG(){
  return '<svg width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">' +
    '<path d="M2 5.1 4.1 7.2 8 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>' +
  '</svg>';
}

/* ============================================================
   渲染：列表
   ============================================================ */
function groupColor(id){
  const def = findGroupDef(id);
  return id === Retrieval.UNFILED ? 'var(--warn)' : ((def && def.color) || 'var(--c-topic)');
}

function opControl(groupId,kind,current){
  const ops = kind === Retrieval.TAG ? [['any','任一'],['all','全部'],['none','排除']] : [['any','任一'],['none','排除']];
  const def = kind === Retrieval.TAG ? findGroupDef(groupId) : null;
  const name = kind === Retrieval.YEAR ? '年份' : kind === Retrieval.ATTR ? '阅读状态与星标' : ((def && def.name) || '标签组');
  return '<select class="op-select" data-change="group-op" data-group="' + esc(groupId) + '" aria-label="' + name + '操作符">' +
    ops.map(([value,label]) => '<option value="' + value + '"' + (value === current ? ' selected' : '') + '>' + label + '</option>').join('') + '</select>';
}

function renderYearOptions(){
  const years = Array.from(new Set(PAPERS.map(p => p.year).filter(Number.isFinite))).sort((a,b) => b-a);
  const filter = getGroupFilter(Retrieval.YEAR_GROUP,'any');
  const evalGroup = groupEval(Retrieval.YEAR_GROUP);
  const selected = filter.terms;
  const chips = years.map(function(y){
    const key = Retrieval.termKey(Retrieval.YEAR,{range:[y,y]});
    const option = evalGroup && evalGroup.options.find(o => o.key === key);
    const on = selected.some(t => t && t.range && y >= t.range[0] && y <= t.range[1]);
    return '<button class="filter-option" data-act="year-toggle" data-group="@year" data-year="' + y + '" aria-pressed="' + on + '"' +
      (option && option.count === 0 && !on ? ' disabled' : '') + ' title="' + y + ' · ' + (option ? option.count : 0) + ' 篇">' + y + '<span class="fcount">' + (option ? option.count : 0) + '</span></button>';
  }).join('');
  const unknown = evalGroup && evalGroup.options.find(o => o.key === '@unknown');
  const unknownOn = selected.some(t => t && t.unknown);
  const unknownChip = '<button class="filter-option year-unknown" data-act="year-unknown" aria-pressed="' + unknownOn + '"' +
    (unknown && unknown.count === 0 && !unknownOn ? ' disabled' : '') + '>未知 <span class="fcount">' + (unknown ? unknown.count : 0) + '</span></button>';
  const hasUnknown = selected.some(t => t && t.unknown);
  const gapCount = currentEvaluation().yearUnknown.count;
  const gap = selected.length && filter.op === 'any' && !hasUnknown
    ? '<button class="year-gap" data-act="year-unknown" aria-label="另有 ' + gapCount + ' 篇年份未知" title="另有 ' + gapCount + ' 篇年份未知">▸ 未知 ' + gapCount + '</button>' : '';
  const rangeForm = '<span class="year-form"><input id="yearFrom" type="number" min="0" max="9999" placeholder="起年" aria-label="起始年份">' +
    '<span class="year-dash">–</span><input id="yearTo" type="number" min="0" max="9999" placeholder="止年" aria-label="结束年份">' +
    '<button class="btn tiny" data-act="year-range-add" title="添加年份区间">＋</button></span>';
  return '<span class="attr-label">年份</span>' + opControl(Retrieval.YEAR_GROUP,Retrieval.YEAR,filter.op) + rangeForm +
    '<div class="year-options">' + chips + unknownChip + gap + '</div>';
}

function renderMetadataFilters(){
  return '<div class="metadata-filters" aria-label="元数据标签">' + METADATA_FACETS.slice(1).map(function(f){
    const id = '@' + f.key;
    const group = groupEval(id);
    const filter = getGroupFilter(id);
    const options = group.options.filter(o => !o.selected).map(o =>
      '<option value="' + esc(o.term) + '">' + esc(o.term) + ' · ' + o.count + '</option>').join('');
    const selected = filter.terms.map(value =>
      '<button class="filter-option" data-act="metadata-toggle" data-group="' + id + '" data-value="' + esc(value) + '" aria-pressed="true" title="移除' + f.label + '条件">' + esc(value) + ' ×</button>').join('');
    return '<div class="metadata-filter"><select class="op-select" data-change="metadata-add" data-group="' + id + '" aria-label="筛选' + f.label + '"' + (options ? '' : ' disabled') + '>' +
      '<option value="">' + f.label + '</option>' + options + '</select>' + selected + '</div>';
  }).join('') + '</div>';
}

function renderAttrOptions(){
  const id = Retrieval.ATTR_GROUP;
  const filter = getGroupFilter(id,'any');
  const options = [{status:'todo'}, {status:'reading'}, {status:'read'}, {star:true}];
  return '<span class="attr-label">阅读 / 星标</span>' +
    opControl(id,Retrieval.ATTR,filter.op) + options.map(function(term){
      const key = Retrieval.termKey(Retrieval.ATTR,term);
      const on = filter.terms.some(t => Retrieval.termKey(Retrieval.ATTR,t) === key);
      const result = optionEval(id,key);
      const label = term.star ? '星标' : statusLabel(term.status);
      return '<button class="filter-option" data-act="attr-toggle" data-key="' + esc(key) + '" aria-pressed="' + on + '"' +
        (result && result.count === 0 && !on ? ' disabled' : '') + '>' + label + '<span class="fcount">' + (result ? result.count : 0) + '</span></button>';
    }).join('');
}

function renderTagGroup(groupId,isUnfiled){
  const def = findGroupDef(groupId);
  if(!def || !(def.tags || []).length) return '';
  const filter = getGroupFilter(groupId,'any');
  const result = groupEval(groupId);
  const tags = def.tags.slice();
  const expanded = state.expandedGroups.has(groupId);
  const visible = expanded ? tags : tags.slice(0,4);
  const color = groupColor(groupId);
  const options = visible.map(function(t){
    const option = result && result.options.find(o => o.key === t.id);
    const on = filter.terms.includes(t.id);
    const definition = t.definition ? ' · ' + t.definition : '';
    return '<button class="filter-option tag-option" style="--tc:' + color + '" data-act="tag-toggle" data-group="' + esc(groupId) + '" data-id="' + esc(t.id) + '"' +
      ' aria-pressed="' + on + '"' + (option && option.count === 0 && !on ? ' disabled' : '') +
      ' title="' + esc(t.name + ' · ' + (option ? option.count : 0) + ' 篇' + definition) + '"><span class="tname">' + esc(t.name) + '</span><span class="fcount">' + (option ? option.count : 0) + '</span></button>';
  }).join('');
  const more = tags.length > 4 ? '<button class="qg-more" data-act="group-expand" data-group="' + esc(groupId) + '">' + (expanded ? '收起' : '+' + (tags.length - 4)) + '</button>' : '';
  const foot = result && result.foot !== null ? result.foot : '';
  return '<section class="query-group' + (isUnfiled ? ' unfiled' : '') + (expanded ? ' expanded' : '') + '" style="--gc:' + color + '">' +
    '<div class="qg-head"><span class="qg-name" title="' + esc(def.name) + '">' + esc(def.name) + '</span>' +
    (isUnfiled ? '<span class="qg-mark">整理</span>' : '') + opControl(groupId,Retrieval.TAG,filter.op) + '<span class="qg-foot">' + foot + '</span></div>' +
    '<div class="qg-options">' + options + more + '</div></section>';
}

function renderGroups(){
  const el = $('#filterzone');
  const regular = (state.groups || []).filter(g => (g.tags || []).length);
  const limit = window.matchMedia('(max-width:620px)').matches ? 2 : window.matchMedia('(max-width:1080px)').matches ? 4 : 6;
  const visibleRegular = state.groupsExpanded ? regular : regular.slice(0,limit);
  el.classList.toggle('more-groups',state.groupsExpanded);
  const hiddenN = Math.max(0,regular.length-visibleRegular.length);
  const hasUnfiled = (state.unfiled || []).length > 0;
  const tagGroups = visibleRegular.map(g => renderTagGroup(g.id,false)).join('') + (hasUnfiled ? renderTagGroup(Retrieval.UNFILED,true) : '');
  const noGroups = !regular.length && !hasUnfiled;
  const n = selectedCount();
  el.innerHTML = '<div class="group-tools"><span class="group-kicker">检索条件</span><span class="group-hint">组间 AND · 标签组可选任一、全部或排除</span>' +
    (n ? '<button class="linkbtn group-clear" data-act="clear-all">清除条件 ' + n + '</button>' : '<span class="group-clear fsub">空条件浏览全库</span>') + '</div>' +
    '<div class="attr-row"><div class="year-controls">' + renderYearOptions() + '</div><div class="reading-controls">' + renderAttrOptions() + '</div></div>' + renderMetadataFilters() +
    (noGroups ? '<div class="group-empty"><span>还没有标签分组。打标时选一个组，它就会出现在这里。</span><button class="btn tiny" data-act="new-group">＋ 新建分组</button></div>' : '<div class="group-grid">' + tagGroups + '</div>') +
    (hiddenN ? '<div class="group-overflow"><button data-act="groups-expand">更多组 ' + hiddenN + '</button></div>' : (state.groupsExpanded && regular.length > limit ? '<div class="group-overflow"><button data-act="groups-expand">收起分组</button></div>' : ''));
}

function renderActionBar(){
  const untagged = PAPERS.filter(p => !(p.topicIds || []).length).length;
  const review = PAPERS.filter(p => p.needsReview).length;
  $('#actionbar').innerHTML = '<button class="action-entry" data-act="open-untagged" title="进入逐条打标工作台">未打标 <b>' + untagged + '</b> · 去整理 ›</button>' +
    '<button class="action-entry" data-act="toggle-review" aria-pressed="' + (state.mode === 'review') + '" title="进入待补全队列">待补全 <b>' + review + '</b> · 去补全 ›</button>' +
    '<span class="action-spacer"></span>' + (state.mode === 'review' ? '<button class="linkbtn" data-act="mode-clear">退出待补全</button>' : '');
}

function renderExpression(){
  const el = $('#exprbar');
  const parts = activeExpressions();
  const content = parts.length ? parts.map((p,i) => (i ? '<span class="expr-and">且</span>' : '') + '<button class="expr-seg" data-act="jump-group" data-group="' + esc(p.id) + '">' + esc(p.text) + '</button>').join('') : '<span class="expr-seg">浏览全库</span>';
  const near = currentEvaluation().count === 0 && (state.q || selectedCount() || state.mode);
  const fixes = near ? Retrieval.rescue(PAPERS,retrievalFilter(),5) : [];
  const rows = fixes.map(x => '<button class="relax-row" data-act="apply-rescue" data-kind="' + x.action + '" data-group="' + esc(x.group_id) + '" data-key="' + esc(x.key) + '"><span>' + (x.action === 'add' ? '把「年份未知」加入' : '去掉「' + esc(termLabel(x.kind,x.term)) + '」') + '</span><b>能救回 ' + x.rescued + ' 篇</b></button>').join('');
  el.classList.toggle('relax-open',state.relaxOpen);
  el.innerHTML = '<span class="expr-label">表达式</span><div class="expr-text">' + content + '</div><div class="expr-actions">' +
    (near ? '<button class="expr-action" data-act="relax-toggle">放宽建议</button>' : '') +
    (parts.length || state.q || state.mode ? '<button class="expr-action" data-act="reset-all">清除</button>' : '') + '</div>' +
    (near ? '<div class="relax-box"><div class="relax-head">只测试单项变更，不组合条件</div>' + (rows || '<div class="relax-none">没有单项调整能恢复结果</div>') + '</div>' : '');
}

function renderListbar(ps){
  const batch = state.batchProgress;
  $('#listbar').innerHTML = '<div class="countrow"><div class="count"><b>' + ps.length + '</b> 篇 <span style="color:var(--muted-2)">· 全库 ' + PAPERS.length + '</span>' + (state.mode === 'review' ? ' <span style="color:var(--warn)">· 待补全模式</span>' : '') + '</div>' +
    '<div class="countacts"><select class="sel" id="sort" aria-label="排序"><option value="year"' + (state.sort === 'year' ? ' selected' : '') + '>年份 新→旧</option>' +
    '<option value="cites"' + (state.sort === 'cites' ? ' selected' : '') + '>引用最多</option><option value="added"' + (state.sort === 'added' ? ' selected' : '') + '>入库顺序</option></select>' +
    (batch ? '<span class="batch-progress" id="batchProgress" role="status">' + batchProgressText(batch) + '</span>' : state.mode === 'review' ? '<button class="btn tiny primary" data-act="fetch-all"' + (ps.length ? '' : ' disabled') + '>补全全部 ' + ps.length + ' 篇</button>' : '') +
    '<button class="btn tiny" data-act="to-ai"' + (ps.length ? '' : ' disabled') + '>问 AI · ' + ps.length + ' 篇</button></div></div>';
}

function yearIsSelected(year){
  return getGroupFilter(Retrieval.YEAR_GROUP).terms.some(t => t.range && year >= t.range[0] && year <= t.range[1]);
}

function metadataChip(key,value){
  const id = '@' + key;
  const filter = getGroupFilter(id);
  const term = Retrieval.termKey(Retrieval.META,value);
  const isYear = key === 'year';
  const on = isYear ? yearIsSelected(Number(value)) : filter.terms.some(t => Retrieval.termKey(Retrieval.META,t) === term);
  return '<button class="tag" style="--c:' + colorOf(key) + '" data-group="' + id + '" ' +
    (isYear ? 'data-act="year-toggle" data-year="' + esc(value) : 'data-act="metadata-toggle" data-value="' + esc(value)) +
    '" aria-pressed="' + on + '" title="' + esc(labelOf(key) + '：' + value) + '">' + esc(value) + '</button>';
}

function renderPaperMetadata(p){
  return METADATA_FACETS.map(function(f){
    const values = metadataValues(p,f.key);
    if(!values.length) return '<span class="tag missing-meta" style="--c:' + colorOf(f.key) + '">' + f.label + '待补</span>';
    const extra = values.slice(1);
    return metadataChip(f.key,values[0]) + (extra.length
      ? '<details class="paper-meta-more" data-field="' + f.key + '"><summary aria-label="其余' + extra.length + (f.key === 'author' ? '位作者' : '家单位') + '">+' + extra.length + (f.key === 'author' ? ' 位' : ' 家') + '</summary>' +
        extra.map(v => metadataChip(f.key,v)).join('') + '</details>'
      : '');
  }).join('');
}

function renderList(ps){
  const el = $('#papers');
  const scroll = el.scrollTop;
  const expanded = new Set($$('.paper-meta-more[open]',el).map(x => x.closest('.paper').dataset.id + ':' + x.dataset.field));
  if(!ps.length){
    if(!apiOnline) el.innerHTML = '<div class="empty"><div class="em">○</div><p>连不上本地服务</p><div style="font-size:11px;color:var(--muted-2);line-height:1.7;margin-bottom:12px">确认 run.py 还在运行，然后点下面重试。</div><button class="btn" data-act="reconnect">重试连接</button></div>';
    else if(!PAPERS.length) el.innerHTML = '<div class="empty"><div class="em">◇</div><p>书库还是空的</p><div style="font-size:11px;color:var(--muted-2);line-height:1.7;margin-bottom:12px">导入第一篇 PDF 开始。文件会复制进本地书库，原文件不动。</div><button class="btn primary" data-act="import">导入 PDF 或文件夹</button></div>';
    else {
      const fixes = Retrieval.rescue(PAPERS,retrievalFilter(),5);
      const suggestions = fixes.map(x => '<button class="relax-row" style="max-width:440px;margin:0 auto" data-act="apply-rescue" data-kind="' + x.action + '" data-group="' + esc(x.group_id) + '" data-key="' + esc(x.key) + '"><span>' + (x.action === 'add' ? '把「年份未知」加入' : '去掉「' + esc(termLabel(x.kind,x.term)) + '」') + '</span><b>能救回 ' + x.rescued + ' 篇</b></button>').join('');
      el.innerHTML = '<div class="empty"><div class="em">○</div><p>' + (state.mode === 'review' ? '待补全队列为空' : '没有符合这些条件的文献') + '</p><p style="font-size:11px;color:var(--muted-2)">布尔条件不留余量：去掉一个条件才能看到结果。</p>' + suggestions + '<button class="btn tiny" data-act="reset-all">清除搜索与筛选</button></div>';
    }
    el.scrollTop = 0;
    return;
  }
  const topics = new Map();
  state.groups.forEach(g => (g.tags || []).forEach(t => topics.set(t.id,{group:g.id,color:g.color || 'var(--c-topic)'})));
  state.unfiled.forEach(t => topics.set(t.id,{group:Retrieval.UNFILED,color:'var(--warn)'}));
  el.innerHTML = ps.map(function(p){
    const tags = (p.tags.topic || []).map(function(name,i){
      const id = (p.topicIds || [])[i];
      const hit = topics.get(id);
      if(!hit) return '<span class="tag" style="--c:var(--c-topic)">' + esc(name) + '</span>';
      return '<button class="tag" style="--c:' + esc(hit.color) + '" data-act="tag-toggle" data-group="' + esc(hit.group) + '" data-id="' + esc(id) +
        '" aria-pressed="' + getGroupFilter(hit.group).terms.includes(id) + '">' + esc(name) + '</button>';
    }).join('');
    const current = p.id === state.paperId;
    return '<article class="paper' + (current ? ' on' : '') + '" data-id="' + esc(p.id) + '">' +
      '<div class="paper-meta" aria-label="元数据标签">' + renderPaperMetadata(p) + '</div>' +
      '<div class="paper-title-row"><span class="pstatus ' + esc(p.status) + '" title="' + statusLabel(p.status) + '"><span class="d"></span></span>' +
      '<h3 class="ptitle"><button data-act="select" data-id="' + esc(p.id) + '" aria-current="' + current + '">' + esc(p.title) + '</button></h3>' +
      (p.needsReview ? '<span class="pstatus" style="color:var(--warn);font-size:9px">待补全</span>' : '') + '</div>' +
      (tags ? '<div class="ptags" aria-label="内容标签">' + tags + '</div>' : '') + '</article>';
  }).join('');
  $$('.paper-meta-more',el).forEach(x => { x.open = expanded.has(x.closest('.paper').dataset.id + ':' + x.dataset.field); });
  el.scrollTop = scroll;
}

/* ============================================================
   渲染：详情
   ============================================================ */
function chipHTML(facet, value, opts){
  opts = opts || {};
  const removable = opts.removable !== false;
  const clickable = opts.clickable !== false;
  // 话题标签的一句话定义：悬停就能读到这个标签收什么
  const def = facet === 'topic' ? tagDefinition(value) : '';
  return '<span class="tag" style="--c:' + colorOf(facet) + '"' +
    (def ? ' title="' + esc(def) + '"' : '') + '>' +
    (clickable
      ? '<button class="taglabel" data-act="filter-tag" data-facet="' + facet + '" data-value="' + esc(value) + '" title="用这个标签筛选">' + esc(value) + '</button>'
      : '<span class="taglabel">' + esc(value) + '</span>') +
    (removable
      ? '<button class="tagx" data-act="del-tag" data-facet="' + facet + '" data-value="' + esc(value) + '" title="从这篇移除">×</button>'
      : '') +

/* ---------- 组 ---------- */
function findTag(name){
  const groups = state.groups || [];
  for(const g of groups){
    for(const t of g.tags) if(t.name === name) return { group:g, tag:t };
  }
  for(const t of (state.unfiled || [])) if(t.name === name) return { group:null, tag:t };
  return null;
}

function topicColor(name){
  const hit = findTag(name);
  if(hit) return (hit.group && hit.group.color) || hit.tag.color || 'var(--c-topic)';
  return 'var(--c-topic)';
}

/* 打标只有一个面板：阅读器右侧栏。组状态也只有一份。 */
function isNewGroupMode(){
  return !!state.readerGroupNew;
}

function setNewGroupMode(on){
  state.readerGroupNew = !!on;
}

function groupPickerHTML(){
  if(isNewGroupMode()){
    return '<div class="groupbar rs-groupbar">' +
      '<input id="rtNewName" placeholder="新组名，如「功放组」" autocomplete="off" maxlength="120">' +
      '<button class="btn primary" data-act="create-group">建组</button>' +
      '<button class="linkbtn" data-act="cancel-new-group">取消</button>' +
    '</div>';
  }
  const groups = state.groups || [];
  const pick = state.groupSel;
  const opts = ['<option value="">未分组</option>'].concat(
    groups.map(g => '<option value="' + g.id + '"' + (g.id === pick ? ' selected' : '') + '>'
      + esc(g.name) + '</option>')
  ).concat(['<option value="__new">＋ 新建组…</option>']).join('');
  return '<select id="rtGroup" aria-label="标签所属的组">' + opts + '</select>';
}

/**
 * 读出阅读器侧栏当前要归入的组。
 *
 * 返回 `{id}` / `{id:null}`（未分组） / `{id:null, name, isNew:true}`（新建组）。
 * 新建组模式下**组名没填就返回 undefined**，让调用方提示并停下，
 * 而不是静默把标签丢进未分组——这正是标签建不出组的根源。
 * `null` = 控件不在（面板正在切换），调用方不猜。
 */
function groupFrom(){
  if(isNewGroupMode()){
    const input = $('#rtNewName');
    if(!input) return null;
    const name = input.value.trim();
    return name ? { id:null, name:name, isNew:true } : undefined;
  }
  const sel = $('#rtGroup');
  if(!sel) return null;
  const value = sel.value;
  if(!value) return { id:null };
  if(value === '__new') return null;
  return { id:value };
}

/* ---------- 打标加速：上次用过的组 + 本组快捷标签 ---------- */
function loadGroupPref(){
  try{
    const saved = localStorage.getItem('colophon.group');
    if(saved && (state.groups || []).some(g => g.id === saved)) return saved;
  }catch(err){ /* localStorage 不可用时退化为不记忆 */ }
  return null;
}

function rememberGroup(id){
  if(!id) return;
  try{ localStorage.setItem('colophon.group', id); }catch(err){}
}

function currentGroup(){
  if(!state.groupSel) return null;
  return (state.groups || []).find(g => g.id === state.groupSel) || null;
}

function quickTagsHTML(p){
  const g = currentGroup();
  const emptyCls = 'rs-quick rs-empty';
  if(!g){
    if(!(state.groups || []).length){
      return '<p class="' + emptyCls + '">还没有组。先建一个组，之后同类标签就能一键加。</p>';
    }
    return '<p class="' + emptyCls + '">现在归入的是「未分组」。选一个组，里面的标签就会排在这里供一键复用。</p>';
  }
  if(!g.tags.length){
    return '<p class="' + emptyCls + '">「' + esc(g.name) + '」还是空的。第一次打标签后，它会出现在这里供下次一键复用。</p>';
  }
  const onPaper = new Set(p.tags.topic);
  const picks = g.tags
    .slice()
    .sort((a,b) => b.count - a.count || a.name.localeCompare(b.name, 'zh'))
    .slice(0, 12);
  return '<div class="rs-quick">' + picks.map(function(t){
    const has = onPaper.has(t.name);
    return '<button class="qtag sm' + (has ? ' has' : '') + '"' +
      ' data-act="rt-quick" data-name="' + esc(t.name) + '"' +
      ' style="--c:' + (g.color || 'var(--c-topic)') + '"' +
      (has ? ' disabled' : '') +
      ' title="' + esc(t.name) + ' · 已有 ' + t.count + ' 篇">' +
      esc(t.name) + '<b>' + t.count + '</b>' +
    '</button>';
  }).join('') + '</div>';
}

/* 阅读器输入框的补全：按当前组优先排列 */
function paintQuickOptions(listId){
  const list = $('#' + listId);
  if(!list) return;
  const g = currentGroup();
  const inGroup = g ? g.tags.map(t => t.name) : [];
  const rest = (state.groups || [])
    .filter(x => !g || x.id !== g.id)
    .flatMap(x => x.tags.map(t => t.name))
    .concat((state.unfiled || []).map(t => t.name))
    .filter(n => inGroup.indexOf(n) === -1);
  const all = inGroup.concat(rest);
  list.innerHTML = all.map(n => '<option value="' + esc(n) + '"></option>').join('');
}

async function readerAddTag(){
  const p = readerPaper();
  const input = $('#rtValue');
  if(!p || !input) return;
  const value = input.value.trim();
  if(!value){ input.focus(); return; }
  const ok = await addTag('topic', value, p.id);
  if(ok) input.value = '';
  renderReaderSide();
  setTimeout(function(){ const i = $('#rtValue'); if(i) i.focus(); }, 0);
  return ok;
}

function readerRemoveTag(name){
  const p = readerPaper();
  if(!p || !name) return;
  p.topicIds = (p.topicIds || []).filter((id,i) => p.tags.topic[i] !== name);
  p.tags.topic = p.tags.topic.filter(function(t){ return t !== name; });
  renderReaderSide();
  renderAll();
  if(!apiOnline) return;
  fetch('/api/items/' + encodeURIComponent(p.id) + '/tags?facet=topic&name=' +
    encodeURIComponent(name), {method:'DELETE'})
    .then(function(res){ if(!res.ok) throw new Error('save'); return refreshPapers(); })
    .then(function(){ renderReaderSide(); })
    .catch(function(){ toast('保存失败，改动只在本页'); });
}
function wbQueue(){
  return PAPERS.filter(p => p.tags.topic.length === 0 && !state.wbSkip.has(p.id));
}

function workbenchCurrent(){
  const queue = wbQueue();
  if(state.wbId){
    const pinned = PAPERS.find(x => x.id === state.wbId);
    if(pinned) return { paper: pinned, queue: queue, pinned: true };
  }
  return queue.length ? { paper: queue[0], queue: queue, pinned: false } : null;
}

function renderWorkbench(){
  const el = $('#papers');
  const app = $('#app');

function wbSubline(p){
  const year = p.tags.year[0];
  const venue = p.venue ? esc(p.venue) : '';
  const yearBit = year
    ? esc(year)
    : '<span style="color:var(--warn)">年份待补</span>';
  const authors = (p.authors || []).slice(0,3).map(esc).join('、');
  return [venue, yearBit, authors].filter(Boolean).join(' · ');
}

function msgHTML(m){
  if(m.role === 'user'){
    return '<div class="msg user"><div class="bubble">' + esc(m.text) + '</div></div>';
  }
  if(m.pending){
    return '<div class="msg ai"><div class="typing"><i></i><i></i><i></i></div></div>';
  }
  const cites = m.cites || [];
  const citesHTML = cites.length
    ? '<div class="cites">' + cites.map(function(c, i){
        const itemId = c.itemId || c;
        const found = PAPERS.find(x => x.id === itemId);
        const title = c.title || (found ? found.title : itemId);
        const page = c.page || 0;
        return '<button data-act="cite" data-id="' + esc(itemId) + '" data-page="' + page + '"' +
          ' title="' + (page > 0 ? '打开第 ' + page + ' 页' : '打开这条文献') + '">' +
          '<b>' + (i + 1) + '</b><span class="ct">' + esc(title) + '</span>' +
          (page > 0 ? '<span class="cp">p.' + page + '</span>' : '') +
        '</button>';
      }).join('') + '</div>'
    : '';
  if(m.error){
    return '<div class="msg ai">' +
      '<div class="aimeta">AI · 出错</div>' +
      '<div class="aitext aierr">' + esc(m.text) + '</div>' +
    '</div>';
  }
  return '<div class="msg ai">' +
    '<div class="aimeta">AI · 范围 ' + (m.n || 0) + ' 篇' +
      (cites.length ? ' · ' + cites.length + ' 条引用' : '') +
      (m.model ? ' · ' + esc(m.model) : '') + '</div>' +
    '<div class="aitext">' + fmtAI(m.text, cites) + '</div>' +
    citesHTML +
  '</div>';
}

function fmtAI(text, cites){
  let h = esc(text || '');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\[(\d+)\]/g, function(match, i){
    const citation = cites[parseInt(i, 10) - 1];
    if(!citation) return match;
    const itemId = citation.itemId || citation;
    const page = citation.page || 0;
    return '<button class="cite" data-act="cite" data-id="' + esc(itemId) + '" data-page="' + page + '">[' + i + ']</button>';
  });
  h = h.replace(/\n/g, '<br>');
  return h;
}

function readerSuggestionHTML(p){
  const box = state.sugg[p.id];
  if(!state.ai.hasKey){
    return '<div class="rs-sugempty">接上模型后才能生成候选。' +
      '<button class="linkbtn" data-act="open-settings">配置模型</button></div>';

  }

      ' <button class="linkbtn" data-act="gen-sug" data-id="' + esc(p.id) + '">重试</button></div>';

  });
  if(!items.length){

      '<button class="linkbtn" data-act="gen-sug" data-id="' + esc(p.id) + '">重新生成</button></div>';
  }
  return items.map(function(s){
    const has = onPaper.has(s.name);
    return '<div class="rs-sug">' +
      '<div class="rs-sug-name">' + esc(s.name) +
        (s.reason ? '<span>' + esc(s.reason) + '</span>' : '') +

      '<div class="rs-sug-act">' +
        '<button class="btn tiny primary" data-act="accept-sug" data-facet="topic" data-value="' + esc(s.name) + '"' +

        '<button class="btn tiny" data-act="dismiss-sug" data-facet="topic" data-value="' + esc(s.name) + '">忽略</button>' +
      '</div>' +
    '</div>';
  }).join('') +
  '<div class="rs-sugempty"><button class="linkbtn" data-act="gen-sug" data-id="' + esc(p.id) + '">重新生成</button></div>';
}

async function loadSuggestions(itemId){
  if(!apiOnline){ toast('未连接本地服务，无法生成建议'); return; }
  if(!state.ai.hasKey){ toast('先配置模型 Key'); openSettings(); return; }
  const p = PAPERS.find(x => x.id === itemId);
  if(!p) return;

  state.sugg[itemId] = { status:'loading', items:[] };
  renderDetail();
  if(state.readerOpen) renderReaderSide();

  try{
    const res = await fetch('/api/items/' + encodeURIComponent(itemId) + '/suggest-tags', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ limit: 4 })
    });
    const data = await res.json().catch(function(){ return {}; });
    if(!res.ok){
      throw new Error(typeof data.detail === 'string' ? data.detail : ('生成失败（' + res.status + '）'));
    }
    // 重新生成时，把之前忽略的也放回来
    Array.from(state.dismissed).forEach(function(key){
      if(key.indexOf(itemId + '|') === 0) state.dismissed.delete(key);
    });
    state.sugg[itemId] = {
      status: 'ready',
      items: Array.isArray(data.tags) ? data.tags : [],
      model: data.model || ''
    };
  }catch(err){
    state.sugg[itemId] = {
      status: 'error',
      items: [],
      message: String((err && err.message) || err)
    };
  }finally{
    renderDetail();
    if(state.readerOpen) renderReaderSide();
  }
}

/* AI 回答由后端 /api/ai/ask 生成 */

async function send(text){
  if(state.busy) return;
  const scope = aiScope();
  if(!scope.length) return;
  if(!state.ai.hasKey){ toast('先配置模型 Key'); openSettings(); return; }

  state.chat.push({role:'user', text:text});
  state.chat.push({role:'ai', pending:true});
  state.busy = true;
  state.pendingScroll = 'bottom';
  renderDetail();

  try{
    const res = await fetch('/api/ai/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: text,
        itemIds: scope.map(p => p.id),
        conversationId: state.conversationId
      })
    });
    const data = await res.json().catch(function(){ return {}; });
    if(!res.ok){
      const detail = typeof data.detail === 'string' ? data.detail : ('请求失败（' + res.status + '）');
      throw new Error(detail);
    }
    state.conversationId = data.conversationId || null;
    rememberConversation();
    let answer = String(data.answer || '');
    let citations = Array.isArray(data.citations) ? data.citations : [];
    // 只保留回答里实际引用的来源，并按首次出现重新编号
    const used = [];
    answer = answer.replace(/\[(\d+)\]/g, function(match, digit){
      const index = parseInt(digit, 10) - 1;
      if(index < 0 || index >= citations.length) return match;
      let position = used.indexOf(index);
      if(position === -1){
        used.push(index);
        position = used.length - 1;
      }
      return '[' + (position + 1) + ']';
    });
    if(used.length){
      citations = used.map(function(index){ return citations[index]; });
    }
    state.chat.pop();
    state.chat.push({
      role: 'ai',
      text: answer,
      cites: citations,
      n: data.scopeCount || scope.length,
      model: data.model || ''
    });
  }catch(err){
    state.chat.pop();
    state.chat.push({
      role: 'ai',
      error: true,
      text: String((err && err.message) || err)
    });
  }finally{
    state.busy = false;
    state.pendingScroll = 'bottom';
    renderDetail();
    const input = $('#chatInput');
    if(input) input.focus();
  }
}

function citeJump(itemId, page){
  selectPaper(itemId);

    tries++;
    if(!state.readerOpen) return;
    if(pdfView.itemId === itemId && pdfView.pages.length){
      goToPage(page, false);
      return;
    }
    if(tries < 120) setTimeout(step, 100);
  })();
}

async function saveAISettings(){
  const val = id => {
    const el = document.getElementById(id);
    return el ? el.value.trim() : '';
  };
  const payload = { baseUrl: val('setBaseUrl'), model: val('setModel') };
  const key = val('setKey');
  if(key) payload.apiKey = key;
  try{
    const res = await fetch('/api/settings/ai', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('http ' + res.status);
    state.ai = await res.json();
    state.modalOpen = false;
    renderModal();
    if(state.ai.hasKey){
      Object.keys(state.sugg).forEach(function(key){
        if(state.sugg[key] && state.sugg[key].status === 'error') delete state.sugg[key];
      });
    }
    toast(state.ai.hasKey ? '模型设置已保存' : '已保存，但还没有填 Key');
    renderAll();
  }catch(err){
    toast('保存失败，请重试');
  }
}

      id: state.conversationId,
      ids: state.scopeIds || ''

  }catch(err){ /* 隐私模式 */ }
}

function forgetConversation(){
  try{ localStorage.removeItem('colophon:conv'); }catch(err){ /* 隐私模式 */ }
}

async function restoreConversation(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('colophon:conv') || 'null'); }catch(err){ saved = null; }
  if(!saved || !saved.id) return;
  const current = (state.aiExpand ? PAPERS : getFiltered()).map(p => p.id).sort().join(',');
  if(saved.ids !== current) return;
  try{
    const res = await fetch('/api/conversations/' + encodeURIComponent(saved.id));
    if(!res.ok) return;
    const data = await res.json();
    const messages = (data.messages || []).filter(m => m.role !== 'system');
    if(!messages.length) return;
    state.conversationId = saved.id;
    state.chat = messages.map(function(m){
      if(m.role === 'assistant'){
        return {
          role: 'ai',
          text: m.content,
          cites: m.citations || [],
          n: (data.scope && data.scope.count) || 0,
          model: m.model || ''
        };
      }
      return { role: 'user', text: m.content };
    });
  }catch(err){
    /* 恢复失败就当没有历史 */
  }
}

async function saveMetaFields(){
  const p = PAPERS.find(x => x.id === state.paperId);
  if(!p) return;
  if(!apiOnline){ toast('未连接本地服务，改动不会保存'); return; }

  const val = id => {
    const el = document.getElementById(id);
    return el ? el.value.trim() : '';
  };
  const payload = {
    title: val('mfTitle'),
    abstract: val('mfAbstract'),
    venue: val('mfVenue'),
    doi: val('mfDoi'),
    arxiv_id: val('mfArxiv'),
    authors: val('mfAuthors').split(/[;,、]/).map(s => s.trim()).filter(Boolean),
    orgs: val('mfOrgs').split(/[;,、]/).map(s => s.trim()).filter(Boolean)
  };
  const year = val('mfYear');
  if(year) payload.year = Number(year);
  Object.keys(payload).forEach(function(key){
    if(payload[key] === '') delete payload[key];
  });
  if(!payload.authors || !payload.authors.length) delete payload.authors;

  try{
    const res = await fetch('/api/items/' + encodeURIComponent(p.id) + '/fields', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(res.status === 409){
      const err = await res.json().catch(function(){ return {}; });
      toast(esc(err.detail || 'DOI 已经在另一条上'));
      return;
    }
    if(!res.ok) throw new Error('http ' + res.status);
    state.modalOpen = false;
    renderModal();
    toast('元数据已保存');
    await refreshPapers();
  }catch(err){
    toast('保存失败，请重试');
  }
}

async function fetchMeta(itemId, opts){
  opts = opts || {};
  if(!apiOnline){ toast('未连接本地服务，无法抓取元数据'); return; }
  // 钉住这一篇：抓完可能已不在队列里，工作台不能因此跳走
  if(opts.keepWorkbench) state.wbId = itemId;
  state.metaBusy = itemId;
  renderAll();
  try{
    const res = await fetch('/api/items/' + encodeURIComponent(itemId) + '/metadata', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    });
    if(!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    const report = data.report || {};
    if(!data.ok){
      toast(esc(report.message || '没有抓到元数据'));
    }else{
      toast((report.source ? '<b>' + esc(report.source) + '</b> · ' : '') + esc(report.message || '已补全'));
    }

  }
