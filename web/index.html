<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Colophon · 文献工作台</title>
<script>
  try {
    if(localStorage.getItem('colophon:theme') === 'dark') document.documentElement.dataset.theme = 'dark';
  } catch(err) { /* 隐私模式 */ }
</script>
<style>
  :root{
    --bg:#f5f4ef;
    --panel:#ffffff;
    --panel-2:#faf9f5;
    --hover:#efeee8;
    --ink:#1b1c1a;
    --muted:#63655e;
    --muted-2:#73756d;
    --line:#e5e3da;
    --line-2:#d2cfc3;
    --accent:#1f6b58;
    --accent-2:#175445;
    --accent-soft:#e7f1ed;
    --ok:#2f7d4f;
    --warn:#b45309;
    --c-year:#5b6f83;
    --c-author:#a2672c;
    --c-org:#7757a6;
    --c-venue:#346e69;
    --c-topic:#1c7566;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype","Songti SC","Source Han Serif SC",Georgia,serif;
    --shadow:0 1px 2px rgba(20,24,20,.04),0 12px 28px -20px rgba(20,24,20,.35);
  }
  :root[data-theme="dark"]{
    --bg:#131413;
    --panel:#1b1d1b;
    --panel-2:#171917;
    --hover:#232623;
    --ink:#e9e8e1;
    --muted:#b2b5aa;
    --muted-2:#8b8e84;
    --line:#2b2e2b;
    --line-2:#3b3f3b;
    --accent:#5fb59d;
    --accent-2:#8fd0bd;
    --accent-soft:#1c332c;
    --ok:#6fbf8e;
    --warn:#d99a5b;
    --c-year:#8ea3b8;
    --c-author:#d3a06a;
    --c-org:#a98dd1;
    --c-venue:#77b6ae;
    --c-topic:#5cb8a5;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 34px -22px rgba(0,0,0,.9);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;overflow:hidden;
    background:var(--bg);color:var(--ink);
    font-family:var(--sans);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}
  *::-webkit-scrollbar{width:10px;height:10px}
  *::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
  *::-webkit-scrollbar-thumb:hover{background:var(--muted-2);background-clip:content-box}
  *::-webkit-scrollbar-track{background:transparent}

  /* ---------- top bar ---------- */
  .topbar{
    height:58px;display:flex;align-items:center;gap:14px;padding:0 16px;
    background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:40;
  }
  .brand{display:flex;align-items:center;gap:9px;flex:none}
  .mark{
    width:30px;height:30px;border-radius:9px;background:var(--accent);
    display:grid;place-items:center;color:#fff;flex:none;
  }
  :root[data-theme="dark"] .mark{color:#0f1714}
  .brand-text{line-height:1.1}
  .search{flex:1;min-width:0;max-width:620px;position:relative;margin-left:8px}
  .search svg{position:absolute;left:11px;top:9px;color:var(--muted);pointer-events:none}
  .search input{
    width:100%;min-width:0;height:34px;border:1px solid var(--line);background:var(--panel-2);
    border-radius:9px;padding:0 12px 0 32px;font-size:13px;outline:none;
  }
  .search input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
  .search input::placeholder{color:var(--muted-2)}
  .topacts{margin-left:auto;display:flex;align-items:center;gap:6px}
  .btn{
    height:32px;padding:0 11px;border:1px solid var(--line);border-radius:8px;
    display:inline-flex;align-items:center;gap:6px;font-size:12.5px;background:var(--panel);
    transition:background .12s,border-color .12s;
  }
  .btn:hover{background:var(--hover);border-color:var(--line-2)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  :root[data-theme="dark"] .btn.primary{color:#0f1714}
  .btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn.tiny{height:27px;padding:0 8px;font-size:12px;border-radius:7px}
  .btn.icon{width:32px;padding:0;justify-content:center}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .linkbtn{font-size:11.5px;color:var(--accent);text-decoration:none;border-radius:4px;padding:1px 2px}
  .linkbtn:hover{text-decoration:underline}

  /* ---------- layout ---------- */
  .app{
    display:grid;
    grid-template-columns:minmax(0,1fr) 428px;
    grid-template-rows:minmax(0,1fr);
    height:calc(100vh - 58px);
    min-height:0;
    overflow:hidden;
  }
  .desk{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden}

  /* ---------- retrieval groups ---------- */
  .filterzone{flex:none;background:var(--panel);border-bottom:1px solid var(--line);padding:9px 14px 8px;overflow:hidden}
  .tag-search-bar{display:flex;align-items:center;gap:7px;min-height:27px;margin-bottom:5px}
  .tag-join{display:inline-flex;gap:2px;padding:2px;background:var(--hover);border-radius:5px}
  .tag-join button{height:20px;padding:0 7px;border-radius:3px;font-size:9.5px;color:var(--muted-2)}
  .tag-join button[aria-pressed="true"]{background:var(--panel);color:var(--ink);font-weight:650;box-shadow:0 1px 2px rgba(20,24,20,.08)}
  .tag-excluded{margin-left:auto;font-size:9.5px;color:var(--warn);white-space:nowrap}
  .tag-exclude-toggle{width:22px;height:22px;flex:none;border-radius:4px;color:var(--muted-2);font-size:11px}
  .tag-exclude-toggle:hover{background:var(--hover);color:var(--ink)}
  .tag-exclude-toggle[aria-pressed="true"]{background:color-mix(in srgb,var(--warn) 12%,var(--panel));color:var(--warn)}
  .year-controls,.star-controls{display:flex;align-items:center;gap:7px;min-width:0}
  .year-controls{flex-wrap:wrap}
  .attr-label{font-size:10.5px;color:var(--muted);flex:none}
  .metadata-filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start;gap:4px 8px;margin:0 0 5px}
  .metadata-filter{display:grid;gap:4px;min-width:0}
  .metadata-filter input{width:100%;min-width:0;height:26px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);padding:0 7px;font-size:11px;outline:none}
  .metadata-filter input:focus{border-color:var(--accent)}
  .metadata-chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
  .metadata-filter .filter-option{white-space:normal;height:auto;min-height:24px;max-width:100%;overflow-wrap:anywhere;text-align:left}
  .year-form{display:inline-flex;align-items:center;gap:3px;flex:none}
  .year-form input{width:54px;height:24px;border:1px solid var(--line);border-radius:5px;background:var(--panel-2);padding:0 5px;font-size:10.5px;outline:none}
  .year-form input:focus{border-color:var(--accent)}
  .year-dash{color:var(--muted-2);font-size:10px}
  .year-singles{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0;max-width:100%}
  .year-chips{display:flex;align-items:center;gap:4px;max-width:100%;overflow:auto;padding:2px}
  .filter-check{display:inline-flex;align-items:center;gap:4px;color:var(--muted);font-size:10.5px;cursor:pointer}
  .filter-check input{margin:0;accent-color:var(--accent)}
  .filter-option{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 7px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-size:10.5px;color:var(--muted);white-space:nowrap;flex:none}
  .filter-option:hover{border-color:var(--line-2);background:var(--hover);color:var(--ink)}
  .filter-option[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent-2);font-weight:600}
  .tag-option[data-selection="exclude"]{background:color-mix(in srgb,var(--warn) 10%,var(--panel));border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn);font-weight:600}
  .filter-option:disabled{opacity:.42;cursor:default}
  .filter-option .fcount,.filter-check .fcount{font-size:9.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}
  .group-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:5px}
  .query-group{--gc:var(--c-topic);min-width:0;border:1px solid var(--line);border-top:2px solid var(--gc);border-radius:6px;background:var(--panel-2);padding:5px 6px 6px}
  .query-group.unfiled{--gc:var(--warn)}
  .query-group[hidden]{display:none}
  .qg-head{display:flex;align-items:center;gap:5px;min-width:0;margin-bottom:5px}
  .qg-name{font-size:10.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .qg-mark{font-size:8.5px;color:var(--warn);flex:none}
  .qg-ops{display:inline-flex;gap:1px;margin-left:auto;flex:none;background:var(--hover);padding:2px;border-radius:5px}
  .qg-op{height:20px;min-width:27px;padding:0 4px;border-radius:3px;font-size:9px;color:var(--muted-2)}
  .qg-op:hover{color:var(--ink)}
  .qg-op[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(20,24,20,.08);font-weight:650}
  .qg-foot{font-size:9px;color:var(--muted-2);font-variant-numeric:tabular-nums;flex:none}
  .qg-controls{display:flex;align-items:flex-start;gap:4px}
  .qg-options{display:flex;align-items:center;gap:4px;min-width:0;overflow:auto;scrollbar-width:thin}
  .query-group.expanded .qg-options{flex-wrap:wrap;max-height:84px}
  .qg-more{height:22px;font-size:9.5px;color:var(--accent);white-space:nowrap;flex:none;padding:2px}
  .qg-more:hover{text-decoration:underline}
  .tag-controls{display:inline-flex;align-items:center;gap:2px;flex:none;max-width:100%}
  .tag-option{--tc:var(--gc);height:22px;padding:0 6px;min-width:0;flex:0 1 auto;font-size:10px}
  .tag-option .tname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .tag-option .fcount{color:color-mix(in srgb,var(--tc) 78%,var(--muted))}
  .group-overflow{display:flex;justify-content:center;margin-top:3px}
  .group-overflow button{font-size:10px;color:var(--muted);padding:2px 6px}
  .group-overflow button:hover{color:var(--accent);text-decoration:underline}
  .group-empty{display:flex;align-items:center;gap:10px;border:1px dashed var(--line-2);border-radius:6px;padding:8px 10px;color:var(--muted);font-size:11px}
  .group-empty .btn{margin-left:auto;flex:none}
  .relax-row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:8px;padding:6px 5px;border-radius:4px;text-align:left;font-size:10.5px}
  .relax-row:hover{background:var(--hover)}
  #papers .relax-row{max-width:440px;margin:0 auto}
  .relax-row b{font-variant-numeric:tabular-nums;color:var(--accent);white-space:nowrap}
  .op-select{height:22px;border:1px solid var(--line);border-radius:5px;background:var(--panel);font-size:9.5px;padding:0 3px;color:var(--muted);outline:none;flex:none}
  .op-select:focus{border-color:var(--accent)}
  .qg-head .op-select{margin-left:auto}
  .group-wrap{position:relative}

  .fhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
  .fhead-right{display:flex;align-items:center;gap:8px}
  .fclose{display:none;width:22px;height:22px;align-items:center;justify-content:center;border-radius:5px;color:var(--muted)}
  .fclose:hover{background:var(--hover);color:var(--ink)}
  .ftitle{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .fsub{font-size:10.5px;color:var(--muted-2)}
  .fhead{display:flex;align-items:center;justify-content:space-between;padding:0 4px 10px}
  .fhead-right{display:flex;align-items:center;gap:8px}
  .fclose{display:none;width:22px;height:22px;align-items:center;justify-content:center;border-radius:5px;color:var(--muted)}
  .fclose:hover{background:var(--hover);color:var(--ink)}
  .ftitle{font-size:11px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .fsub{font-size:10.5px;color:var(--muted-2)}
  .fgroup{border-top:1px solid var(--line);padding:4px 0 8px}
  .fgroup-head{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:8px 4px;border-radius:6px;
  }
  .fgroup-head:hover{background:var(--hover)}
  .fgroup-title{
    display:flex;align-items:center;gap:6px;
    font-size:12px;font-weight:600;letter-spacing:.02em;color:var(--ink);
  }
  .fcount-sel{
    font-size:10px;line-height:1;padding:2px 5px;border-radius:99px;
    background:var(--c);color:#fff;font-weight:600;
  }
  :root[data-theme="dark"] .fcount-sel{color:#101613}
  .chev{color:var(--muted-2);transition:transform .15s}
  .fgroup.collapsed .chev{transform:rotate(-90deg)}
  .fgroup.collapsed .fgroup-body{display:none}
  .fgroup-body{padding-top:2px}
  .frow{
    width:100%;display:flex;align-items:center;gap:7px;padding:5px 6px;
    border-radius:7px;font-size:12.5px;text-align:left;line-height:1.35;
  }
  .frow:hover{background:var(--hover)}
  .frow.on{background:color-mix(in srgb,var(--c) 11%,transparent)}
  .frow.on .flabel{font-weight:600}
  .frow:disabled{opacity:.38;cursor:default}
  .frow:disabled:hover{background:none}
  .fbox{
    width:14px;height:14px;flex:none;border:1px solid var(--line-2);border-radius:4px;
    display:grid;place-items:center;color:#fff;background:var(--panel);
  }
  .frow.on .fbox{background:var(--c);border-color:var(--c)}
  :root[data-theme="dark"] .frow.on .fbox{color:#101613}
  .flabel{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fcount{font-size:10.5px;color:var(--muted-2);font-variant-numeric:tabular-nums}
  .frow.on .fcount{color:var(--c)}
  .morebtn{
    margin-top:3px;padding:4px 6px;font-size:11px;color:var(--muted);
    border-radius:5px;
  }
  .morebtn:hover{color:var(--ink);background:var(--hover)}

  .years{display:flex;align-items:flex-end;gap:3px;padding:4px 2px 2px}
  .ybar{
    flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;
    gap:2px;height:64px;border-radius:5px;padding:2px 0;
  }
  .ybar:hover{background:var(--hover)}
  .ybar:disabled{cursor:default}
  .ybar:disabled:hover{background:none}
  .ybar:disabled .ybarfill{opacity:.12}
  .ybar:disabled .ybarlabel{opacity:.55}
  .ybarcount{font-size:9px;color:var(--muted-2);font-variant-numeric:tabular-nums;height:11px}
  .ybar.on .ybarcount{color:var(--c);font-weight:700}
  .ybarfill{
    width:100%;max-width:16px;border-radius:3px 3px 1px 1px;
    background:var(--c);opacity:.3;min-height:3px;transition:opacity .12s;
  }
  .ybar:hover .ybarfill{opacity:.55}
  .ybar.on .ybarfill{opacity:1}
  .ybarlabel{font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums;height:12px}
  .ybar.on .ybarlabel{color:var(--c);font-weight:700}

  .src{
    margin-top:auto;padding:14px 4px 2px;border-top:1px solid var(--line);
    font-size:10.5px;color:var(--muted-2);line-height:1.6;
  }
  .srcline{display:flex;align-items:center;gap:6px;color:var(--muted)}
  .dot{width:6px;height:6px;border-radius:99px;background:var(--muted-2);flex:none}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 2px color-mix(in srgb,var(--ok) 18%,transparent)}

  /* ---------- list ---------- */
  .listcol{display:flex;flex-direction:column;min-width:0;min-height:0;flex:1;background:var(--bg)}
  .listbar{padding:7px 14px 6px;border-bottom:1px solid var(--line);flex:none;background:var(--panel-2)}
  .chiprow{display:flex;flex-wrap:wrap;align-items:center;gap:5px;min-height:24px}
  .chiphint{font-size:11.5px;color:var(--muted-2)}
  .fchip{
    display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 7px;
    border:1px solid var(--line);border-radius:6px;background:var(--panel);
    font-size:11.5px;color:var(--ink);
  }
  .fchip:hover{border-color:var(--line-2);background:var(--hover)}
  .fchip .cdot{width:6px;height:6px;border-radius:99px;background:var(--c);flex:none}
  .fchip .x{color:var(--muted-2);font-size:12px;line-height:1;margin-left:1px}
  .fchip:hover .x{color:var(--ink)}
  .countrow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;row-gap:6px}
  .count{font-size:11.5px;color:var(--muted);min-width:0}
  .count b{color:var(--ink);font-weight:650}
  .countacts{display:flex;align-items:center;gap:6px;margin-left:auto}
  .batch-progress{font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}
  .sel{
    height:27px;border:1px solid var(--line);background:var(--panel);border-radius:7px;
    font-size:11.5px;padding:0 6px;outline:none;color:var(--muted);
  }
  .sel:focus{border-color:var(--accent)}
  .papers{flex:1;min-height:0;overflow-y:auto;padding:7px 12px 30px;display:flex;flex-direction:column;gap:0}
  .paper{
    display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:8px;
    position:relative;flex:none;min-height:54px;padding:6px 8px;border:0;border-bottom:1px solid var(--line);
    border-radius:0;background:transparent;cursor:pointer;transition:background .12s;
  }
  .paper:hover{background:var(--panel)}
  .paper.on{
    box-shadow:inset 2px 0 0 var(--accent);
    background:var(--accent-soft);
  }
  .paper-actions{display:grid;gap:4px}
  .paper-actions .btn{height:23px;justify-content:center;font-size:11px;white-space:nowrap}
  .paper-meta,.ptags{display:flex;align-items:center;flex-wrap:wrap;gap:4px;min-width:0}
  .paper-meta{margin-bottom:4px}
  .paper-meta .tag,.ptags .tag{height:auto;min-height:19px;max-width:100%;padding:2px 5px;font-size:10.5px;line-height:1.25;white-space:normal;overflow-wrap:anywhere;text-align:left}
  .paper button.tag:hover,.paper button.tag[aria-pressed="true"]{border-color:var(--c);text-decoration:underline}
  .paper-meta .missing-meta{border-style:dashed;color:var(--muted)}
  .paper-meta-more{max-width:100%;font-size:10.5px;color:var(--muted);cursor:pointer}
  .paper-meta-more .tag{margin:3px 4px 0 0}
  .ptitle{flex:1;min-width:0;font-family:var(--serif);font-size:15px;line-height:1.4;font-weight:600;margin:0;overflow-wrap:anywhere}
  .ptitle button{display:block;width:100%;text-align:left}
  .ptags{margin-top:5px}

  .tag{
    display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 7px;
    border-radius:99px;font-size:11px;line-height:1;white-space:nowrap;
    background:color-mix(in srgb,var(--c) 10%,transparent);
    border:1px solid color-mix(in srgb,var(--c) 24%,transparent);
    color:color-mix(in srgb,var(--c) 88%,var(--ink));
  }
  .taglabel{padding:2px 0;color:inherit}
  .tagx{color:inherit;opacity:.5;font-size:12px;line-height:1;padding:0 1px}
  .tagx:hover{opacity:1}
  .tag b{font-weight:600;font-size:10px;margin-left:3px;opacity:.7}

  .empty{
    margin:auto;text-align:center;color:var(--muted);padding:40px 20px;
  }
  .empty .em{font-size:26px;opacity:.5;margin-bottom:8px}
  .empty p{margin:0 0 10px;font-size:13px}

  /* ---------- detail ---------- */
  .detail{
    display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel);
    border-left:1px solid var(--line);overflow:hidden;
  }
  .dhead{flex:1;min-height:0;overflow-y:auto;padding:15px 20px 26px}
  .dtopbar{display:flex;align-items:center;gap:8px;flex:none;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);font-size:11px;color:var(--muted)}
  .dtopbar .dback{display:inline-flex}
  .dtopbar-title{flex:1;min-width:0;font-size:12px;color:var(--ink);font-weight:550;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dback{display:none;width:24px;height:22px;align-items:center;justify-content:center;border-radius:5px;color:var(--muted);margin-right:2px}
  .dback:hover{background:var(--hover);color:var(--ink)}
  .dbody{flex:1;overflow-y:auto;padding:15px 20px 30px;min-height:0}
  .slabel{
    font-size:11px;letter-spacing:.1em;color:var(--muted);font-weight:600;
    text-transform:uppercase;margin-bottom:7px;display:flex;align-items:center;gap:6px;
  }
  .slabel .hint{font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--muted-2);font-weight:400}
  .dabs{
    font-size:13px;line-height:1.75;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;
  }
  .dabs-miss{font-size:12px;color:var(--muted);margin:0}
  .dmeta,.dnote{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
  .dmeta{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .dmeta-info{flex:1;min-width:0;overflow-wrap:anywhere}
  .dmeta-info .slabel{margin-bottom:3px}
  .dmeta-info p{margin:3px 0 0;font-size:11px;color:var(--muted)}
  .dmeta-info .dmeta-missing{color:var(--warn)}
  .dmeta-actions{display:flex;gap:5px;flex-wrap:wrap}
  .note{
    width:100%;min-height:120px;border:1px solid var(--line);border-radius:8px;background:var(--panel-2);
    padding:9px 11px;font:inherit;font-size:12.5px;line-height:1.7;resize:vertical;
  }
  .note:focus{outline:1px solid var(--accent);border-color:var(--accent)}
  .textinput{
    width:100%;height:34px;border:1px solid var(--line);border-radius:8px;
    padding:0 10px;background:var(--panel-2);font-size:12.5px;outline:none;
  }
  .textinput:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}

  .none{color:var(--muted-2);font-size:11px;padding-top:3px}
  .tagcloud{display:flex;flex-wrap:wrap;gap:4px}
  .hintline{font-size:11px;color:var(--muted-2);line-height:1.6;margin:7px 0 0}

  /* ---------- 打标 / 组 ---------- */
  .groupbar{display:flex;align-items:center;gap:5px;margin-top:9px;flex-wrap:wrap}
  .groupbar .glabel{font-size:11px;color:var(--muted);flex:none}
  .groupbar .gdot{width:6px;height:6px;border-radius:99px;background:var(--accent);flex:none}
  .groupbar select{
    height:30px;max-width:190px;border:1px solid var(--line);border-radius:7px;
    background:var(--panel-2);font-size:11.5px;padding:0 4px;outline:none;color:var(--ink);
  }
  .groupbar select:focus{border-color:var(--accent);background:var(--panel)}
  .groupbar input{
    flex:1;min-width:100px;height:30px;border:1px solid var(--accent);border-radius:7px;
    background:var(--panel);padding:0 9px;font-size:12px;outline:none;
  }
  .groupbar .btn{height:30px}
  .groupbar .gnew{font-size:11px;color:var(--accent);white-space:nowrap}
  .qtag{
    display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;
    border:1px solid color-mix(in srgb,var(--c) 28%,transparent);border-radius:99px;
    background:color-mix(in srgb,var(--c) 6%,transparent);color:color-mix(in srgb,var(--c) 88%,var(--ink));
    font-size:11px;
  }
  .qtag:hover{background:color-mix(in srgb,var(--c) 16%,transparent);border-color:color-mix(in srgb,var(--c) 46%,transparent)}
  .qtag b{font-weight:600;font-size:9.5px;opacity:.6}
  .qtag.has{opacity:.42;cursor:default}
  /* chat */
  .dbody.chat{display:flex;flex-direction:column;overflow:hidden;padding:0}
  .chat-top{padding:12px 20px 0;flex:none}
  .scopebar{
    display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;
    background:var(--accent-soft);border:1px dashed color-mix(in srgb,var(--accent) 38%,transparent);
  }
  .scopebar .lockic{color:var(--accent);flex:none;display:flex}
  .scope-txt{font-size:11.5px;line-height:1.45;color:var(--ink)}
  .scope-txt b{font-weight:650}
  .scope-txt span{display:block;font-size:10px;color:var(--muted);margin-top:1px}
  .scopebar .btn{margin-left:auto;flex:none}
  .scopebar.warn{background:color-mix(in srgb,var(--warn) 8%,var(--panel));border-color:color-mix(in srgb,var(--warn) 42%,transparent)}
  .scopebar.warn .lockic{color:var(--warn)}
  .scope-txt em{font-style:normal;color:var(--warn);font-weight:600}
  .scope-acts{display:flex;gap:6px;margin-left:auto;flex:none}
  .scope-link{background:none;border:0;color:var(--accent);font:inherit;font-size:11px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px}
  .cite .cp{margin-left:5px;color:var(--muted-2);font-size:10px}
  .msg .aierr{color:var(--warn)}
  .setnote{font-size:11px;color:var(--muted-2);line-height:1.65;margin:12px 0 0}
  .keyrow{display:flex;gap:6px}
  .keyrow .textinput{flex:1}
  .nokey{display:flex;align-items:center;gap:10px;justify-content:space-between;border:1px dashed color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 7%,var(--panel));border-radius:10px;padding:9px 11px}
  .nokey b{display:block;font-size:11.5px}
  .nokey span{display:block;font-size:10px;color:var(--muted);margin-top:2px}
  .nokey .btn{flex:none}
  .msgs{
    flex:1;overflow-y:auto;padding:14px 20px 6px;display:flex;flex-direction:column;gap:12px;min-height:0;
  }
  .chatempty{margin:auto;text-align:center;color:var(--muted);padding:10px 8px 20px}
  .ce-ic{font-size:20px;opacity:.5;margin-bottom:6px}
  .chatempty p{font-size:12px;line-height:1.7;margin:0}
  .msg{max-width:100%;font-size:12.5px;line-height:1.7}
  .msg.user{align-self:flex-end;max-width:86%}
  .msg.user .bubble{
    background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:12px 12px 3px 12px;
  }
  :root[data-theme="dark"] .msg.user .bubble{background:var(--accent);color:#0f1714}
  .msg.ai{
    align-self:stretch;background:var(--panel-2);border:1px solid var(--line);
    border-radius:3px 12px 12px 12px;padding:10px 12px;
  }
  .aimeta{font-size:9.5px;letter-spacing:.06em;color:var(--muted-2);margin-bottom:5px}
  .aitext{color:var(--ink)}
  .aitext strong{font-weight:650}
  .cite{
    font-size:10px;padding:1px 4px;border-radius:4px;background:var(--accent-soft);
    color:var(--accent);vertical-align:2px;margin:0 1px;font-variant-numeric:tabular-nums;
  }
  .cite:hover{background:var(--accent);color:#fff}
  .cites{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
  .cites button{
    display:inline-flex;gap:5px;align-items:center;max-width:100%;
    font-size:10px;color:var(--muted);background:var(--panel);border:1px solid var(--line);
    border-radius:5px;padding:2px 6px;text-align:left;
  }
  .cites button:hover{border-color:var(--line-2);color:var(--ink)}
  .cites b{color:var(--accent);font-weight:650}
  .cites .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:250px}
  .typing{display:flex;gap:3px;padding:4px 0}
  .typing i{width:5px;height:5px;border-radius:99px;background:var(--muted-2);animation:blink 1.1s infinite}
  .typing i:nth-child(2){animation-delay:.15s}
  .typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

  .composer-wrap{flex:none;padding:8px 20px 12px;border-top:1px solid var(--line);background:var(--panel)}
  .quick{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
  .quick button{
    font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;
    padding:4px 9px;background:var(--panel-2);
  }
  .quick button:hover{color:var(--ink);border-color:var(--line-2);background:var(--hover)}
  .composer{display:flex;gap:6px}
  .composer input{
    flex:1;min-width:0;height:36px;border:1px solid var(--line);border-radius:9px;
    background:var(--panel-2);padding:0 11px;font-size:12.5px;outline:none;
  }
  .composer input:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
  .composer .btn{height:36px}
  .footnote{font-size:9.5px;color:var(--muted-2);margin:6px 0 0;text-align:center}

  /* ---------- modal ---------- */
  .modal{
    position:fixed;inset:0;display:none;place-items:center;padding:24px;
    background:rgba(16,20,17,.38);backdrop-filter:blur(2px);z-index:60;
  }
  .modal.open{display:grid}
  .modal-card{
    width:min(760px,100%);max-height:82vh;overflow-y:auto;background:var(--panel);
    border:1px solid var(--line);border-radius:16px;padding:18px 20px 16px;box-shadow:0 24px 70px -30px rgba(0,0,0,.5);
  }
  .mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:12px}
  .mhead h3{margin:0 0 3px;font-size:16px;font-weight:650;letter-spacing:.02em}
  .mhead p{margin:0;font-size:11px;color:var(--muted)}
  .delete-paper-card{width:min(460px,100%);overflow-wrap:anywhere}
  .delete-paper-error{margin:12px 0 0;font-size:12px;color:var(--warn)}
  .delete-paper-card .metafoot{justify-content:flex-end}
  .btn.primary.delete-paper-confirm{background:var(--warn);border-color:var(--warn)}
  .libgroup{margin-bottom:14px}
  .lib-drop-ready{outline:1px dashed var(--line);outline-offset:4px;border-radius:6px}
  .lib-drop-active{outline:2px solid var(--accent);background:var(--accent-soft)}
  .libhead{
    display:flex;align-items:center;justify-content:space-between;
    font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px;
  }
  .libhead span:last-child{letter-spacing:0}
  .libvals{display:flex;flex-wrap:wrap;gap:4px}
  .libvals .tag{height:21px;font-size:11px}
  .libvals .tagmove{display:inline-grid;place-items:center;min-width:16px;height:100%;cursor:grab;opacity:.75}
  .libvals .tagmove:is(:hover,:focus-visible){opacity:1}
  .libvals .tagmove:active{cursor:grabbing}
  .libvals .lib-dragging{opacity:.45}
  .libvals .tagx[data-act="del-tag"]{min-width:16px;height:100%;opacity:.75}
  .libvals .tagx[data-act="del-tag"]:is(:hover,:focus-visible){color:var(--warn);opacity:1}
  #libDeleteTitle,#libMoveTitle,#libMoveImpact,#libPickTitle{overflow-wrap:anywhere}
  #libMoveImpact{line-height:1.65}
  .lib-move-error{margin:0 0 8px;color:var(--warn);font-size:12px}
  .libacts{display:flex;gap:9px;margin-top:5px}
  .libhead .hint{letter-spacing:0;text-transform:none;font-weight:400;color:var(--muted-2)}
  .pickgrouplist{display:flex;flex-direction:column;gap:5px;margin-top:4px}
  .pickgroup{
    display:flex;align-items:center;gap:8px;padding:8px 10px;text-align:left;
    border:1px solid var(--line);border-left:2px solid var(--c);border-radius:8px;
    background:var(--panel-2);font-size:12.5px;
  }
  .pickgroup:hover{background:var(--hover)}
  .pickgroup .gdot{width:7px;height:7px;border-radius:99px;background:var(--c);flex:none}
  .pickgroup .cnt{margin-left:auto;font-size:10.5px;color:var(--muted-2)}
  .clean-card{width:min(860px,100%);display:flex;flex-direction:column;overflow:hidden}
  .clean-list{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
  .clean-card .metafoot{flex-wrap:wrap}
  .clean-card .metafoot .btn{margin-left:auto;white-space:nowrap}
  .clean-dialog{width:min(420px,calc(100% - 48px));color:var(--ink);overflow-wrap:anywhere}
  .clean-dialog::backdrop{background:rgba(16,20,17,.38)}
  .clean-dialog .metafoot{justify-content:flex-end}
  .clean-pdf-picker{width:min(560px,calc(100% - 48px))}
  .clean-pdf-preview{width:min(920px,calc(100% - 32px));height:min(900px,calc(100% - 32px));max-height:none;padding:0;overflow:hidden}
  .clean-pdf-preview[open]{display:flex;flex-direction:column}
  .clean-pdf-preview .mhead{flex:none;align-items:center;margin:0;padding:10px 14px;border-bottom:1px solid var(--line)}
  .clean-pdf-preview .mhead h3{min-width:0;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .clean-pdf-preview .mhead form{flex:none}
  .clean-pdf-pages{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:12px;background:var(--bg)}
  .clean-pdf-status{margin:18px 0;text-align:center;color:var(--muted);font-size:12px}
  .clean-pdf-page{display:grid;place-items:center;width:100%;margin:0 auto 12px;background:#fff;color:#202421;box-shadow:0 1px 5px rgba(0,0,0,.16)}
  .clean-pdf-page canvas{display:block;width:100%;height:auto}
  .csec{margin-top:12px}
  .crow{display:flex;align-items:center;gap:8px;padding:8px;border-bottom:1px solid var(--line)}
  .cname{flex:1;min-width:0}
  .cvalue{display:grid;grid-template-columns:4em minmax(0,1fr);gap:6px;font-size:12px;overflow-wrap:anywhere}
  .clabel,.cdelete,.cempty{color:var(--muted)}
  .cnew{font-weight:600;color:var(--ok)}
  .cwhy{font-size:11px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
  .cact{display:flex;gap:6px;flex:none;white-space:nowrap}
  @media (max-width:560px){
    .crow{flex-direction:column;align-items:stretch}
    .cact{justify-content:flex-end}
  }

  /* ---------- 导入浏览 ---------- */
  .import-card{width:min(840px,100%);max-height:84vh;display:flex;flex-direction:column}
  .share-body{padding:12px 16px;overflow:auto;min-height:0}
  .share-options{display:grid;gap:10px}
  .share-choice-card{width:min(440px,100%);border-radius:8px}
  .share-choice{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
  .share-choice button{
    display:grid;justify-items:start;align-content:start;gap:6px;text-align:left;min-width:0;
    border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel-2);
    overflow-wrap:anywhere;
  }
  .share-choice button:hover{background:var(--accent-soft);border-color:var(--accent)}
  .share-choice strong{font-size:13px}
  .share-choice small{font-size:11px;color:var(--muted)}
  .share-choice-icon{display:grid;place-items:center;width:30px;height:30px;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
  .share-choice [data-kind="share"] .share-choice-icon{background:color-mix(in srgb,var(--c-year) 13%,var(--panel));color:var(--c-year)}
  .share-export-card{width:min(920px,100%);border-radius:8px;height:min(690px,84vh);overflow:hidden}
  .share-toolbar{display:grid;grid-template-columns:minmax(120px,1fr) auto auto;gap:8px;margin-bottom:12px}
  .share-search{display:flex;align-items:center;gap:6px;padding:0 8px;min-width:0;color:var(--muted)}
  .share-search input{width:100%;min-width:0;border:0;background:none;color:var(--ink);outline:0;padding:0}
  .share-search:focus-within{border-color:var(--accent)}
  .share-search,.share-toolbar select,.share-filter select,.share-filter input:is([type=number],[type=search]){
    min-height:32px;background:var(--panel);border:1px solid var(--line-2);border-radius:6px;font-size:12px;
  }
  .share-toolbar select,.share-filter select,.share-filter input:is([type=number],[type=search]){padding:4px 6px;min-width:0}
  .share-workspace{
    flex:1;min-height:0;display:grid;grid-template-columns:minmax(190px,28%) minmax(0,1fr);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;
  }
  .share-filters{min-height:0;overflow:auto;background:var(--panel-2);border-right:1px solid var(--line);padding:0 10px 8px}
  .share-filter-heading,.share-list-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
  .share-filter-heading{min-height:36px;margin:0 2px;color:var(--muted);font-size:12px}
  .share-filter{min-width:0;border-top:1px solid var(--line);font-size:12px}
  .share-filter summary{display:flex;align-items:center;min-height:32px;gap:6px;padding:0 4px;cursor:pointer;list-style:none}
  .share-filter summary::-webkit-details-marker{display:none}
  .share-filter summary:hover{background:var(--hover)}
  .share-filter summary .impicon{margin-left:auto;width:13px;height:13px}
  .share-filter[open] summary .impicon{transform:rotate(90deg)}
  .share-filter-count{color:var(--accent);font-size:11px;font-weight:650}
  .share-filter-count:empty{display:none}
  .share-filter-panel{display:grid;gap:6px;padding:0 2px 8px}
  .share-terms{min-width:0;max-height:180px;overflow:auto}
  .share-terms [hidden]{display:none}
  .share-check{display:flex;align-items:center;min-height:27px;gap:6px;padding:3px 5px;border-radius:4px;overflow-wrap:anywhere;cursor:pointer}
  .share-check:is(:hover,:focus-within){background:var(--hover)}
  .share-check:has(:checked){background:var(--accent-soft);color:var(--accent-2)}
  .share-check input,.share-row input{flex:none;accent-color:var(--accent);margin:0}
  .share-year-range{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .share-year-range label{display:grid;gap:3px;color:var(--muted)}
  .share-year-range input{width:100%;color:var(--ink)}
  .share-tag-group{margin-top:5px;color:var(--muted);font-size:11px}
  .share-tag-entry{padding:4px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
  .share-tag-entry>span{display:block;padding-inline:4px}
  .share-tag-actions{display:flex;gap:2px;flex-wrap:wrap}
  .share-filter-empty{margin:3px;color:var(--muted);font-size:12px}
  .share-filter-empty[hidden]{display:none}
  .share-list{display:flex;min-width:0;min-height:0;flex-direction:column}
  .share-list-head{min-height:36px;padding:4px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}
  .share-results{flex:1;min-height:0;overflow:auto;padding:0 4px}
  .share-row{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:start;gap:9px;padding:8px;border-bottom:1px solid var(--line);cursor:pointer;overflow-wrap:anywhere;font-size:13px}
  .share-row input{margin-top:3px}
  .share-row:hover{background:var(--hover)}
  .share-row:has(:checked){background:var(--accent-soft)}
  .share-row small{display:block;color:var(--muted-2)}
  .share-conflicts{margin:8px 0;padding-left:20px;overflow-wrap:anywhere}
  .paper.no-pdf{background:color-mix(in srgb,var(--warn) 9%,var(--panel));box-shadow:inset 3px 0 var(--warn)}
  .paper.no-pdf:hover{background:color-mix(in srgb,var(--warn) 14%,var(--panel))}
  .paper.no-pdf.on{background:var(--accent-soft);box-shadow:inset 3px 0 var(--warn),inset 0 0 0 1px var(--accent)}
  .no-pdf-label{
    display:inline-flex;align-items:center;gap:4px;margin:0 0 3px;padding:2px 5px;border-radius:4px;
    background:color-mix(in srgb,var(--warn) 15%,var(--panel));color:color-mix(in srgb,var(--warn) 75%,var(--ink));
    font-size:11px;font-weight:650;line-height:1.3;
  }
  .no-pdf-label .impicon{width:13px;height:13px;color:inherit}
  @media (max-width:620px){
    .share-export-card{padding:12px;max-height:90vh;height:90vh}
    .share-toolbar{grid-template-columns:repeat(2,minmax(0,1fr))}
    .share-search{grid-column:1/-1}
    .share-workspace{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
    .share-filters{max-height:min(30vh,225px);border-right:0;border-bottom:1px solid var(--line)}
    .share-filter-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:8px}
    .share-filter[open]{grid-column:1/-1}
  }
  @media (max-width:360px){.share-choice{grid-template-columns:minmax(0,1fr)}}
  .importbar{display:flex;align-items:center;gap:6px;margin-bottom:8px}
  .importpath{
    flex:1;min-width:0;font-size:12px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);
    border-radius:5px;padding:6px 9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .importpane{display:grid;grid-template-columns:150px minmax(0,1fr);height:clamp(200px,49vh,470px);min-height:160px;border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .importnav{overflow:auto;background:var(--panel-2);border-right:1px solid var(--line);padding:7px 5px}
  .importnav button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border-radius:4px;text-align:left;font-size:12px;white-space:nowrap}
  .importnav button:not(:disabled):hover,.improw:not(:disabled):hover{background:var(--hover)}
  .importnav button[aria-current="location"]{background:var(--hover);box-shadow:inset 2px 0 var(--accent)}
  .importnav h4{margin:8px 8px 3px;font-size:11px;font-weight:500;color:var(--muted)}
  .importbody{
    min-height:0;overflow:auto;background:var(--panel);
  }
  .impcolumns{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;gap:10px;padding:7px 12px 7px 37px;border-bottom:1px solid var(--line);background:var(--panel-2);font-size:11px;color:var(--muted)}
  .improw{
    display:flex;align-items:center;gap:8px;width:100%;min-height:32px;padding:5px 12px;
    border-bottom:1px solid var(--line);background:transparent;text-align:left;
    font-size:12.5px;color:var(--ink);cursor:pointer;
  }
  .improw:last-child{border-bottom:0}
  .improw:has(input:checked){background:var(--hover)}
  .improw:disabled,.importnav button:disabled{cursor:default}
  .impicon{display:block;width:16px;height:16px;flex:none;color:var(--muted)}
  .impname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .impsize{flex:none;font-size:10.5px;color:var(--muted-2);max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
   .improw input:is([type="checkbox"],[type="radio"]){
    width:14px;height:14px;flex:none;accent-color:var(--accent);margin:0;
  }
  .impempty{padding:34px 16px;text-align:center;font-size:12px;color:var(--muted)}
  .impmessage{margin:8px 0 0;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
  .importfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:10px}
  .importsum{font-size:11px;color:var(--muted);min-width:0}
  .importacts{display:flex;gap:8px;flex-wrap:wrap}
  @media (max-width:560px){
    .importpane{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
    .importnav{display:flex;gap:3px;border-right:0;border-bottom:1px solid var(--line)}
    .importnav button{width:auto;flex:none}
    .importnav h4{display:none}
  }

  /* ---------- toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);
    background:var(--ink);color:var(--bg);padding:8px 13px;border-radius:8px;
    font-size:12px;opacity:0;pointer-events:none;transition:.18s;z-index:90;
    max-width:80vw;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast b{font-weight:650}

  @media (max-width:840px){
    .brand{gap:6px}
    .topacts .btn{padding:0 5px;font-size:0;gap:0;justify-content:center}
    .topacts .btn svg{width:14px;height:14px}
    .topacts .organize-btn,.topacts .import-btn,.topacts .export-btn{font-size:11px}
  }

  /* ---------- 元数据 ---------- */
  .meta-card{width:min(560px,92vw)}
  .metaform{display:flex;flex-direction:column;gap:9px;margin-top:12px}
  .mfrow{display:grid;grid-template-columns:76px minmax(0,1fr);align-items:center;gap:10px}
  .mfrow label{font-size:11.5px;color:var(--muted)}
  .mfrow .textinput{width:100%}
  .mfrow textarea{width:100%;min-height:74px;resize:vertical;font:inherit;font-size:12.5px;line-height:1.6;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
  .mfrow textarea:focus{outline:none;border-color:var(--accent)}
  .metafoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
  .mnote-inline{font-size:11px;color:var(--muted-2)}

  /* ---------- PDF 阅读器 ---------- */
  .reader{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column}
  .reader[hidden]{display:none}
  .rtop{flex:none;display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);min-height:50px}
  .rbtn{display:inline-flex;align-items:center;justify-content:center;height:28px;min-width:28px;padding:0 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink);font:inherit;font-size:13px;line-height:1;cursor:pointer}
  .rbtn:hover{background:var(--hover)}
  .rbtn:disabled{opacity:.38;cursor:default;background:var(--panel)}
  .rtitle{flex:1;min-width:0;font-size:13px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rtitle .rname{font-weight:400;font-size:11px;color:var(--muted-2);margin-left:8px}
  .rgroup{flex:none;display:flex;align-items:center;gap:4px}

  .rtagbtn[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent-2);font-weight:600}
  .rmain{flex:1;min-height:0;display:flex;position:relative;overflow:hidden}
  /* ---------- 阅读时打标签（右侧不遮挡原文） ---------- */
  .rside{
    width:318px;flex:none;overflow-y:auto;background:var(--panel);

    height:30px;max-width:132px;border:1px solid var(--line);border-radius:7px;

  .rs-add input{flex:1;min-width:0;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);padding:0 9px;font-size:11.5px;outline:none}

  .rs-add .btn{height:30px;padding:0 9px}

    width:100%;height:30px;border:1px solid var(--line);border-radius:7px;
    background:var(--panel-2);font-size:11.5px;padding:0 6px;outline:none;color:var(--ink);
  }
  .rs-group select:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--accent-soft)}
  .rs-group .groupbar{padding:0;margin:0;gap:5px}
  .rs-group .groupbar input{flex:1;min-width:0;height:30px}
  .rs-group .groupbar .btn{height:30px}

  .rs-sugempty{font-size:10.5px;color:var(--muted-2);line-height:1.6;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .rs-sugempty.warn{color:var(--warn)}
  .rs-st{font-size:10.5px;padding:3px 8px;border:1px solid var(--line);border-radius:99px;color:var(--muted);background:var(--panel-2)}
  .rs-st.on{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent-2);font-weight:650}
  .rs-foot{margin-top:auto;display:flex;align-items:center;flex-wrap:wrap;gap:6px}

  .rpage{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:66px;text-align:center}
  .rz{min-width:58px;font-variant-numeric:tabular-nums;font-size:12px}
  .rbody{flex:1;min-width:0;overflow:auto;overflow-anchor:none;scrollbar-gutter:stable;padding:18px 24px 64px;background:var(--bg);position:relative}
  .rbody.blank{overflow:hidden}
  .rpage-wrap{position:relative;margin:0 auto 16px;background:#fff;border-radius:2px;box-shadow:0 2px 12px rgba(20,24,20,.14);overflow:hidden}
  .rpage-wrap canvas{display:block;width:100%;height:100%}
  .rpage-wrap canvas[hidden]{display:none}
  .rtext{position:absolute;top:0;left:0;overflow:hidden;line-height:1;text-align:start;text-size-adjust:none;forced-color-adjust:none;transform-origin:0 0;user-select:text}
  .rtext :is(span,br){position:absolute;color:transparent;white-space:pre;cursor:text;transform-origin:0 0}
  .rtext[data-main-rotation="90"]{transform:rotate(90deg) translateY(-100%)}
  .rtext[data-main-rotation="180"]{transform:rotate(180deg) translate(-100%,-100%)}
  .rtext[data-main-rotation="270"]{transform:rotate(270deg) translateX(-100%)}
  .rtext ::selection{color:transparent;background:rgba(36,112,238,.34)}
  .rtext br::selection{background:transparent}
  .rpage-n{position:absolute;left:8px;bottom:6px;font-size:10px;color:#8a8c84;background:rgba(255,255,255,.86);border-radius:3px;padding:1px 5px;pointer-events:none;user-select:none}
  .rmissing{max-width:430px;margin:11vh auto 0;text-align:center;color:var(--muted)}
  .rmissing .em{font-size:30px;color:var(--line-2);margin-bottom:12px}
  .rmissing p{margin:0 0 16px;line-height:1.75;font-size:13px}
  .rmissing-actions{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:8px}
  .rmissing-actions a.btn{text-decoration:none}
  .rloading{position:absolute;inset:0;display:none;place-items:center;font-size:13px;color:var(--muted);background:var(--bg);z-index:2}
  .rloading.show{display:grid}
  @media (max-width:700px){
    .rtitle .rname{display:none}
    .rtitle{font-size:12px}
    .rbody{padding:12px 8px 48px}
    .rpage{min-width:52px}
    .rz{min-width:46px}
  }
  /* 窄屏：打标签栏覆盖整个阅读区，而不是挤窄 PDF */
  @media (max-width:900px){
    .rside{
      position:absolute;inset:0;width:auto;z-index:3;
      box-shadow:-18px 0 34px -26px rgba(0,0,0,.5);
    }
  }
</style>

<script>
/* ============================================================
   数据：全部从 /api/items 读取；连不上就显示重连提示，没有演示数据
   ============================================================ */
const Retrieval = window.ColophonRetrieval;
const METADATA_FACETS = [
  {key:'year', label:'年份'},
  {key:'author', label:'作者'},
  {key:'org', label:'单位'},
  {key:'venue', label:'期刊'}
];
let apiOnline = false;
let PAPERS = [];


/* ============================================================
   工具
   ============================================================ */
const $  = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labelOf = k => k === 'topic' ? '标签' : (METADATA_FACETS.find(f => f.key === k) || {}).label || k;
const LABEL_STATE_LABELS = {review:'待补全', untagged:'未打标', tagged:'已打标'};
const fieldLabel = k => ({title:'标题', authors:'作者', year:'年份', venue:'期刊 / 会议', orgs:'单位', abstract:'摘要'}[k] || k);
const ORGANIZE_HASH = '#organize';

function initialFacets(){
  return {
    groupFilters:{'@year':{terms:[], includeUnknown:true}},
    yearDraft:{yearFrom:'', yearTo:'', yearSingle:'', adding:false},
    metadataDraft:{}
  };
}

const state = {
  q:'',
  organizeQ:'',
  sort:'year',
  workspace:'search',
  queue:'review',
  searchListScroll:0,
  searchSidebarScroll:0,
  searchExpandedPapers:new Set(),
  searchFacets:initialFacets(),
  queueFacets:{review:initialFacets(), untagged:initialFacets()},
  metadataOpen:{search:false, organize:true},
  groupsExpanded:false,
  expandedGroups:new Set(),
  filtersOpen:false,
  tagQuery:{op:'and',include:[],exclude:[]},
  eval:null,
  queueEval:null,
  rescue:[],
  paperId:null,
  detailOpen:false,
  detailReturnTo:null,
  detailListScroll:null,
  tab:'info',
  chat:[],
  busy:false,
  sugg:{},
  dismissed:new Set(),
  modalOpen:false,
  modalMode:'tags',
  metaItemId:null,
  metaBusy:null,
  batchProgress:null,
  ai:{baseUrl:'', model:'', hasKey:false, keyHint:''},
  aiExpand:false,
  expandConfirm:false,
  conversationId:null,
  scopeIds:undefined,
  readerOpen:false,
  pendingScroll:null,
  groups:[],          // 后端按组返回的标签树
  unfiled:[],         // 未分组的标签（后端算出来的，不是数据库行）
  clean:null,         // 数据清洗的扫描结果与待处理记录
  groupSel:null,      // 阅读器打标面板当前的组 id
  readerTags:true,    // 阅读器右侧的打标栏是否展开
  readerGroupNew:false,  // 阅读器侧栏正在内联新建组（全应用唯一的组状态）
  readerItemId:null   // 阅读器里正在读的条目（loadPdf 完成前也有效）
};

function labelState(p){
  return Retrieval.labelState(p);
}

let toastTimer = null;
function toast(msg){
  const t = $('#toast');
  t.innerHTML = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

/* ============================================================
   检索状态与求值
   ============================================================ */
function activeFacets(){
  return state.workspace === 'organize' ? state.queueFacets[state.queue] : state.searchFacets;
}

function getGroupFilter(id, op, facets = activeFacets()){
  const filters = facets.groupFilters;
  if(!filters[id]) filters[id] = {op:op || 'any', terms:[]};
  if(!Array.isArray(filters[id].terms)) filters[id].terms = [];
  return filters[id];
}

function metadataValues(p, key){
  return key === 'year' ? (Number.isFinite(p.year) ? [String(p.year)] : []) : Retrieval.metadataValues(p,key);
}

function groupKind(id){
  if(id === Retrieval.YEAR_GROUP) return Retrieval.YEAR;
  if(id === Retrieval.STAR_GROUP) return Retrieval.ATTR;
  if(METADATA_FACETS.some(f => '@' + f.key === id)) return Retrieval.META;
  return Retrieval.TAG;
}

function searchPapers(){
  return PAPERS.filter(p => labelState(p) === 'tagged');
}

function metadataGroups(papers, facets){
  const groups = [];
  const year = getGroupFilter(Retrieval.YEAR_GROUP,'any',facets);
  groups.push({kind:Retrieval.YEAR, group_id:Retrieval.YEAR_GROUP, terms:year.terms.slice(), includeUnknown:year.includeUnknown});

  METADATA_FACETS.slice(1).forEach(function(f){
    const id = '@' + f.key;
    const filter = getGroupFilter(id,'any',facets);
    const options = new Map();
    papers.forEach(p => metadataValues(p,f.key).forEach(function(value){
      const key = Retrieval.termKey(Retrieval.META,value);
      if(!options.has(key)) options.set(key,value);
    }));
    groups.push({kind:Retrieval.META, group_id:id, op:'any', terms:filter.terms.slice(), options:Array.from(options.values()).sort((a,b) => a.localeCompare(b,'zh'))});
  });
  return groups;
}

function retrievalGroups(papers){
  const groups = metadataGroups(papers,state.searchFacets);
  const star = getGroupFilter(Retrieval.STAR_GROUP,'any',state.searchFacets);
  groups.push({kind:Retrieval.ATTR, group_id:Retrieval.STAR_GROUP, terms:star.terms.slice(), options:[{star:true}]});

  (state.groups || []).forEach(function(g){
    groups.push({kind:Retrieval.TAG, group_id:g.id, op:'any', terms:[], options:(g.tags || []).map(t => t.id)});
  });
  groups.push({kind:Retrieval.TAG, group_id:Retrieval.UNFILED, op:'any', terms:[], options:(state.unfiled || []).map(t => t.id)});
  return groups;
}

function retrievalFilter(papers){
  return {q:state.q, tagQuery:state.tagQuery, groups:retrievalGroups(papers)};
}

function currentEvaluation(){
  if(!state.eval){
    const papers = searchPapers();
    state.eval = Retrieval.evaluate(papers, retrievalFilter(papers));
  }
  return state.eval;
}

function sorter(a,b, sort = state.sort){
  if(sort === 'added') return 0;
  return (b.year ?? -1) - (a.year ?? -1);
}

function getFiltered(){
  return currentEvaluation().matched.slice().sort(sorter);
}

function tagSelection(id){
  if(state.tagQuery.exclude.includes(id)) return 'exclude';
  if(state.tagQuery.include.includes(id)) return 'include';
  return '';
}

function toggleTagQuery(id, exclude){
  const query = state.tagQuery;
  const selected = exclude ? query.exclude : query.include;
  const other = exclude ? query.include : query.exclude;
  const i = selected.indexOf(id);
  if(i >= 0){
    selected.splice(i,1);
  }else{
    const previous = other.indexOf(id);
    if(previous >= 0) other.splice(previous,1);
    selected.push(id);
  }
  renderFilterChange();
}

function findGroupDef(id){
  if(id === Retrieval.UNFILED) return {id:id,name:'未分组',color:'var(--warn)',tags:state.unfiled || []};
  return (state.groups || []).find(g => g.id === id) || null;
}

function findTagById(id){
  for(const g of (state.groups || [])) for(const t of (g.tags || [])) if(t.id === id) return {group:g,tag:t};
  for(const t of (state.unfiled || [])) if(t.id === id) return {group:null,tag:t};
  return null;
}

function groupEval(id){
  const evaluation = state.workspace === 'organize' ? queueEvaluation() : currentEvaluation();
  return evaluation.groups.find(g => g.group_id === id) || null;
}

function optionEval(id,key){
  const g = groupEval(id);
  return g ? g.options.find(o => o.key === key) || null : null;
}

function termLabel(kind,term){
  if(kind === Retrieval.META) return term;
  if(kind === Retrieval.TAG){
    const hit = findTagById(term);
    return hit ? hit.tag.name : '已失效的标签';
  }
  if(kind === Retrieval.YEAR){
    if(typeof term === 'number') return String(term);
    return term.range[0] + '–' + term.range[1];
  }
  if(term && 'star' in term) return term.star ? '星标' : '非星标';
  return '';
}

function opLabel(op){ return op === 'all' ? '全部' : op === 'none' ? '排除' : '任一'; }

function checkSVG(){
  return '<svg width="9" height="9" viewBox="0 0 10 10" fill="none" aria-hidden="true">' +
    '<path d="M2 5.1 4.1 7.2 8 3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>' +
  '</svg>';
}

/* ============================================================
   渲染：列表
   ============================================================ */
function groupColor(id){
  const def = findGroupDef(id);
  return id === Retrieval.UNFILED ? 'var(--warn)' : ((def && def.color) || 'var(--c-topic)');
}

function opControl(groupId,current){
  const ops = [['any','任一'],['all','全部'],['none','排除']];
  const def = findGroupDef(groupId);
  const name = (def && def.name) || '标签组';
  return '<select class="op-select" data-change="group-op" data-group="' + esc(groupId) + '" aria-label="' + esc(name) + '操作符">' +
    ops.map(([value,label]) => '<option value="' + value + '"' + (value === current ? ' selected' : '') + '>' + label + '</option>').join('') + '</select>';
}

function renderYearOptions(){
  const filter = getGroupFilter(Retrieval.YEAR_GROUP);
  const draft = activeFacets().yearDraft;
  const chips = filter.terms.filter(Number.isInteger).map(y =>
    '<button class="filter-option" data-act="year-remove" data-year="' + y + '" aria-label="移除单年 ' + y + '" title="移除单年 ' + y + '">' + y + '<span aria-hidden="true">×</span></button>').join('');
  const rangeForm = '<span class="year-form" role="group" aria-label="年份区间">' +
    yearInput('yearFrom','起年','起始年份') + '<span class="year-dash">–</span>' + yearInput('yearTo','止年','结束年份') + '</span>';
  const singleForm = draft.adding ? '<span class="year-form">' + yearInput('yearSingle','单年','输入单年') +
    '<button class="btn tiny" data-act="year-single-confirm">确定</button></span>' :
    '<button id="yearSingleAdd" class="btn tiny" data-act="year-single-add">＋ 添加单年</button>';
  return '<span class="attr-label">年份</span>' + rangeForm +
    '<div class="year-singles" role="group" aria-label="单年筛选">' +
    (chips ? '<div class="year-chips">' + chips + '</div>' : '') + singleForm + '</div>' +
    '<label class="filter-check"><input id="yearIncludeUnknown" type="checkbox"' + (filter.includeUnknown ? ' checked' : '') + '>包含未知年份</label>';
}

function yearInput(id,placeholder,label){
  return '<input id="' + id + '" type="text" inputmode="numeric" autocomplete="off" placeholder="' + placeholder +
    '" aria-label="' + label + '" value="' + esc(activeFacets().yearDraft[id]) + '">';
}

function renderMetadataFilters(){
  const draft = activeFacets().metadataDraft;
  return '<div class="metadata-filters" role="group" aria-label="元数据检索">' + METADATA_FACETS.slice(1).map(function(f){
    const id = '@' + f.key;
    const inputId = 'metadataSearch-' + f.key;
    const listId = 'metadataList-' + f.key;
    const group = groupEval(id);
    const filter = getGroupFilter(id);
    const options = group.options.filter(o => !o.selected).map(o =>
      '<option value="' + esc(o.term) + '">' + esc(o.term) + ' · ' + o.count + '</option>').join('');
    const selected = filter.terms.map(value =>
      '<button class="filter-option" data-act="metadata-toggle" data-group="' + id + '" data-value="' + esc(value) + '" aria-pressed="true" title="移除' + f.label + '条件">' + esc(value) + ' ×</button>').join('');
    return '<div class="metadata-filter" data-group="' + id + '"><input id="' + inputId + '" type="search" list="' + listId +
      '" data-metadata-search="' + id + '" autocomplete="off" placeholder="检索' + f.label + '" aria-label="检索' + f.label +
      '" value="' + esc(draft[id] || '') + '">' +
      '<datalist id="' + listId + '">' + options + '</datalist>' +
      (selected ? '<div class="metadata-chips">' + selected + '</div>' : '') + '</div>';
  }).join('') + '</div>';
}

function renderAttrOptions(){
  const starId = Retrieval.STAR_GROUP;
  const star = optionEval(starId,Retrieval.termKey(Retrieval.ATTR,{star:true}));
  return '<label class="filter-check" data-group="' + starId + '"><input id="starFilter" type="checkbox"' + (star?.selected ? ' checked' : '') +
    '>仅星标 <span class="fcount" aria-hidden="true">' + (star ? star.count : 0) + '</span></label>';
}

function renderTagGroup(groupId,isUnfiled){
  const def = findGroupDef(groupId);
  if(!def || !(def.tags || []).length) return '';
  const result = groupEval(groupId);
  const tags = def.tags.slice();
  const expanded = state.expandedGroups.has(groupId);
  const visible = expanded ? tags : tags.slice(0,4);
  const color = groupColor(groupId);
  const options = visible.map(function(t){
    const option = result && result.options.find(o => o.key === t.id);
    const selection = tagSelection(t.id);
    const definition = t.definition ? ' · ' + t.definition : '';
    const id = esc(t.id);
    return '<span class="tag-controls"><button id="tag-toggle-' + id + '" class="filter-option tag-option" style="--tc:' + color + '" data-act="tag-toggle" data-group="' + esc(groupId) + '" data-id="' + id + '"' +
      ' aria-pressed="' + (selection === 'include') + '" data-selection="' + selection + '"' +
      ' title="' + esc(t.name + ' · ' + (option ? option.count : 0) + ' 篇' + definition) + '"><span class="tname">' + esc(t.name) + '</span><span class="fcount">' + (option ? option.count : 0) + '</span></button>' +
      '<button id="tag-exclude-' + id + '" class="tag-exclude-toggle" data-act="tag-exclude" data-id="' + id + '" aria-pressed="' + (selection === 'exclude') + '" aria-label="排除标签「' + esc(t.name) + '」" title="' + (selection === 'exclude' ? '取消排除' : '排除包含此标签的文献') + '">−</button></span>';
  }).join('');
  const more = tags.length > 4 ? '<button class="qg-more" data-act="group-expand" data-group="' + esc(groupId) + '">' + (expanded ? '收起' : '+' + (tags.length - 4)) + '</button>' : '';
  const foot = result && result.foot !== null ? result.foot : '';
  return '<section class="query-group' + (isUnfiled ? ' unfiled' : '') + (expanded ? ' expanded' : '') + '" style="--gc:' + color + '">' +
    '<div class="qg-head"><span class="qg-name" title="' + esc(def.name) + '">' + esc(def.name) + '</span>' +
    (isUnfiled ? '<span class="qg-mark">整理</span>' : '') + '<span class="qg-foot">' + foot + '</span></div>' +
    '<div class="qg-controls"><div class="qg-options">' + options + '</div>' + more + '</div></section>';
}

function renderGroups(){
  const el = $('#filterzone');
  const active = document.activeElement;
  const inputId = active && (active.dataset.metadataSearch || /^year(From|To|Single|IncludeUnknown)$/.test(active.id)) ? active.id : null;
  const caret = inputId && active.selectionStart !== null ? [active.selectionStart,active.selectionEnd] : null;
  const previous = $('#advancedFilters');
  if(previous) state.metadataOpen[previous.dataset.workspace] = previous.open;
  const metadata = '<details class="advanced-filters" id="advancedFilters" data-workspace="' + state.workspace + '"' + (state.metadataOpen[state.workspace] ? ' open' : '') + '><summary>元数据筛选</summary>' +
    '<div class="year-controls" data-group="@year" role="group" aria-label="年份筛选">' + renderYearOptions() + '</div>' + renderMetadataFilters() + '</details>';
  el.innerHTML = state.workspace === 'organize' ? metadata : renderSearchGroups(metadata);
  if(inputId){
    const input = document.getElementById(inputId);
    if(input){
      input.focus({preventScroll:true});
      if(caret) input.setSelectionRange(caret[0],caret[1]);
    }
  }
}

function renderSearchGroups(metadata){
  const regular = (state.groups || []).filter(g => (g.tags || []).length);
  const limit = 6;
  const visibleRegular = state.groupsExpanded ? regular : regular.slice(0,limit);
  const hiddenN = Math.max(0,regular.length-visibleRegular.length);
  const hasUnfiled = (state.unfiled || []).length > 0;
  const tagGroups = visibleRegular.map(g => renderTagGroup(g.id,false)).join('') + (hasUnfiled ? renderTagGroup(Retrieval.UNFILED,true) : '');
  const noGroups = !regular.length && !hasUnfiled;
  return '<div class="star-controls">' + renderAttrOptions() + '</div>' + metadata +
    '<div class="tag-search-bar"><h3>标签筛选</h3><div class="tag-join" role="group" aria-label="标签组合逻辑">' +
      '<button id="tagJoinAnd" data-act="tag-join" data-op="and" aria-pressed="' + (state.tagQuery.op === 'and') + '">AND</button><button id="tagJoinOr" data-act="tag-join" data-op="or" aria-pressed="' + (state.tagQuery.op === 'or') + '">OR</button></div>' +
      (state.tagQuery.exclude.length ? '<span class="tag-excluded">排除 ' + state.tagQuery.exclude.length + '</span>' : '') + '</div>' +
    (noGroups ? '<div class="group-empty"><span>暂无标签分组</span><button class="btn tiny" data-act="new-group">＋ 新建分组</button></div>' : '<div class="group-grid">' + tagGroups + '</div>') +
    (regular.length > limit ? '<div class="group-overflow"><button id="groupsExpand" data-act="groups-expand" aria-expanded="' + state.groupsExpanded + '">' + (hiddenN ? '更多组 ' + hiddenN : '收起分组') + '</button></div>' : '');
}

function queuePapers(queue){
  return PAPERS.filter(p => labelState(p) === queue);
}

function queueEvaluation(){
  if(!state.queueEval){
    const papers = queuePapers(state.queue);
    state.queueEval = Retrieval.evaluate(papers, {q:state.organizeQ, groups:metadataGroups(papers,activeFacets())});
  }
  return state.queueEval;
}

function defaultQueue(){
  if(!queuePapers('review').length && queuePapers('untagged').length) return 'untagged';
  return 'review';
}

function renderQueueHeader(){
  const evaluation = queueEvaluation();
  $('#queueCount').textContent = evaluation.count + ' / ' + evaluation.total + ' 篇';
  for(const tab of $$('.queue-tabs [role="tab"]')){
    const queue = tab.dataset.queue;
    const selected = state.queue === queue;
    tab.setAttribute('aria-selected',String(selected));
    tab.tabIndex = selected ? 0 : -1;
    tab.querySelector('span').textContent = queuePapers(queue).length;
  }
  $('#papers').setAttribute('aria-labelledby','queue-' + state.queue);
  if(state.queue !== 'review'){
    $('#queueActions').innerHTML = '';
    return;
  }
  const count = evaluation.total;
  $('#queueActions').innerHTML = state.batchProgress
    ? '<span class="batch-progress" id="batchProgress" role="status">' + batchProgressText(state.batchProgress) + '</span>'
    : '<button class="btn primary" data-act="fetch-all" title="补全整个待补全队列，不受搜索和筛选限制"' + (count ? '' : ' disabled') + '>补全全部 · ' + count + ' 篇</button>';
}

function renderRescueButton(fix){
  const label = fix.action === 'include-unknown' ? '勾选「包含未知年份」' : '去掉「' + termLabel(fix.kind,fix.term) + '」';
  const text = fix.action === 'remove-tag' ? '去掉标签「' + termLabel(fix.kind,fix.term || fix.key) + '」' : label;
  return '<button class="relax-row" data-act="apply-rescue" data-kind="' + fix.action + '" data-field="' + (fix.field || '') + '" data-group="' + esc(fix.group_id) + '" data-key="' + esc(fix.key) + '"><span>' + esc(text) + '</span><b>能救回 ' + fix.rescued + ' 篇</b></button>';
}

function renderSearchHeader(ps){
  $('#searchHeader').innerHTML = '<div class="countrow"><div class="results-title"><h1 id="resultsTitle" tabindex="-1">文献检索</h1><span class="count" aria-live="polite">' + ps.length + ' / ' + currentEvaluation().total + ' 篇</span></div>' +
    '<div class="countacts"><button class="btn filter-toggle" id="filterToggle" data-act="open-filters" aria-controls="sidebar" aria-expanded="' + state.filtersOpen + '">筛选</button><select class="sel" id="sort" aria-label="排序"><option value="year"' + (state.sort === 'year' ? ' selected' : '') + '>年份 新→旧</option>' +
    '<option value="added"' + (state.sort === 'added' ? ' selected' : '') + '>入库顺序</option></select>' +
    '<button class="btn ask-btn" data-act="to-ai" aria-controls="detail" aria-expanded="' + (state.detailOpen && state.tab === 'ai') + '"' + (ps.length ? '' : ' disabled') + '>问 AI</button></div></div>';
}

function metadataLink(key,value){
  const id = '@' + key;
  const filter = getGroupFilter(id);
  const term = Retrieval.termKey(Retrieval.META,value);
  const isYear = key === 'year';
  const on = isYear ? filter.terms.includes(Number(value)) : filter.terms.some(t => Retrieval.termKey(Retrieval.META,t) === term);
  return '<button class="meta-link" data-group="' + id + '" ' +
    (isYear ? 'data-act="year-toggle" data-year="' + esc(value) : 'data-act="metadata-toggle" data-value="' + esc(value)) +
    '" aria-pressed="' + on + '" title="' + esc(labelOf(key) + '：' + value) + '">' + esc(value) + '</button>';
}

function renderPaperMetadata(p){
  const year = metadataValues(p,'year')[0];
  const authors = metadataValues(p,'author');
  const venue = metadataValues(p,'venue')[0];
  const orgs = metadataValues(p,'org');
  const main = [year ? metadataLink('year',year) : '<span class="missing-meta">年份待补</span>'];
  if(authors.length){
    main.push('<span class="meta-author">' + metadataLink('author',authors[0]) +
      (authors.length > 1 ? '<span class="meta-extra">等 ' + authors.length + ' 人</span>' : '') + '</span>');
  }
  if(venue) main.push(metadataLink('venue',venue));
  const more = (authors.length > 1 ? '<div><b>其他作者</b>' + authors.slice(1).map(v => metadataLink('author',v)).join('') + '</div>' : '') +
    (orgs.length ? '<div><b>单位</b>' + orgs.map(v => metadataLink('org',v)).join('') + '</div>' : '');
  return '<div class="paper-meta">' + main.join('<span class="meta-dot" aria-hidden="true">·</span>') + '</div>' +
    (more ? '<details class="paper-meta-more"><summary>' + (orgs.length && authors.length > 1 ? '单位与其他作者' : orgs.length ? '查看单位' : '其他作者') + '</summary><div class="meta-more-body">' + more + '</div></details>' : '');
}

function renderList(ps){
  const el = $('#papers');
  const organizing = state.workspace === 'organize';
  const scroll = el.scrollTop;
  const expanded = new Set($$('.paper-meta-more[open]',el).map(x => x.closest('.paper').dataset.id));
  if(!ps.length){
    if(!apiOnline) el.innerHTML = '<div class="empty"><div class="em">○</div><p>连不上本地服务</p><div style="font-size:11px;color:var(--muted-2);line-height:1.7;margin-bottom:12px">确认 run.py 还在运行，然后点下面重试。</div><button class="btn" data-act="reconnect">重试连接</button></div>';
    else if(organizing){
      if(queueEvaluation().total){
        el.innerHTML = '<div class="empty"><p>没有符合这些条件的文献</p><button class="btn tiny" data-act="reset-all">清除搜索与筛选</button></div>';
      }else{
        const otherQueue = state.queue === 'review' ? 'untagged' : 'review';
        const next = queuePapers(otherQueue).length
          ? '<button class="btn" data-act="switch-queue" data-queue="' + otherQueue + '">查看' + LABEL_STATE_LABELS[otherQueue] + '</button>'
          : '';
        el.innerHTML = '<div class="empty"><p>没有' + LABEL_STATE_LABELS[state.queue] + '的文献</p>' + next + '</div>';
      }
    }
    else if(!currentEvaluation().total){
      el.innerHTML = PAPERS.length
        ? '<div class="empty"><p>还没有已打标的文献</p></div>'
        : '<div class="empty"><p>书库还是空的</p><button class="btn primary" data-act="import">导入文献</button></div>';
    }
    else {
      const papers = searchPapers();
      const fixes = Retrieval.rescue(papers,retrievalFilter(papers),5);
      const suggestions = fixes.map(renderRescueButton).join('');
      el.innerHTML = '<div class="empty"><div class="em">○</div><p>没有符合这些条件的文献</p>' + suggestions + '<button class="btn tiny" data-act="reset-all">清除搜索与筛选</button></div>';
    }
    el.scrollTop = 0;
    return;
  }
  const topics = new Map();
  state.groups.forEach(g => (g.tags || []).forEach(t => topics.set(t.id,{group:g.id,color:g.color || 'var(--c-topic)'})));
  state.unfiled.forEach(t => topics.set(t.id,{group:Retrieval.UNFILED,color:'var(--warn)'}));
  el.innerHTML = ps.map(function(p){
    const tags = (p.tags.topic || []).map(function(name,i){
      const id = (p.topicIds || [])[i];
      const hit = topics.get(id);
      if(organizing || !hit) return '<span class="tag" style="--c:' + esc(hit?.color || 'var(--c-topic)') + '">' + esc(name) + '</span>';
      return '<button class="tag" style="--c:' + esc(hit.color) + '" data-act="tag-toggle" data-group="' + esc(hit.group) + '" data-id="' + esc(id) +
        '" aria-pressed="' + Boolean(tagSelection(id)) + '" data-selection="' + tagSelection(id) + '">' + esc(name) + '</button>';
    }).join('');
    const current = state.detailOpen && state.tab === 'info' && p.id === state.paperId;
    const id = esc(p.id);
    const review = organizing && state.queue === 'review';
    const readerAction = organizing && !review ? 'tag-paper' : 'open-pdf';
    const readerLabel = p.hasFile ? '打开 PDF' : '补 PDF';
    const reviewActions = review ? '<div class="paper-tools queue-paper-tools">' +
      '<button class="btn" data-act="fetch-meta" data-id="' + id + '"' + (state.metaBusy ? ' disabled' : '') + '>' +
      (state.metaBusy === p.id ? '抓取中…' : '抓取元数据') + '</button>' +
      '<button class="btn" data-act="edit-meta" data-id="' + id + '" aria-haspopup="dialog">手动补全</button></div>' : '';
    return '<article class="paper' + (current ? ' on' : '') + (p.hasFile ? '' : ' no-pdf') + '" data-id="' + id + '">' +
       '<div class="paper-content">' +
         (p.hasFile ? '' : '<span class="no-pdf-label" title="无 PDF 附件">' + importIcon('metadata') + '仅元数据</span>') +
         '<h2 class="ptitle"><button data-act="select" data-id="' + id + '" aria-controls="detail" aria-expanded="' + current + '">' + esc(p.title) + '</button></h2>' +
         renderPaperMetadata(p) +
        (tags ? '<div class="ptags" aria-label="内容标签">' + tags + '</div>' : '') +
       '</div>' +
       '<div class="paper-actions">' +
          '<div class="paper-tools paper-primary-tools">' +
             '<button class="btn primary pdf-btn" data-act="' + readerAction + '" data-id="' + id + '">' + readerLabel + '</button>' +
            '<button class="btn" data-act="copy-cite" data-id="' + id + '">复制引用</button>' +
            '<button class="btn delete-paper-action delete-paper-trigger" data-act="delete-paper" data-id="' + id + '" aria-haspopup="dialog">删除文献</button>' +
          '</div>' +
           reviewActions +
       '</div></article>';
  }).join('');
  $$('.paper-meta-more',el).forEach(x => { x.open = expanded.has(x.closest('.paper').dataset.id); });
  el.scrollTop = scroll;
}

/* ============================================================
   渲染：详情
   ============================================================ */
function renderDetail(){
  const el = $('#detail');
  el.hidden = !state.detailOpen;
  $('#app').classList.toggle('show-detail',state.detailOpen);
  syncWorkspaceFocus();
  el.setAttribute('aria-label',state.tab === 'ai' ? 'AI 阅读' : '文献详情');
  if(el.hidden){
    el.innerHTML = '';
    return;
  }
  const p = PAPERS.find(x => x.id === state.paperId);
  const prevScroll = $('#dhead') ? $('#dhead').scrollTop : 0;

function chooseTagDestination(tagId){
  const hit = findTagById(tagId);
  if(!hit) return;
  const sourceId = hit.group?.id ?? Retrieval.UNFILED;

    libraryScroll:$('#settings-tags').parentElement.scrollTop};
  state.modalMode = 'group-dialog';
  renderModal();
}

function confirmTagMove(tagId, sourceId, targetId){
  if(sourceId === targetId) return;
  const hit = findTagById(tagId);
  const target = findGroupDef(targetId);
  if(!hit || !target || (hit.group?.id ?? Retrieval.UNFILED) !== sourceId){
    toast('标签或分组已变化，请重新选择');
    return;
  }
  const libraryScroll = state.dialog?.libraryScroll ?? $('#settings-tags').parentElement.scrollTop;
  state.dialog = {kind:'move-tag', tagId, name:hit.tag.name, sourceId, targetId,
    sourceName:hit.group?.name ?? '未分组', targetName:target.name, libraryScroll};
  state.modalMode = 'group-dialog';
  renderModal();
}

let libraryDrag = null;
let libraryDropTarget = null;

function clearLibraryDrag(){
  if(!libraryDrag) return;
  libraryDrag.pill.classList.remove('lib-dragging');
  for(const group of $$('#modal .lib-drop-ready')) group.classList.remove('lib-drop-ready', 'lib-drop-active');
  libraryDrag = null;
  libraryDropTarget = null;
}

const libraryModal = $('#modal');
libraryModal.addEventListener('dragstart', function(e){
  const handle = e.target.closest('[data-tag-drag]');
  if(state.modalMode !== 'tags' || !handle || !e.dataTransfer) return;
  clearLibraryDrag();
  const pill = handle.closest('.tag');
  const sourceId = pill.closest('[data-tag-drop]').dataset.tagDrop;
  const targets = $$('[data-tag-drop]', libraryModal).filter(group => group.dataset.tagDrop !== sourceId);
  if(!targets.length){ e.preventDefault(); return; }
  e.dataTransfer.setData('application/x-colophon-tag', handle.dataset.id);
  e.dataTransfer.effectAllowed = 'move';
  const rect = pill.getBoundingClientRect();
  e.dataTransfer.setDragImage(pill, e.clientX - rect.left, e.clientY - rect.top);
  libraryDrag = {tagId:handle.dataset.id, sourceId, pill};
  pill.classList.add('lib-dragging');
  for(const group of targets) group.classList.add('lib-drop-ready');
});

libraryModal.addEventListener('dragover', function(e){
  if(!libraryDrag) return;
  const target = e.target.closest('[data-tag-drop].lib-drop-ready');
  if(target !== libraryDropTarget){
    libraryDropTarget?.classList.remove('lib-drop-active');
    target?.classList.add('lib-drop-active');
    libraryDropTarget = target;
  }
  if(target){
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
  }
});

libraryModal.addEventListener('dragleave', function(e){
  if(libraryDropTarget && !libraryDropTarget.contains(e.relatedTarget)){
    libraryDropTarget.classList.remove('lib-drop-active');
    libraryDropTarget = null;
  }
});

libraryModal.addEventListener('drop', function(e){
  if(!libraryDrag) return;
  const target = e.target.closest('[data-tag-drop].lib-drop-ready');
  const {tagId, sourceId} = libraryDrag;
  clearLibraryDrag();
  if(!target) return;
  e.preventDefault();
  confirmTagMove(tagId, sourceId, target.dataset.tagDrop);
});

libraryModal.addEventListener('dragend', clearLibraryDrag);

function isTagMoveDialog(){
  return state.modalMode === 'group-dialog' &&
    (state.dialog?.kind === 'move-tag' || state.dialog?.kind === 'pick-tag-group');
}

/* ---------- 组 ---------- */
function findTag(name){
  const groups = state.groups || [];
  for(const g of groups){
    for(const t of g.tags) if(t.name === name) return { group:g, tag:t };
  }
  for(const t of (state.unfiled || [])) if(t.name === name) return { group:null, tag:t };
  return null;
}

function topicColor(name){
  const hit = findTag(name);
  if(hit) return (hit.group && hit.group.color) || hit.tag.color || 'var(--c-topic)';
  return 'var(--c-topic)';
}

/* 打标只有一个面板：阅读器右侧栏。组状态也只有一份。 */
function isNewGroupMode(){
  return !!state.readerGroupNew;
}

function setNewGroupMode(on){

      '<button class="btn primary" data-act="create-group">建组</button>' +
      '<button class="linkbtn" data-act="cancel-new-group">取消</button>' +
    '</div>';
  }
