  const opts = ['<option value="">未分组</option>'].concat(
    groups.map(g => '<option value="' + g.id + '"' + (g.id === pick ? ' selected' : '') + '>'
      + esc(g.name) + '</option>')
  ).concat(['<option value="__new">＋ 新建组…</option>']).join('');
  return '<select id="rtGroup" aria-label="标签所属的组">' + opts + '</select>';
}

/**
 * 读出阅读器侧栏当前要归入的组。
 *
 * 返回 `{id}` / `{id:null}`（未分组） / `{id:null, name, isNew:true}`（新建组）。
 * 新建组模式下**组名没填就返回 undefined**，让调用方提示并停下，
 * 而不是静默把标签丢进未分组——这正是标签建不出组的根源。
 * `null` = 控件不在（面板正在切换），调用方不猜。
 */
function groupFrom(){
  if(isNewGroupMode()){
    const input = $('#rtNewName');
    if(!input) return null;
    const name = input.value.trim();
    return name ? { id:null, name:name, isNew:true } : undefined;
  }
  const sel = $('#rtGroup');
  if(!sel) return null;
  const value = sel.value;
  if(!value) return { id:null };
  if(value === '__new') return null;
  return { id:value };
}

/* ---------- 打标加速：上次用过的组 + 本组快捷标签 ---------- */
function loadGroupPref(){
  try{
    const saved = localStorage.getItem('colophon.group');
    if(saved && (state.groups || []).some(g => g.id === saved)) return saved;
  }catch(err){ /* localStorage 不可用时退化为不记忆 */ }
  return null;
}

function rememberGroup(id){
  if(!id) return;
  try{ localStorage.setItem('colophon.group', id); }catch(err){}
}

function currentGroup(){
  if(!state.groupSel) return null;
  return (state.groups || []).find(g => g.id === state.groupSel) || null;
}

function quickTagsHTML(p){
  const g = currentGroup();
  const emptyCls = 'rs-quick rs-empty';
  if(!g){
    if(!(state.groups || []).length){
      return '<p class="' + emptyCls + '">还没有组。先建一个组，之后同类标签就能一键加。</p>';
    }
    return '<p class="' + emptyCls + '">现在归入的是「未分组」。选一个组，里面的标签就会排在这里供一键复用。</p>';
  }
  if(!g.tags.length){
    return '<p class="' + emptyCls + '">「' + esc(g.name) + '」还是空的。第一次打标签后，它会出现在这里供下次一键复用。</p>';
  }
  const onPaper = new Set(p.tags.topic);
  const picks = g.tags
    .slice()
    .sort((a,b) => b.count - a.count || a.name.localeCompare(b.name, 'zh'))
    .slice(0, 12);
  return '<div class="rs-quick">' + picks.map(function(t){
    const has = onPaper.has(t.name);
    return '<button class="qtag sm' + (has ? ' has' : '') + '"' +
      ' data-act="rt-quick" data-name="' + esc(t.name) + '"' +
      ' style="--c:' + (g.color || 'var(--c-topic)') + '"' +
      (has ? ' disabled' : '') +
      ' title="' + esc(t.name) + ' · 已有 ' + t.count + ' 篇">' +
      esc(t.name) + '<b>' + t.count + '</b>' +
    '</button>';
  }).join('') + '</div>';
}

/* 阅读器输入框的补全：按当前组优先排列 */
function paintQuickOptions(listId){
  const list = $('#' + listId);
  if(!list) return;
  const g = currentGroup();
  const inGroup = g ? g.tags.map(t => t.name) : [];
  const rest = (state.groups || [])
    .filter(x => !g || x.id !== g.id)
    .flatMap(x => x.tags.map(t => t.name))
    .concat((state.unfiled || []).map(t => t.name))
    .filter(n => inGroup.indexOf(n) === -1);
  const all = inGroup.concat(rest);
  list.innerHTML = all.map(n => '<option value="' + esc(n) + '"></option>').join('');
}

function readerRemoveTag(name){

  if(!p || !name) return;
  p.topicIds = (p.topicIds || []).filter((id,i) => p.tags.topic[i] !== name);
  p.tags.topic = p.tags.topic.filter(function(t){ return t !== name; });

function msgHTML(m){
  if(m.role === 'user'){
    return '<div class="msg user"><div class="bubble">' + esc(m.text) + '</div></div>';
  }
  if(m.pending){
    return '<div class="msg ai"><div class="typing"><i></i><i></i><i></i></div></div>';
  }
  const cites = m.cites || [];
  const citesHTML = cites.length
    ? '<div class="cites">' + cites.map(function(c, i){
        const itemId = c.itemId || c;
        const found = PAPERS.find(x => x.id === itemId);
        const title = c.title || (found ? found.title : itemId);
        const page = c.page || 0;
        return '<button data-act="cite" data-id="' + esc(itemId) + '" data-page="' + page + '"' +
          ' title="' + (page > 0 ? '打开第 ' + page + ' 页' : '打开这条文献') + '">' +
          '<b>' + (i + 1) + '</b><span class="ct">' + esc(title) + '</span>' +
          (page > 0 ? '<span class="cp">p.' + page + '</span>' : '') +
        '</button>';
      }).join('') + '</div>'
    : '';
  if(m.error){
    return '<div class="msg ai">' +
      '<div class="aimeta">AI · 出错</div>' +
      '<div class="aitext aierr">' + esc(m.text) + '</div>' +
    '</div>';
  }
  return '<div class="msg ai">' +
    '<div class="aimeta">AI · 范围 ' + (m.n || 0) + ' 篇' +
      (cites.length ? ' · ' + cites.length + ' 条引用' : '') +
      (m.model ? ' · ' + esc(m.model) : '') + '</div>' +
    '<div class="aitext">' + fmtAI(m.text, cites) + '</div>' +
    citesHTML +
  '</div>';
}

function fmtAI(text, cites){
  let h = esc(text || '');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\[(\d+)\]/g, function(match, i){
    const citation = cites[parseInt(i, 10) - 1];
    if(!citation) return match;
    const itemId = citation.itemId || citation;
    const page = citation.page || 0;
    return '<button class="cite" data-act="cite" data-id="' + esc(itemId) + '" data-page="' + page + '">[' + i + ']</button>';
  });
  h = h.replace(/\n/g, '<br>');
  return h;
}

async function loadSuggestions(itemId){
  if(!apiOnline){ toast('未连接本地服务，无法生成建议'); return; }
  if(!state.ai.hasKey){ toast('先配置模型 Key'); openSettings(); return; }
  const p = PAPERS.find(x => x.id === itemId);
  if(!p) return;

  state.sugg[itemId] = { status:'loading', items:[] };
  renderDetail();
  if(state.readerOpen) renderReaderSide();

  try{
    const res = await fetch('/api/items/' + encodeURIComponent(itemId) + '/suggest-tags', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ limit: 4 })
    });
    const data = await res.json().catch(function(){ return {}; });
    if(!res.ok){
      throw new Error(typeof data.detail === 'string' ? data.detail : ('生成失败（' + res.status + '）'));
    }
    // 重新生成时，把之前忽略的也放回来
    Array.from(state.dismissed).forEach(function(key){
      if(key.indexOf(itemId + '|') === 0) state.dismissed.delete(key);
    });
    state.sugg[itemId] = {
      status: 'ready',
      items: Array.isArray(data.tags) ? data.tags : [],
      model: data.model || ''
    };
  }catch(err){
    state.sugg[itemId] = {
      status: 'error',
      items: [],
      message: String((err && err.message) || err)
    };
  }finally{
    renderDetail();
    if(state.readerOpen) renderReaderSide();
  }
}

/* AI 回答由后端 /api/ai/ask 生成 */

async function send(text){
  if(state.busy) return;
  const scope = aiScope();
  if(!scope.length) return;
  if(!state.ai.hasKey){ toast('先配置模型 Key'); openSettings(); return; }

  state.chat.push({role:'user', text:text});
  state.chat.push({role:'ai', pending:true});
  state.busy = true;
  state.pendingScroll = 'bottom';
  renderDetail();

  try{
    const res = await fetch('/api/ai/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: text,
        itemIds: scope.map(p => p.id),
        conversationId: state.conversationId
      })
    });
    const data = await res.json().catch(function(){ return {}; });
    if(!res.ok){
      const detail = typeof data.detail === 'string' ? data.detail : ('请求失败（' + res.status + '）');
      throw new Error(detail);
    }
    state.conversationId = data.conversationId || null;
    rememberConversation();
    let answer = String(data.answer || '');
    let citations = Array.isArray(data.citations) ? data.citations : [];
    const used = [];
    answer = answer.replace(/\[(\d+)\]/g, function(match, digit){
      const index = parseInt(digit, 10) - 1;
      if(index < 0 || index >= citations.length) return match;
      let position = used.indexOf(index);
      if(position === -1){
        used.push(index);
        position = used.length - 1;
      }
      return '[' + (position + 1) + ']';
    });
    if(used.length){
      citations = used.map(function(index){ return citations[index]; });
    }
    state.chat.pop();
    state.chat.push({
      role: 'ai',
      text: answer,
      cites: citations,
      n: data.scopeCount || scope.length,
      model: data.model || ''
    });
  }catch(err){
    state.chat.pop();
    state.chat.push({
      role: 'ai',
      error: true,
      text: String((err && err.message) || err)
    });
  }finally{
    state.busy = false;
    state.pendingScroll = 'bottom';
    renderDetail();
    const input = $('#chatInput');
    if(input) input.focus();
  }
}

function citeJump(itemId, page){
  selectPaper(itemId);
  openReader();
  let tries = 0;
  (function step(){
    tries++;
    if(!state.readerOpen) return;
    if(pdfView.itemId === itemId && pdfView.pages.length){
      goToPage(page, false);
      return;
    }
    if(tries < 120) setTimeout(step, 100);
  })();
}

async function saveAISettings(button){
  const val = id => {
    const el = document.getElementById(id);
    return el ? el.value.trim() : '';
  };
  const payload = { baseUrl: val('setBaseUrl'), model: val('setModel') };
  const key = val('setKey');
  if(key) payload.apiKey = key;
  button.disabled = true;
  try{
    const res = await fetch('/api/settings/ai', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(!res.ok) throw new Error('http ' + res.status);
    state.ai = await res.json();
    if(state.ai.hasKey){
      Object.keys(state.sugg).forEach(function(key){
        if(state.sugg[key] && state.sugg[key].status === 'error') delete state.sugg[key];
      });
    }
    renderAll();
    if(button.isConnected){
      if(state.modalMode === 'model') closeSettings();
      else renderModelSettings();
    }
    toast(state.ai.hasKey ? '模型配置已保存' : '已保存，但还没有填 Key');
  }catch(err){
    toast('保存失败，请重试');
  }finally{
    button.disabled = false;
  }
}

    const res = await fetch('/api/settings/ai', { cache: 'no-store' });
    if(res.ok) state.ai = await res.json();
  }catch(err){
    /* 离线时保留默认值，界面会提示配置 */
  }
}

function rememberConversation(){
  try{
    localStorage.setItem('colophon:conv', JSON.stringify({
      id: state.conversationId,
      ids: state.scopeIds || ''
    }));
  }catch(err){ /* 隐私模式 */ }
}

function forgetConversation(){
  try{ localStorage.removeItem('colophon:conv'); }catch(err){ /* 隐私模式 */ }
}

async function restoreConversation(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('colophon:conv') || 'null'); }catch(err){ saved = null; }
  if(!saved || !saved.id) return;
  const current = (state.aiExpand ? PAPERS : getFiltered()).map(p => p.id).sort().join(',');
  if(saved.ids !== current) return;
  try{
    const res = await fetch('/api/conversations/' + encodeURIComponent(saved.id));
    if(!res.ok) return;
    const data = await res.json();
    const messages = (data.messages || []).filter(m => m.role !== 'system');
    if(!messages.length) return;
    state.conversationId = saved.id;
    state.chat = messages.map(function(m){
      if(m.role === 'assistant'){
        return {
          role: 'ai',
          text: m.content,
          cites: m.citations || [],
          n: (data.scope && data.scope.count) || 0,
          model: m.model || ''
        };
      }
      return { role: 'user', text: m.content };
    });
  }catch(err){
    /* 恢复失败就当没有历史 */
  }
}

async function saveMetaFields(){
  const p = PAPERS.find(x => x.id === state.metaItemId);
  if(!p) return;
  if(!apiOnline){ toast('未连接本地服务，改动不会保存'); return; }

  const val = id => {
    const el = document.getElementById(id);
    return el ? el.value.trim() : '';
  };
  const payload = {
    title: val('mfTitle'),
    abstract: val('mfAbstract'),
    venue: val('mfVenue'),
    doi: val('mfDoi'),
    arxiv_id: val('mfArxiv'),
    authors: val('mfAuthors').split(/[;,、]/).map(s => s.trim()).filter(Boolean),
    orgs: val('mfOrgs').split(/[;,、]/).map(s => s.trim()).filter(Boolean)
  };
  const year = val('mfYear');
  if(year) payload.year = Number(year);
  Object.keys(payload).forEach(function(key){
    if(payload[key] === '' && key !== 'abstract') delete payload[key];
  });
  if(!payload.authors || !payload.authors.length) delete payload.authors;

  try{
    const res = await fetch('/api/items/' + encodeURIComponent(p.id) + '/fields', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });
    if(res.status === 409){
      const err = await res.json().catch(function(){ return {}; });
      toast(esc(err.detail || 'DOI 已经在另一条上'));
      return;
    }
    if(!res.ok) throw new Error('http ' + res.status);
    state.modalOpen = false;
    renderModal();
    toast('元数据已保存');
    await refreshPapers();
  }catch(err){
    toast('保存失败，请重试');
  }
}

async function fetchMeta(itemId){
  if(state.metaBusy) return;
  if(!apiOnline){ toast('未连接本地服务，无法抓取元数据'); return; }
  state.metaBusy = itemId;
  renderAll();
  if(state.readerOpen) renderReaderSide();
  try{
    const res = await fetch('/api/items/' + encodeURIComponent(itemId) + '/metadata', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    });
    if(!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    const report = data.report || {};
    if(!data.ok){
      toast(esc(report.message || '没有抓到元数据'));
    }else{
      toast((report.source ? '<b>' + esc(report.source) + '</b> · ' : '') + esc(report.message || '已补全'));
    }
    await refreshPapers();
  }catch(err){
    toast('抓取失败：检查网络或模型设置后再试');
  }finally{
    state.metaBusy = null;
    renderAll();
    if(state.readerOpen) renderReaderSide();
  }
}

function batchProgressText(batch){
  return '补全中 ' + batch.done + '/' + batch.total;
}

async function fetchAllMissing(){
  if(state.batchProgress) return;
  if(!apiOnline){ toast('未连接本地服务，无法抓取元数据'); return; }
  const papers = queuePapers('review');
  if(!papers.length) return;
  const batch = {done:0, total:papers.length};
  state.batchProgress = batch;
  renderQueueHeader();
  let completed = 0;
  let attempted = 0;
  let summary;
  try{
    for(const {id} of papers){
      const res = await fetch('/api/import/queue/fetch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({itemId:id, limit:1})
      });
      if(!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      completed += data.completed ?? data.results.filter(result => result.complete).length;
      attempted += data.total;
      batch.done++;
      const progress = $('#batchProgress');
      if(progress) progress.textContent = batchProgressText(batch);
    }
    summary = '已补全 <b>' + completed + '</b> / ' + attempted + ' 篇' +
      (batch.total > attempted ? '，跳过 ' + (batch.total - attempted) + ' 篇' : '') +
      (attempted > completed ? '，其余仍待补全' : '');
  }catch(err){
    summary = '批量抓取中断，已处理 ' + batch.done + '/' + batch.total + ' 篇，请稍后再试';
  }finally{
    await refreshPapers();
    state.batchProgress = null;
    if(state.workspace === 'organize') renderQueueHeader();
  }
  toast(summary);
}

function renderModal(){
  const modal = $('#modal');
  clearLibraryDrag();
  if(!state.modalOpen){ modal.classList.remove('open'); modal.innerHTML = ''; return; }
  if(state.modalMode === 'delete-paper'){ renderDeletePaperDialog(); return; }
  if(state.modalMode === 'import'){ renderImportModal(); return; }
  if(state.modalMode === 'share'){ renderShareModal(); return; }
  if(state.modalMode === 'meta'){ renderMetaModal(); return; }
  if(isSettingsMode()){ renderSettingsModal(); return; }

    renderGroupDialog();
    if(isTagMoveDialog()) ($('[data-act="dialog-cancel"]:not(:disabled)') || $('[role="alertdialog"]', modal)).focus();
    return;
  }
  if(state.modalMode === 'tag-def'){ renderTagDefDialog(); return; }
  if(state.modalMode === 'clean'){ renderCleanModal(); return; }
}

function cleanOperation(item){
  if(item.action === 'drop') return {id:item.id, action:'drop'};
  if(item.suggest?.trim() && item.suggest !== item.name){
    return {id:item.id, action:'rename', value:item.suggest};
  }
  return null;
}

function cleanBatch(data){
  // 「待确认」的建议只能逐条应用，不纳入批量操作。
  const ops = list => list.filter(it => it.action !== 'review').map(cleanOperation).filter(Boolean);
  return {authors:ops(data.authors), orgs:ops(data.orgs)};
}

function cleanPdfSources(){
  const sources = {authors:new Map(), orgs:new Map()};
  for(const paper of PAPERS){
    if(!paper.hasFile) continue;
    for(const [kind, field] of [['authors', 'author'], ['orgs', 'org']]){
      for(const name of new Set(metadataValues(paper, field))){
        const byName = sources[kind];
        if(!byName.has(name)) byName.set(name, []);
        byName.get(name).push(paper);
      }
    }
  }
  return sources;
}

function renderCleanModal(){
  const modal = $('#modal');
  const s = state.clean || { loading: true };
  const scrollTop = $('.clean-list', modal)?.scrollTop || 0;
  modal.classList.add('open');

  if(s.loading){
    modal.innerHTML = '<div class="modal-card clean-card"><div class="mhead"><div>' +
      '<h3>检查作者 / 单位</h3><p>正在扫一遍词表…</p></div>' +
      '<button class="btn icon" data-act="close-clean" aria-label="关闭">✕</button></div></div>';
    return;
  }
  if(s.error){
    modal.innerHTML = '<div class="modal-card clean-card"><div class="mhead"><div>' +
      '<h3>检查作者 / 单位</h3><p style="color:var(--warn)">' + esc(s.error) + '</p></div>' +
      '<button class="btn icon" data-act="close-clean" title="关闭">✕</button></div>' +
      '<div class="metafoot"><button class="btn" data-act="open-clean">重试</button></div></div>';
    return;
  }

  const batch = cleanBatch(s.data);
  const batchCount = batch.authors.length + batch.orgs.length;
  s.pdfSources = cleanPdfSources();
  const disabled = s.busy ? ' disabled' : '';
  const row = function(kind, it){
    const op = cleanOperation(it);
    const hasPdf = s.pdfSources[kind].has(it.name);
    const original = esc(it.name || '（空）');
    let suggestion = '<span class="cempty">无明确建议</span>';
    if(op?.action === 'drop'){
      suggestion = '<span class="cdelete"><s>' + original + '</s>（删除）</span>';
    }else if(op){
      suggestion = '<span class="cnew">' + esc(op.value) + '</span>';
    }
    return '<div class="crow" data-kind="' + kind + '" data-id="' + esc(it.id) + '">' +
      '<div class="cname">' +
        '<div class="cvalue"><span class="clabel">修改前</span><span>' + original + '</span></div>' +
        '<div class="cvalue"><span class="clabel">建议修改</span>' + suggestion + '</div>' +
        '<div class="cwhy">' + (it.action === 'review' ? '待确认 · ' : '') +
          esc(it.reason || '') + ' · ' + it.count + ' 篇</div>' +
      '</div>' +
      '<div class="cact">' +
        '<button class="btn tiny" data-act="clean-apply-one" aria-label="应用：' + original + '"' +
          (op ? disabled : ' disabled') + '>应用</button>' +
        '<button class="btn tiny" data-act="clean-ignore" aria-label="忽略：' + original + '"' + disabled + '>忽略</button>' +
        '<button class="btn tiny" data-act="clean-open-pdf" aria-label="打开 PDF：' + original + '"' +
          (hasPdf ? disabled : ' disabled title="没有关联的 PDF"') + '>打开 PDF</button>' +
      '</div>' +
    '</div>';
  };

  const sect = function(title, kind){
    const list = s.data[kind];
    return '<section class="csec">' +
      '<div class="slabel">' + title + ' <span class="hint">' + list.length + ' 条待处理</span></div>' +
      (list.length
        ? list.map(it => row(kind, it)).join('')
        : '<p class="hintline">没有待处理记录。</p>') +
    '</section>';
  };

  modal.innerHTML = '<div class="modal-card clean-card" role="dialog" aria-modal="true" aria-labelledby="cleanTitle">' +
    '<div class="mhead">' +
      '<div><h3 id="cleanTitle">检查作者 / 单位</h3><p>本次扫描：' +
        s.data.totals.authors + ' 位作者、' + s.data.totals.orgs + ' 个单位</p></div>' +
      '<button class="btn icon" data-act="close-clean" aria-label="关闭"' + disabled + '>✕</button>' +
    '</div>' +
    '<div class="clean-list">' + sect('作者', 'authors') + sect('单位', 'orgs') + '</div>' +
    '<div class="metafoot">' +
      '<span class="mnote-inline">待确认项不参与批量应用</span>' +
      '<button class="btn primary" data-act="clean-apply-all"' + (batchCount ? disabled : ' disabled') + '>' +
        (s.busy ? '应用中…' : '全部应用' + (batchCount ? '（' + batchCount + '）' : '')) + '</button>' +
    '</div>' +
  '</div>';
  $('.clean-list', modal).scrollTop = scrollTop;
}

async function openClean(){
  state.modalMode = 'clean';
  state.modalOpen = true;
  const scan = state.clean = {loading:true};
  renderModal();
  try{
    const res = await fetch('/api/clean/scan', {cache:'no-store'});
    if(!res.ok) throw new Error('http ' + res.status);
    scan.data = await res.json();
  }catch(err){
    scan.error = '读取失败，请重试';

  scan.loading = false;
  if(state.clean === scan && state.modalMode === 'clean'){
    renderModal();

}

function closeClean(){
  if(state.clean?.busy) return;
  state.modalMode = 'tags';
  state.clean = null;
  renderModal();
  $('[data-act="open-clean"]')?.focus({preventScroll:true});
}

function openCleanPdf(opener){
  const s = state.clean;
  if(!s?.data || s.busy) return;
  const {kind, id} = opener.closest('.crow').dataset;
  const item = s.data[kind].find(it => it.id === id);
  const papers = s.pdfSources[kind].get(item?.name) || [];
  if(!papers.length) return;

  const preview = function(paper){
    if(state.clean === s) showCleanPdfPreview(paper, opener);
  };
  if(papers.length === 1){ preview(papers[0]); return; }

  const dialog = document.createElement('dialog');
  dialog.className = 'modal-card clean-dialog clean-pdf-picker';
  dialog.setAttribute('aria-labelledby', 'cleanPdfTitle');
  dialog.innerHTML = '<form method="dialog">' +
    '<div class="mhead"><h3 id="cleanPdfTitle">选择 PDF 核对</h3></div>' +
    '<div class="pickgrouplist">' + papers.map(paper =>
      '<button class="pickgroup" value="' + esc(paper.id) + '">' + esc(paper.title || paper.fileName || '未命名') + '</button>'
    ).join('') + '</div>' +
    '<div class="metafoot"><button class="btn" value="" autofocus>取消</button></div></form>';
  $('#modal').append(dialog);
  dialog.addEventListener('close', function(){
    dialog.remove();
    const paper = papers.find(p => p.id === dialog.returnValue);
    if(paper) preview(paper);
  }, {once:true});
  dialog.showModal();
}

function showCleanPdfPreview(paper, opener){
  if($('#cleanPdfPreview')) return;
  const dialog = document.createElement('dialog');
  dialog.id = 'cleanPdfPreview';
  dialog.className = 'modal-card clean-dialog clean-pdf-preview';
  dialog.setAttribute('aria-labelledby', 'cleanPdfPreviewTitle');
  dialog.innerHTML = '<div class="mhead"><h3 id="cleanPdfPreviewTitle">' +
    esc(paper.title || paper.fileName || 'PDF 预览') + '</h3>' +
    '<form method="dialog"><button class="btn" autofocus>关闭</button></form></div>' +
    '<div class="clean-pdf-pages" tabindex="0" role="region" aria-label="PDF 页面">' +
      '<p class="clean-pdf-status" role="status">正在载入 PDF…</p></div>';
  document.body.append(dialog);
  const pages = $('.clean-pdf-pages', dialog);
  const status = $('.clean-pdf-status', pages);
  const visible = new Map();
  let observer, loading;

  function releasePage(slot){
    const job = visible.get(slot);
    if(!job) return;
    visible.delete(slot);
    job.task?.cancel();
    slot.replaceChildren();
  }

  dialog.addEventListener('close', function(){
    observer?.disconnect();
    for(const slot of visible.keys()) releasePage(slot);
    if(loading) loading.destroy().catch(() => {});
    dialog.remove();
    const target = opener.isConnected ? opener : $('[data-act="close-clean"]');
    target?.focus({preventScroll:true});
  }, {once:true});

  async function renderPreviewPage(doc, slot){
    const job = {};
    visible.set(slot, job);
    try{
      const page = await doc.getPage(Number(slot.dataset.page));
      if(!dialog.open || visible.get(slot) !== job) return;
      const base = page.getViewport({scale:1});
      const scale = Math.min(slot.clientWidth / base.width * Math.min(devicePixelRatio || 1, 2),
        4096 / Math.max(base.width, base.height));
      const viewport = page.getViewport({scale});
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(viewport.width);
      canvas.height = Math.ceil(viewport.height);
      canvas.setAttribute('aria-label', '第 ' + slot.dataset.page + ' 页');
      slot.style.aspectRatio = base.width + ' / ' + base.height;
      job.task = page.render({canvasContext:canvas.getContext('2d'), viewport});
      await job.task.promise;
      if(dialog.open && visible.get(slot) === job) slot.replaceChildren(canvas);
    }catch(err){
      if(dialog.open && visible.get(slot) === job) slot.textContent = '无法显示第 ' + slot.dataset.page + ' 页';
    }
  }

  async function loadPreview(){
    try{
      loading = window.pdfjsLib.getDocument({url:'/api/items/' + encodeURIComponent(paper.id) + '/file'});
      const doc = await loading.promise;
      const first = (await doc.getPage(1)).getViewport({scale:1});
      if(!dialog.open) return;
      const fragment = document.createDocumentFragment();
      for(let n = 1; n <= doc.numPages; n++){
        const slot = document.createElement('div');
        slot.className = 'clean-pdf-page';
        slot.dataset.page = n;
        slot.style.aspectRatio = first.width + ' / ' + first.height;
        fragment.append(slot);
      }
      pages.replaceChildren(fragment);
      observer = new IntersectionObserver(entries => {
        if(!dialog.open) return;
        for(const {target, isIntersecting} of entries){
          if(isIntersecting && !visible.has(target)) renderPreviewPage(doc, target);
          else if(!isIntersecting) releasePage(target);
        }
      }, {root:pages, rootMargin:'400px 0px'});
      for(const slot of pages.children) observer.observe(slot);
    }catch(err){
      if(dialog.open){
        status.textContent = '无法打开 PDF。文件可能已损坏或被移走。';
        pages.replaceChildren(status);
      }
    }
  }
  dialog.showModal();
  loadPreview();
}

async function applyClean(ops){
  const s = state.clean;
  if(!s?.data || s.busy) return;
  s.busy = true;
  renderModal();
  try{
    const res = await fetch('/api/clean/apply', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(ops)
    });

    for(const kind of ['authors', 'orgs']){

    toast('应用失败，请重试');
  }finally{
    s.busy = false;
    if(state.clean === s) renderModal();
  }
}

function toggleTerm(groupId, term){
  const filter = getGroupFilter(groupId,'any');
  const kind = groupKind(groupId);
  const key = Retrieval.termKey(kind,term);
  const i = filter.terms.findIndex(t => Retrieval.termKey(kind,t) === key);
  if(i >= 0) filter.terms.splice(i,1); else filter.terms.push(term);
  state.eval = null;
  state.pendingScroll = 'top';
  renderAll();
}

function toggleYear(year){
  if(Number.isInteger(year)) toggleTerm(Retrieval.YEAR_GROUP,year);

function renderFilterChange(focusId){
  state.eval = null;

function parseFilterYear(value){
  const text = value.trim();
  return /^[0-9]{1,4}$/.test(text) ? Number(text) : null;
}

function updateYearRange(){
  const draft = activeFacets().yearDraft;
  const from = parseFilterYear(draft.yearFrom), to = parseFilterYear(draft.yearTo);
  const filter = getGroupFilter(Retrieval.YEAR_GROUP);
  const current = filter.terms.find(t => t.range);
  const valid = from !== null && to !== null && from <= to;
  if(valid ? current && current.range[0] === from && current.range[1] === to : !current) return;

  filter.terms = filter.terms.filter(Number.isInteger);
  if(valid) filter.terms.unshift({range:[from,to]});
  renderFilterChange();
}

function confirmSingleYear(){
  const draft = activeFacets().yearDraft;
  const year = parseFilterYear(draft.yearSingle);
  if(year === null){ toast('请输入 0 到 9999 之间的整数年份'); $('#yearSingle').focus(); return; }
  const filter = getGroupFilter(Retrieval.YEAR_GROUP);
  if(!filter.terms.includes(year)) filter.terms.push(year);
  draft.yearSingle = '';
  renderFilterChange('yearSingle');
}

function removeSingleYear(year){
  const filter = getGroupFilter(Retrieval.YEAR_GROUP);
  filter.terms = filter.terms.filter(t => t !== year);
  renderFilterChange(activeFacets().yearDraft.adding ? 'yearSingle' : 'yearSingleAdd');
}

function addMetadataSelection(input){
  const groupId = input.dataset.metadataSearch;

const saveTimers = {};
const pendingPatch = {};
const activeSaves = {};

function savePendingPatch(itemId){
  clearTimeout(saveTimers[itemId]);
  delete saveTimers[itemId];
  const body = pendingPatch[itemId];
  if(!body) return activeSaves[itemId];
  delete pendingPatch[itemId];
  const previous = activeSaves[itemId];
  const request = Promise.resolve(previous).catch(() => {}).then(async () => {
    const res = await fetch('/api/items/' + encodeURIComponent(itemId), {
      method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
    });
    if(!res.ok) throw new Error('保存失败，改动只在本页');
  }).finally(() => {
    if(activeSaves[itemId] === request) delete activeSaves[itemId];
  });
  activeSaves[itemId] = request;
  return request;
}

function scheduleSave(itemId, patch){
  if(!apiOnline) return;
  pendingPatch[itemId] = Object.assign(pendingPatch[itemId] || {}, patch);
  clearTimeout(saveTimers[itemId]);
  saveTimers[itemId] = setTimeout(() => {
    savePendingPatch(itemId)?.catch(() => toast('保存失败，改动只在本页'));
  }, 600);
}

async function addTag(facet, value, itemId, opts){
  const p = itemId ? PAPERS.find(x => x.id === itemId) : PAPERS.find(x => x.id === state.paperId);
  if(!p || !value) return false;
  value = value.trim();
  if(!value) return false;
  if(p.tags[facet].indexOf(value) !== -1){
    toast('这篇已经有「' + esc(value) + '」了');
    return false;
  }

  let target = null;
  if(facet === 'topic'){
    if(opts && opts.keepGroup){
      // 快捷标签 / AI 建议采纳：库里已有的标签就保持它原来的组归属，
      // 新标签落未分组（与 retrieval-model §5 一致）。
      target = { id:null };
    } else {
      target = groupFrom();
      if(target === undefined){
        toast('新组还没名字。填好组名再按回车，或点「取消」回到选组。');
        const nameInput = $('#rtNewName');
        if(nameInput) nameInput.focus();
        return false;
      }
      if(target === null){
        toast('还没选定组，请先选一个组或新建组。');
        return false;
      }
    }
  }

  // 先落本地，界面立刻有反馈
  if(facet === 'year') p.tags.year = [value];
  else p.tags[facet].push(value);

  if(!apiOnline){
    renderAll();
    toast('未连接本地服务，改动只在本页');
    return true;
  }

  try{
    const res = await fetch('/api/items/' + encodeURIComponent(p.id) + '/tags', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        facet: facet,
        name: value,
        group_id: target.id || undefined,
        group_name: target.name || undefined
      })
    });
    if(!res.ok) throw new Error('save');
    // 新建组成功后，面板切回选组模式，并把新组设为当前组
    if(target.isNew && target.name){
      await refreshGroups();
      const created = (state.groups || []).find(function(g){ return g.name === target.name; });
      if(created){
        state.groupSel = created.id;
        rememberGroup(created.id);
      }
      setNewGroupMode(false);
    }
    await refreshPapers();
    await refreshGroups();
    renderAll();
    if(state.readerOpen) renderReaderSide();
    toast('已加入 <b>' + labelOf(facet) + '：' + esc(value) + '</b>' +
      (target.isNew && target.name ? '，新组「' + esc(target.name) + '」' : ''));
    return true;
  }catch(err){
    // 落库失败：把本地加上的撤回，界面不能显示一条没存住的数据
    if(facet === 'year') p.tags.year = [];
    else p.tags[facet] = p.tags[facet].filter(function(t){ return t !== value; });
    renderAll();
    if(state.readerOpen) renderReaderSide();
    toast('保存失败，改动已撤回');
    return false;
  }
}

const deletedTagIds = new Set();

async function refreshGroups(){
  if(!apiOnline) return;
  try{
    const data = await fetchTags();
    state.groups = (data.groups || []).map(g => {
      const tags = g.tags.filter(t => !deletedTagIds.has(t.id));
      return {...g, tags, count:tags.length};
    });
    state.unfiled = (data.unfiled || []).filter(t => !deletedTagIds.has(t.id));
    const validTags = new Set(state.groups.flatMap(g => (g.tags || []).map(t => t.id)).concat(state.unfiled.map(t => t.id)));
    state.tagQuery.include = state.tagQuery.include.filter(id => validTags.has(id));
    state.tagQuery.exclude = state.tagQuery.exclude.filter(id => validTags.has(id));
    const valid = new Set([Retrieval.STAR_GROUP,Retrieval.UNFILED].concat(METADATA_FACETS.map(f => '@' + f.key),state.groups.map(g => g.id)));
    const filters = state.searchFacets.groupFilters;
    Object.keys(filters).forEach(id => { if(!valid.has(id)) delete filters[id]; });
    state.eval = null;
    // 记住的组被删了：清掉，回落到未分组，不把标签静默塞进别的组
    if(state.groupSel && !state.groups.some(g => g.id === state.groupSel)){
      state.groupSel = null;
    }
    if(!state.groupSel) state.groupSel = loadGroupPref();
  }catch(err){ /* 组读不到不影响主流程 */ }
}

async function moveTagGroup(dialog){
  if(dialog.busy || dialog.stale) return;
  if(!apiOnline){ toast('未连接本地服务'); return; }
  dialog.busy = true;
  dialog.message = '';
  renderModal();
  try{
    const res = await fetch('/api/groups/assign', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        tag_id:dialog.tagId,
        group_id:dialog.targetId === Retrieval.UNFILED ? null : dialog.targetId,
        expected_group_id:dialog.sourceId === Retrieval.UNFILED ? null : dialog.sourceId
      })
    });
    if(res.status === 409 || res.status === 404 || res.status === 400){
      dialog.stale = true;
      dialog.message = '标签或分组已变化，请取消后重新选择。';
      await refreshGroups();
      renderAll();
      return;
    }
    if(!res.ok) throw new Error('assign');

    // 服务已保存：即使随后读库失败，也显示这次已确认的归属。
    const hit = findTagById(dialog.tagId);
    const target = findGroupDef(dialog.targetId);
    if(hit && target && (hit.group?.id ?? Retrieval.UNFILED) !== target.id){
      const sourceTags = hit.group?.tags ?? state.unfiled;
      sourceTags.splice(sourceTags.indexOf(hit.tag), 1);
      if(hit.group) hit.group.count = sourceTags.length;
      target.tags.push(hit.tag);
      if(dialog.targetId !== Retrieval.UNFILED) target.count = target.tags.length;
    }
    await refreshGroups();
    renderAll();
    if(state.readerOpen) renderReaderSide();
    dialog.busy = false;
    closeDialog();
    toast('已将「' + esc(dialog.name) + '」移到「' + esc(dialog.targetName) + '」');

    dialog.message = '移动失败，请重试。';
  }finally{
    dialog.busy = false;
    if(state.dialog === dialog) renderModal();
  }
}

    const res = await fetch('/api/tags/' + encodeURIComponent(tagId) + '/definition', {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({definition: definition})
    });
    if(!res.ok) throw new Error('definition');
    await refreshGroups();
    renderModal();
    toast('已保存定义');
  }catch(err){
    toast('保存失败，请重试');
  }
}

async function commitNewGroup(){
  const input = $('#rtNewName');
  const name = input ? input.value.trim() : '';
  if(!name){
    toast('组名不能为空');
    if(input) input.focus();
    return;
  }
  const id = await createGroup(name);
  if(!id) return;
  setNewGroupMode(false);
  state.groupSel = id;
  renderAll();
  if(state.readerOpen) renderReaderSide();
  toast('已新建组 <b>' + esc(name) + '</b>');
  setTimeout(function(){
    const i = $('#rtValue');
    if(i) i.focus();
  }, 0);
}

function syncScope(ps){
  const ids = (state.aiExpand ? PAPERS : ps).map(p => p.id).sort().join(',');
  if(state.scopeIds !== undefined && state.scopeIds !== ids && state.chat.length && !state.busy){
    state.chat = [];
    state.conversationId = null;
    forgetConversation();
    toast('范围变了，已开始新对话');
  }
  state.scopeIds = ids;
}

function renderAll(){
  state.eval = null;
  state.queueEval = null;
  const organizing = state.workspace === 'organize';
  const ps = organizing ? queueEvaluation().matched : getFiltered();
  const restoreDetailFocus = state.detailOpen && state.tab === 'info' &&
    !ps.some(p => p.id === state.paperId) && $('#detail').contains(document.activeElement);
  if(state.paperId !== null && !ps.some(p => p.id === state.paperId)){
    state.paperId = null;
    if(state.tab === 'info'){
      state.detailOpen = false;
      state.detailReturnTo = null;
      state.detailListScroll = null;
    }
  }
  if(organizing){
    renderQueueHeader();
  }else{
    syncScope(ps);
    renderSearchHeader(ps);
  }
  renderGroups();
  renderList(ps);
  renderDetail();
  if(restoreDetailFocus) focusWorkspaceTitle();
  if(state.modalOpen) renderModal();
}

function focusWorkspaceTitle(){
  $(state.workspace === 'organize' ? '#organizeTitle' : '#resultsTitle')?.focus({preventScroll:true});
}

function resetWorkspaceDetail(){
  state.detailOpen = false;
  state.paperId = null;
  state.tab = 'info';
  state.detailReturnTo = null;
  state.detailListScroll = null;
  state.pendingScroll = null;
}

function applyWorkspaceFromLocation(focus = true){
  const organizing = location.hash === ORGANIZE_HASH;
  const workspace = organizing ? 'organize' : 'search';
  if(state.workspace === workspace) return;

  const list = $('#papers');
  const sidebar = $('#sidebar');
  const search = $('#search');
  if(organizing){
    state.searchListScroll = list.scrollTop;
    state.searchSidebarScroll = sidebar.scrollTop;
    state.searchExpandedPapers = new Set($$('.paper-meta-more[open]',list).map(el => el.closest('.paper').dataset.id));
    const savedQueue = history.state?.organizeQueue;
    state.queue = savedQueue === 'review' || savedQueue === 'untagged' ? savedQueue : defaultQueue();
  }
  closeReader();
  resetWorkspaceDetail();
  setFiltersOpen(false,false);
  state.workspace = workspace;
  $('#app').classList.toggle('organizing',organizing);
  search.value = organizing ? state.organizeQ : state.q;
  search.placeholder = organizing ? '搜索当前队列' : '搜索文献';
  search.setAttribute('aria-label', search.placeholder);
  $('#searchHeader').hidden = organizing;
  $('#organizeHeader').hidden = !organizing;
  $('.organize-btn').textContent = organizing ? '返回检索' : '文献整理';
  if(organizing){
    list.setAttribute('role','tabpanel');
    list.setAttribute('tabindex','0');
  }else{
    list.removeAttribute('role');
    list.removeAttribute('tabindex');
    list.setAttribute('aria-labelledby','resultsTitle');
  }
  list.replaceChildren();
  renderAll();
  sidebar.scrollTop = organizing ? 0 : state.searchSidebarScroll;
  if(!organizing){
    $$('.paper-meta-more',list).forEach(el => { el.open = state.searchExpandedPapers.has(el.closest('.paper').dataset.id); });
    list.scrollTop = state.searchListScroll;
  }
  if(focus && !state.modalOpen) focusWorkspaceTitle();
}

function switchQueue(queue){
  if(state.workspace !== 'organize') return;
  if(state.queue !== queue){
    state.queue = queue;
    history.replaceState({...history.state, organizeQueue:queue},'');
    resetWorkspaceDetail();
    $('#papers').scrollTop = 0;
    renderAll();
  }
  $('#queue-' + queue)?.focus({preventScroll:true});
}

window.addEventListener('popstate', () => applyWorkspaceFromLocation());

/* 事件委托 */
document.addEventListener('click', function(e){
  if(e.target.id === 'modal'){
    if(state.modalMode === 'import') closeImportBrowser();
    else if(state.modalMode === 'share') closeShare();
    else if(state.modalMode === 'clean') closeClean();
    else if(state.modalMode === 'delete-paper' || state.dialog?.kind === 'delete-tag' || isTagMoveDialog()) closeDialog();
    else if(isSettingsMode()) closeSettings();
    else { state.modalOpen = false; renderModal(); }
    return;
  }

  const el = e.target.closest('[data-act]');
  if(!el){
    const paper = e.target.closest('#papers .paper');
    if(paper && !e.target.closest('button, summary, details')) selectPaper(paper.dataset.id);
    return;
  }
  const act = el.dataset.act;

  if(act === 'toggle-workspace'){
    if(state.workspace === 'search'){
      history.pushState({organizeFromSearch:true, organizeQueue:defaultQueue()},'',ORGANIZE_HASH);
      applyWorkspaceFromLocation();
    }else if(history.state?.organizeFromSearch) history.back();
    else{
      const url = new URL(location.href);
      url.hash = '';
      history.replaceState(null,'',url);
      applyWorkspaceFromLocation();
    }
  }
  else if(act === 'switch-queue'){ switchQueue(el.dataset.queue); }
  else if(act === 'open-filters'){ setFiltersOpen(true); }
  else if(act === 'close-filters'){ setFiltersOpen(false); }
  else if(act === 'tag-toggle' || act === 'tag-exclude'){
    const options = el.closest('.qg-options');
    const scrollLeft = options?.scrollLeft;
    const scrollTop = options?.scrollTop;
    toggleTagQuery(el.dataset.id, act === 'tag-exclude');
    const button = options && document.getElementById(el.id);
    if(button){
      button.closest('.qg-options').scrollTo(scrollLeft,scrollTop);
      button.focus({preventScroll:true});
    }
  }
  else if(act === 'tag-join'){
    state.tagQuery.op = el.dataset.op === 'or' ? 'or' : 'and';
    renderFilterChange(el.id);
  }
  else if(act === 'year-toggle'){
    toggleYear(Number(el.dataset.year));
  }
  else if(act === 'metadata-toggle'){
    toggleTerm(el.dataset.group,el.dataset.value);
  }
  else if(act === 'apply-rescue'){
    const groupId = el.dataset.group;
    const kind = el.dataset.kind === 'remove-tag' ? Retrieval.TAG : groupKind(groupId);
    if(el.dataset.kind === 'include-unknown'){
      getGroupFilter(groupId,'any').includeUnknown = true;
    }else if(el.dataset.kind === 'remove-tag'){
      const field = el.dataset.field === 'exclude' ? 'exclude' : 'include';
      state.tagQuery[field] = state.tagQuery[field].filter(id => id !== el.dataset.key);
    }else{
      const filter = getGroupFilter(groupId,'any');
      const removedRange = kind === Retrieval.YEAR && filter.terms.some(t => t.range && Retrieval.termKey(kind,t) === el.dataset.key);
      filter.terms = filter.terms.filter(t => Retrieval.termKey(kind,t) !== el.dataset.key);
      if(removedRange){
        const draft = activeFacets().yearDraft;
        draft.yearFrom = '';
        draft.yearTo = '';
      }
    }
    state.eval = null;
    state.pendingScroll = 'top';
    renderAll();
  }
  else if(act === 'group-expand'){
    const id = el.dataset.group;
    if(state.expandedGroups.has(id)) state.expandedGroups.delete(id); else state.expandedGroups.add(id);
    renderGroups();
    $(`.qg-more[data-group="${CSS.escape(id)}"]`)?.focus();
  }
  else if(act === 'groups-expand'){
    state.groupsExpanded = !state.groupsExpanded;
    renderGroups();
    $('#groupsExpand')?.focus();
  }
  else if(act === 'reset-all'){ clearAll(); }
  else if(act === 'year-single-add'){
    activeFacets().yearDraft.adding = true;
    renderGroups();
    $('#yearSingle').focus();
  }
  else if(act === 'year-single-confirm'){ confirmSingleYear(); }
  else if(act === 'year-remove'){ removeSingleYear(Number(el.dataset.year)); }
  else if(act === 'close-detail'){ closeDetail(); }
  else if(act === 'jump-note'){ $('#paperNote')?.focus(); }
  else if(act === 'select'){ selectPaper(el.dataset.id); }
  else if(act === 'to-ai'){
    if(!state.detailOpen) state.detailListScroll = $('#papers').scrollTop;
    state.tab = 'ai';
    state.detailOpen = true;
    state.detailReturnTo = '.ask-btn';
    state.pendingScroll = 'bottom';
    updateDetailSelection();
    renderDetail();
    $('#detail .detail-close')?.focus({preventScroll:true});
  }
  else if(act === 'to-info'){
    if(state.paperId !== null) selectPaper(state.paperId);
  }
  else if(act === 'open-pdf'){ openReader(el.dataset.id); }
  else if(act === 'tag-paper'){
    state.readerTags = true;
    openReader(el.dataset.id);
  }
  else if(act === 'reader-close'){ closeReader(); }
  else if(act === 'reader-prev'){ goToPage(pdfView.current - 1, true); }
  else if(act === 'reader-next'){ goToPage(pdfView.current + 1, true); }
  else if(act === 'reader-zoom-in'){ zoomBy(1.15); }
  else if(act === 'reader-zoom-out'){ zoomBy(1 / 1.15); }
  else if(act === 'reader-fit'){ fitWidth(); }
  else if(act === 'reader-rotate'){ rotatePage(); }
  else if(act === 'reader-attach'){ $('#attachInput').click(); }
  else if(act === 'delete-paper'){
    const p = PAPERS.find(x => x.id === el.dataset.id);
    if(!p) return;
    openDeletePaperDialog(p);
  }
  else if(act === 'copy-cite'){
    const p = PAPERS.find(x => x.id === el.dataset.id);
    if(!p) return;
    const year = (p.tags.year && p.tags.year[0]) || 'n.d.';
    const authors = (p.authors && p.authors.length) ? p.authors.join(', ') : '佚名';
    const venue = p.venue ? p.venue + ', ' : '';
    const text = authors + '. ' + p.title + '. ' + venue + year + '.';
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('引用已复制'); }, function(){ toast('复制失败，可手动选择'); });
    } else { toast('当前浏览器不支持自动复制'); }
  }
  else if(act === 'accept-sug'){
    const p = readerPaper() || PAPERS.find(x => x.id === state.paperId);
    if(!p) return;
    const value = el.dataset.value;
    const box = state.sugg[p.id];
    if(box && box.items) box.items = box.items.filter(s => s.name !== value);
    // 采纳的标签按 §5 走「未分组」：AI 不替用户选组，要归组去标签库整理
    addTag('topic', value, p.id, {keepGroup:true});
  }
  else if(act === 'dismiss-sug'){
    const p = readerPaper() || PAPERS.find(x => x.id === state.paperId);
    if(!p) return;
    state.dismissed.add(p.id + '|topic|' + el.dataset.value);
    renderDetail();
    if(state.readerOpen) renderReaderSide();
  }
  else if(act === 'gen-sug' || act === 'regen-sug'){
    const id = el.dataset.id || (readerPaper() || {}).id || state.paperId;
    if(id) loadSuggestions(id);
  }
  else if(act === 'open-clean'){
    openClean();
    return;
  }
  else if(act === 'close-clean'){
    closeClean();
  }
  else if(act === 'clean-open-pdf'){
    openCleanPdf(el);
    return;
  }
  else if(act === 'clean-apply-one' || act === 'clean-ignore'){
    const s = state.clean;
    if(!s?.data || s.busy) return;
    const {kind, id} = el.closest('.crow').dataset;
    const list = s.data[kind];
    const item = list.find(it => it.id === id);
    if(!item) return;
    if(act === 'clean-ignore'){
      s.data[kind] = list.filter(it => it.id !== id);
      renderModal();
    }else{
      const op = cleanOperation(item);
      if(op) applyClean({authors:[], orgs:[], [kind]:[op]});
    }
    return;
  }
  else if(act === 'clean-apply-all'){
    confirmCleanBatch();
    return;
  }
  else if(act === 'create-group'){
    commitNewGroup();
  }
  else if(act === 'new-group'){
    openLibraryDialog('create-group', null, '');
  }
  else if(act === 'cancel-new-group'){
    setNewGroupMode(false);
    renderAll();
    if(state.readerOpen) renderReaderSide();
  }
  /* ---------- 阅读器里的打标签 ---------- */
  else if(act === 'reader-tags'){
    state.readerTags = state.readerTags === false;
    renderReaderSide();
    if(state.readerTags){
      setTimeout(function(){ const i = $('#rtValue'); if(i) i.focus(); }, 0);
    }
  }
  else if(act === 'rt-add'){
    readerAddTag();
    return;
  }
  else if(act === 'rt-quick'){
    const p = readerPaper();
    if(!p || el.disabled) return;
    addTag('topic', el.dataset.name, p.id, {keepGroup:true}).then(function(){
      renderReaderSide();
    });
    return;
  }
  else if(act === 'rt-del-tag'){
    readerRemoveTag(el.dataset.name);
    return;
  }
  else if(act === 'rt-star'){
    const p = readerPaper();
    if(!p) return;
    p.starred = !p.starred;
    state.eval = null;
    renderReaderSide();
    renderAll();
    scheduleSave(p.id, {starred: p.starred});
    return;
  }
  else if(act === 'rt-edit-meta'){
    const p = readerPaper();
    if(!p) return;
    state.metaItemId = p.id;
    state.modalMode = 'meta';
    state.modalOpen = true;
    renderModal();
    return;
  }
  else if(act === 'rt-fetch-meta'){
    const p = readerPaper();
    if(p) fetchMeta(p.id);
  }
  else if(act === 'rt-open-lib'){
    closeReader();
    openSettings('tags');
    return;
  }
  else if(act === 'quick'){ send(el.dataset.q); }
  else if(act === 'cite'){
    const page = parseInt(el.dataset.page || '0', 10) || 0;
    if(page > 0) citeJump(el.dataset.id, page);
    else selectPaper(el.dataset.id);
  }
  else if(act === 'expand-on'){ state.expandConfirm = true; renderDetail(); }
  else if(act === 'expand-cancel'){ state.expandConfirm = false; renderDetail(); }
  else if(act === 'expand-confirm'){
    state.expandConfirm = false;
    state.aiExpand = true;
    state.chat = [];
    state.conversationId = null;
    forgetConversation();
    renderAll();
    toast('范围已扩到<b>全库 ' + PAPERS.length + ' 篇</b>');
  }
  else if(act === 'expand-off'){
    state.aiExpand = false;
    state.chat = [];
    state.conversationId = null;
    forgetConversation();
    renderAll();
    toast('已缩回当前筛选');
  }
  else if(act === 'open-settings'){ openSettings(el.dataset.section, el); }
  else if(act === 'settings-section'){ selectSettingsSection(el.dataset.section); }
  else if(act === 'close-settings'){ closeSettings(); }
  else if(act === 'save-settings'){ saveAISettings(el); }
  else if(act === 'clear-key'){ clearAIKey(el); }
  else if(act === 'clear-chat'){
    state.chat = [];
    state.conversationId = null;
    forgetConversation();
    state.pendingScroll = 'top';
    renderDetail();
  }
  else if(act === 'edit-meta'){ state.metaItemId = el.dataset.id || state.paperId; state.modalMode = 'meta'; state.modalOpen = true; renderModal(); }
  else if(act === 'fetch-meta'){ fetchMeta(el.dataset.id); }
  else if(act === 'close-meta'){ state.modalOpen = false; renderModal(); }
  else if(act === 'save-meta'){ saveMetaFields(); }
  else if(act === 'fetch-all'){ fetchAllMissing(); }
  else if(act === 'del-group'){
    openLibraryDialog('delete-group', el.dataset.id, el.dataset.name || '');
  }
  else if(act === 'del-tag'){
    openLibraryDialog('delete-tag', el.dataset.id, el.dataset.name, Number(el.dataset.count));
  }
  else if(act === 'pick-tag-group'){
    chooseTagDestination(el.dataset.id);
  }
  else if(act === 'tag-def'){
    openTagDefDialog(el.dataset.id, el.dataset.name || '');
  }
  else if(act === 'dialog-pick-group'){
    const dialog = state.dialog;
    if(dialog?.kind === 'pick-tag-group') confirmTagMove(dialog.tagId, dialog.sourceId, el.dataset.id);
  }
  else if(act === 'dialog-confirm'){
    if(state.modalMode === 'delete-paper'){
      deletePaper(state.dialog);
      return;
    }
    if(state.dialog?.kind === 'move-tag'){
      moveTagGroup(state.dialog);
      return;
    }
    if(state.dialog?.kind === 'delete-tag'){
      deleteTag(state.dialog);
      return;
    }
    if(state.dialog && state.dialog.kind === 'tag-def'){
      const input = $('#tagDefInput');
      const def = input ? input.value.trim() : '';
      const tagId = state.dialog.tagId;
      closeDialog();
      if(tagId) setTagDefinition(tagId, def);
      return;
    }
    if(state.dialog && state.dialog.kind === 'create-group'){
      const input = $('#libNewGroupName');
      const name = input ? input.value.trim() : '';
      if(!name){ toast('组名不能为空'); if(input) input.focus(); return; }
      closeDialog();
      createGroup(name).then(function(id){
        if(id) toast('已新建组 <b>' + esc(name) + '</b>');
        renderModal();
      });
      return;
    }
    const id = state.dialog ? state.dialog.groupId : null;
    const name = state.dialog ? state.dialog.name : '';
    closeDialog();
    if(id) deleteGroup(id, name);
  }
  else if(act === 'dialog-cancel'){
    closeDialog();
  }
  else if(act === 'import'){ openShare('choose', el); }
  else if(act === 'export-share'){ openShare('select', el); }
  else if(act === 'share-close'){ closeShare(); }
  else if(act === 'share-browse'){ openImportBrowser(shareView.anchor, el.dataset.kind); }
  else if(act === 'share-all'){ toggleShareSelection(); }
  else if(act === 'share-reset'){ resetShareFilters(); }
  else if(act === 'share-confirm'){ shareView.mode = 'confirm'; renderShareModal(); }
  else if(act === 'share-back'){ shareView.mode = 'select'; renderShareModal(); }
  else if(act === 'share-download'){ downloadShare(); }
  else if(act === 'share-commit'){ runShareImport(shareView.path, shareView.preview.token); }
  else if(act === 'share-repreview'){ runShareImport(shareView.path); }
  else if(act === 'import-close'){ closeImportBrowser(); }
  else if(act === 'import-roots'){ loadImportLocation(); }
  else if(act === 'import-up'){ loadImportLocation(importView.location?.parent); }
  else if(act === 'import-enter'){ loadImportLocation(el.dataset.path); }
  else if(act === 'import-all'){ toggleImportSelection(); }
  else if(act === 'import-selected'){
    if(importView.kind === 'share') runShareImport([...importView.selected][0]);
    else runLocalImport({paths:[...importView.selected]});
  }
  else if(act === 'import-folder'){ runLocalImport({folder:importView.location?.path}); }
  else if(act === 'reconnect'){ boot(); }
});

document.addEventListener('submit', function(e){
  if(e.target.id === 'chatForm'){
    e.preventDefault();
    const input = $('#chatInput');
    const v = input ? input.value : '';
    if(v.trim()) send(v.trim());
  }
});

document.addEventListener('change', function(e){
  if(e.target.closest('#modal') && state.modalMode === 'share'){
    changeShareOption(e.target);
    return;
  }
  if(e.target.matches('#settings-appearance input[name="theme"]')){
    const theme = e.target.value;
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem('colophon:theme', theme); } catch(err) { /* 隐私模式 */ }
    return;
  }
  if(e.target.id === 'yearIncludeUnknown'){
    getGroupFilter(Retrieval.YEAR_GROUP).includeUnknown = e.target.checked;
    renderFilterChange('yearIncludeUnknown');
    return;
  }
  if(e.target.id === 'starFilter'){
    getGroupFilter(Retrieval.STAR_GROUP).terms = e.target.checked ? [{star:true}] : [];
    renderFilterChange('starFilter');
    return;
  }
  if(e.target.dataset.metadataSearch){
    // Choosing a suggestion commits while the input is still focused.
    if(document.activeElement === e.target) addMetadataSelection(e.target);
    return;
  }
  if(e.target.dataset.change === 'group-op'){
    const filter = getGroupFilter(e.target.dataset.group,'any');
    filter.op = e.target.value;
    state.eval = null;
    renderAll();
    return;
  }
  if(e.target.id === 'sort'){
    state.sort = e.target.value;
    renderAll();
  }
  if(e.target.id === 'rtGroup'){
    if(e.target.value === '__new'){
      setNewGroupMode(true);
      renderReaderSide();
      setTimeout(function(){ const i = $('#rtNewName'); if(i) i.focus(); }, 0);
      return;
    }
    state.groupSel = e.target.value || null;
    if(state.groupSel) rememberGroup(state.groupSel);
    renderReaderSide();
    setTimeout(function(){ const i = $('#rtValue'); if(i) i.focus(); }, 0);
  }
  if(e.target.matches('[data-import-check]') && !importView.importing){
    const path = e.target.dataset.path;
    if(importView.kind === 'share') importView.selected.clear();
    if(e.target.checked) importView.selected.add(path);
    else importView.selected.delete(path);
    paintImportSelection();
  }
  if(e.target.id === 'attachInput'){
    const id = pdfView.itemId || state.paperId;
    const picked = e.target.files && e.target.files[0];
    e.target.value = '';
    if(id && picked) attachPdfTo(id, picked);
  }
});

document.addEventListener('input', function(e){
  if(e.target.matches('[data-share-find]')){
    findShareTerms(e.target);
    return;
  }
  if(e.target.id === 'shareSearch'){
    shareView.filter.q = e.target.value;
    paintShareResults();
    return;
  }
  if(e.target.matches('[data-note]')){
    const p = PAPERS.find(p => p.id === e.target.dataset.note);
    if(p){
      p.note = e.target.value;
      scheduleSave(p.id, {note_md:p.note});
    }
    return;
  }
  if(e.target.dataset.metadataSearch){
    activeFacets().metadataDraft[e.target.dataset.metadataSearch] = e.target.value;
    return;
  }
  if(/^year(From|To|Single)$/.test(e.target.id)){
    activeFacets().yearDraft[e.target.id] = e.target.value;
    if(e.target.id !== 'yearSingle' && !e.isComposing) updateYearRange();
    return;
  }
  if(e.target.id === 'search'){
    if(state.workspace === 'organize') state.organizeQ = e.target.value;
    else state.q = e.target.value;
    $('#papers').scrollTop = 0;
    renderFilterChange();
    return;
  }
});

document.addEventListener('compositionend', function(e){
  if(e.target.id === 'yearFrom' || e.target.id === 'yearTo'){
    activeFacets().yearDraft[e.target.id] = e.target.value;
    updateYearRange();
  }
});

let readerScrollRaf = 0;
$('#readerBody').addEventListener('scroll', function(){
  if(!state.readerOpen) return;
  if(readerScrollRaf) return;
  readerScrollRaf = requestAnimationFrame(function(){
    readerScrollRaf = 0;
    syncCurrentPage();
  });
});

document.addEventListener('keydown', function(e){
  if($('#cleanPdfPreview[open]')) return;
  if(state.modalOpen && isSettingsMode()){
    if(e.key === 'Escape' && !e.isComposing && e.keyCode !== 229){
      e.preventDefault();
      closeSettings();
    }
    if(e.key === 'Tab'){
      const card = $('.settings-card');
      const controls = $$('button:not(:disabled), input:not(:disabled)', card)
        .filter(el => !el.closest('[hidden]') && (el.type !== 'radio' || el.checked));
      const first = controls[0], last = controls[controls.length - 1];
      if(!card.contains(document.activeElement) || document.activeElement === (e.shiftKey ? first : last)){
        e.preventDefault();
        (e.shiftKey ? last : first)?.focus();
      }
    }
    return;
  }
  if(e.target.matches('.queue-tabs [role="tab"]') && !state.modalOpen && !state.readerOpen){
    if(['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){
      e.preventDefault();
      const other = state.queue === 'review' ? 'untagged' : 'review';
      switchQueue(e.key === 'Home' ? 'review' : e.key === 'End' ? 'untagged' : other);
      return;
    }
  }
  if(e.target.dataset.metadataSearch && e.key === 'Enter'){
    if(e.isComposing || e.keyCode === 229) return;
    addMetadataSelection(e.target);
    return;
  }
  if(e.target.id === 'yearSingle'){
    if(e.isComposing || e.keyCode === 229) return;
    if(e.key === 'Enter'){
      e.preventDefault();
      confirmSingleYear();
      return;
    }
    if(e.key === 'Backspace' && e.target.value === ''){
      const singles = getGroupFilter(Retrieval.YEAR_GROUP).terms.filter(Number.isInteger);
      e.preventDefault();
      if(!e.repeat && singles.length) removeSingleYear(singles[singles.length - 1]);
      return;
    }
    if(e.key === 'Escape'){
      e.preventDefault();
      const draft = activeFacets().yearDraft;
      draft.adding = false;
      draft.yearSingle = '';
      renderGroups();
      $('#yearSingleAdd').focus();
      return;
    }
  }
  if(e.key === 'Escape' && state.modalOpen){
    if(e.isComposing || e.keyCode === 229) return;
    if(state.modalMode === 'import'){ closeImportBrowser(); return; }
    if(state.modalMode === 'share'){ closeShare(); return; }
    if(state.modalMode === 'clean'){
      if(!$('.clean-dialog[open]')) closeClean();
      return;
    }
    if(state.modalMode === 'delete-paper' || state.dialog?.kind === 'delete-tag' || isTagMoveDialog()){ closeDialog(); return; }
    state.modalOpen = false;
    renderModal();
    if(state.readerOpen) $('[data-act="rt-edit-meta"]')?.focus({preventScroll:true});
    return;
  }
  if(state.readerOpen && !state.modalOpen){
    // 正在侧栏输入时，Esc 只退出输入框，不关阅读器——否则打了一半的标签会丢
    if(e.key === 'Escape' && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
      document.activeElement.blur();
      return;
    }
    if(e.key === 'Escape'){ e.preventDefault(); closeReader(); return; }
    if(e.key === 'ArrowRight'){ e.preventDefault(); goToPage(pdfView.current + 1, true); return; }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); goToPage(pdfView.current - 1, true); return; }
    if(e.key === '+' || e.key === '='){ e.preventDefault(); zoomBy(1.15); return; }
    if(e.key === '-'){ e.preventDefault(); zoomBy(1 / 1.15); return; }
    if((e.key === 't' || e.key === 'T') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
      e.preventDefault();
      state.readerTags = state.readerTags === false;
      renderReaderSide();
      if(state.readerTags) setTimeout(function(){ const i = $('#rtValue'); if(i) i.focus(); }, 0);
      return;
    }
  }
  if(state.modalOpen && (state.modalMode === 'import' || state.modalMode === 'share' || state.modalMode === 'delete-paper' || state.dialog?.kind === 'delete-tag' || isTagMoveDialog())){
    if(e.key === 'Tab'){
      const controls = $$('#modal button:not(:disabled), #modal input:not(:disabled), #modal select:not(:disabled), #modal summary')
        .filter(el => el.getClientRects().length && (el.type !== 'radio' || el.checked || !$('#modal input[type="radio"]:checked')));
      const first = controls[0], last = controls[controls.length - 1];
      if(!controls.length || !$('#modal').contains(document.activeElement) ||
          document.activeElement === (e.shiftKey ? first : last)){
        e.preventDefault();
        (e.shiftKey ? last : first)?.focus();
      }
    }
    return;
  }
  if(!state.modalOpen && !state.readerOpen && e.key === 'Escape' && !e.isComposing){
    if(state.filtersOpen){ setFiltersOpen(false); return; }
    if(state.detailOpen){ closeDetail(); return; }
  }
  if(e.key === '/' && !state.modalOpen && !state.readerOpen && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    e.preventDefault();
    $('#search').focus();
  }
  if(e.key === 'Enter' && e.target.id === 'rtValue'){
    e.preventDefault();
    readerAddTag();
    return;
  }
  if(e.key === 'Enter' && e.target.id === 'rtNewName'){
    e.preventDefault();
    commitNewGroup();
    return;
  }
  if(e.key === 'Enter' && e.target.id === 'libNewGroupName'){
    e.preventDefault();
    const input = $('#libNewGroupName');
    const name = input ? input.value.trim() : '';
    if(!name){ toast('组名不能为空'); return; }
    closeDialog();
    createGroup(name).then(function(id){
      if(id) toast('已新建组 <b>' + esc(name) + '</b>');
      renderModal();
    });
    return;
  }
});

/* ============================================================
   PDF 阅读器（只读，不做批注）
   ============================================================ */
const pdfView = {
  doc:null, loading:null, itemId:null, scale:1, fitScale:1, fit:true, rotation:0,
  pages:[], io:null, current:1, renderTimer:0, wheelFrame:0, wheelDelta:0
};

function setReaderLoading(on, text){
  const el = $('#readerLoading');
  if(!el) return;
  if(text) el.textContent = text;
  el.classList.toggle('show', !!on);
}

function updateReaderChrome(){
  const total = pdfView.doc ? pdfView.doc.numPages : 0;
  const page = $('#readerPage');
  if(page) page.textContent = total ? (pdfView.current + ' / ' + total) : '– / –';
  const z = $('#readerZoom');
  if(z){
    const pct = pdfView.fitScale ? Math.round(pdfView.scale / pdfView.fitScale * 100) : 100;
    z.textContent = pdfView.fit ? '适应宽度' : pct + '%';
  }
  const prev = $('[data-act="reader-prev"]');
  const next = $('[data-act="reader-next"]');
  if(prev) prev.disabled = !total || pdfView.current <= 1;
  if(next) next.disabled = !total || pdfView.current >= total;
}

function destroyPdf(){
  clearTimeout(pdfView.renderTimer);
  cancelAnimationFrame(pdfView.wheelFrame);
  pdfView.renderTimer = pdfView.wheelFrame = pdfView.wheelDelta = 0;
  pdfView.io?.disconnect();
  pdfView.io = null;
  for(const ps of pdfView.pages){
    ps.rasterJob?.task.cancel();
    ps.textTask?.cancel();
  }
  pdfView.loading?.destroy().catch(() => {});
  pdfView.loading = pdfView.doc = null;
  pdfView.pages = [];
  pdfView.current = 1;
  pdfView.itemId = null;
  pdfView.scale = 1;
  pdfView.fitScale = 1;
  pdfView.fit = true;
  pdfView.rotation = 0;
}

function rememberPosition(){
  if(!pdfView.itemId) return;
  try{ localStorage.setItem('colophon:pos:' + pdfView.itemId, String(pdfView.current)); }catch(err){ /* 隐私模式 */ }
}

function documentPageUrl(item){
  const resolver = /^https?:\/\/(?:dx\.)?doi\.org\//i;
  const doiValue = (item.doi || '').trim().replace(/^doi\s*:\s*/i, '');
  try{
    const doi = resolver.test(doiValue) ? decodeURIComponent(new URL(doiValue).pathname.slice(1)) : doiValue;
    if(/^10\.\d{4,9}\/[^\s\x00-\x1f\x7f]+$/i.test(doi) && !/(?:^|\/)\.{1,2}(?:\/|$)/.test(doi)){
      return 'https://doi.org/' + doi.split('/').map(encodeURIComponent).join('/');
    }
  }catch(err){ /* 无法解析的 DOI 不阻断其他入口 */ }

  const savedUrl = (item.url || '').trim();
  if(/^https?:\/\//i.test(savedUrl)){
    try{
      const url = new URL(savedUrl);
      if(!url.username && !url.password) return url.href;
    }catch(err){ /* 没有可用的文献页地址 */ }
  }

  const arxiv = (item.arxivId || '').trim()
    .replace(/^(?:arxiv\s*:\s*|https?:\/\/arxiv\.org\/(?:abs|pdf)\/)/i, '')
    .replace(/\.pdf$/i, '');
  if(/^(?:\d{4}\.\d{4,5}|[a-z-]+(?:\.[a-z]{2})?\/\d{7})(?:v\d+)?$/i.test(arxiv)){
    return 'https://arxiv.org/abs/' + arxiv;
  }
  return '';
}

function documentSearchUrl(item){
  const title = (item.title || '').trim().replace(/\s+/g, ' ');
  if(!title) return '';
  const firstAuthor = (item.authors?.[0] || '').trim();
  const qualifier = title.length < 24 ? firstAuthor || item.year : '';
  const query = qualifier ? title + ' ' + qualifier : title;
  return 'https://www.bing.com/search?' + new URLSearchParams({q:query});
}

function readerMissing(item){
  destroyPdf();
  pdfView.itemId = item.id;
  const page = documentPageUrl(item);
  const search = documentSearchUrl(item);
  const link = (url, label, cssClass) =>
    '<a class="' + cssClass + '" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' +
      label + ' <span aria-hidden="true">↗</span></a>';
  const body = $('#readerBody');
  body.classList.add('blank');
  body.innerHTML =
    '<div class="rmissing">' +
      '<div class="em">▤</div>' +
      '<p>这条文献缺少 PDF。<br>下载后，选择本地 PDF 文件补到这条文献。</p>' +
      '<div class="rmissing-actions">' +
        (page ? link(page, '打开文献页', 'btn primary') : '') +
        (search && !page ? link(search, '搜索文献', 'btn primary') : '') +
        '<button class="btn' + (page || search ? '' : ' primary') + '" data-act="reader-attach">选择 PDF 文件</button>' +
        (page && search ? link(search, '按标题搜索', 'linkbtn') : '') +
      '</div>' +
    '</div>';
  updateReaderChrome();
  setReaderLoading(false);
}

function openReader(itemId = state.paperId){
  const p = PAPERS.find(x => x.id === itemId);
  if(!p) return;
  state.readerOpen = true;
  state.readerGroupNew = false;
  state.readerItemId = p.id;
  $('#reader').hidden = false;
  $('#readerTitle').innerHTML =
    '<span>' + esc(p.title || '未命名') + '</span>' +
    (p.fileName ? '<span class="rname">' + esc(p.fileName) + '</span>' : '');
  renderReaderSide();

  if(!p.hasFile) readerMissing(p);
  else if(pdfView.itemId !== p.id) loadPdf(p);

  if(state.readerTags !== false){
    setTimeout(function(){ const i = $('#rtValue'); if(i) i.focus(); }, 0);
  }
}

function closeReader(){
  if(!state.readerOpen) return;
  rememberPosition();
  state.readerOpen = false;
  state.readerGroupNew = false;
  state.readerItemId = null;
  $('#reader').hidden = true;
  const body = $('#readerBody');
  body.innerHTML = '';
  body.classList.remove('blank');
  setReaderLoading(false);
  destroyPdf();
  const side = $('#readerSide');
  if(side){ side.innerHTML = ''; }
}

async function loadPdf(p){
  destroyPdf();
  pdfView.itemId = p.id;
  const body = $('#readerBody');
  body.innerHTML = '';
  body.classList.remove('blank');
  setReaderLoading(true, '正在载入 PDF…');
  updateReaderChrome();

  if(!window.pdfjsLib){
    setReaderLoading(false);
    body.classList.add('blank');
    body.innerHTML = '<div class="rmissing"><div class="em">⚠</div><p>PDF 组件没有加载成功。<br>请确认 web/vendor/pdfjs/ 下的文件存在。</p></div>';
    return;
  }

  let loading;
  try{
    loading = pdfView.loading = pdfjsLib.getDocument({
      url: '/api/items/' + encodeURIComponent(p.id) + '/file'
    });
    const doc = await loading.promise;
    if(loading !== pdfView.loading) return;
    pdfView.doc = doc;
    await buildPages(doc);
    if(loading !== pdfView.loading) return;
    setReaderLoading(false);
    updateReaderChrome();
  }catch(err){
    if(!state.readerOpen || (loading && loading !== pdfView.loading)) return;
    if(err?.name === 'MissingPDFException'){
      readerMissing(p);
      return;
    }
    destroyPdf();
    pdfView.itemId = p.id;
    setReaderLoading(false);
    body.classList.add('blank');
    body.innerHTML =
      '<div class="rmissing">' +
        '<div class="em">⚠</div>' +
        '<p>这个 PDF 打不开。文件可能已损坏，或已不在原来的位置。</p>' +
        '<button class="btn" data-act="reader-close">关闭</button>' +
      '</div>';
    updateReaderChrome();
  }
}

async function buildPages(doc){
  const body = $('#readerBody');
  const pages = [];
  const frag = document.createDocumentFragment();
  for(let n = 1; n <= doc.numPages; n++){
    const page = await doc.getPage(n);
    if(doc !== pdfView.doc) return;
    const wrap = document.createElement('div');
    wrap.className = 'rpage-wrap';
    wrap.dataset.page = String(n);
    const textLayer = document.createElement('div');
    textLayer.className = 'rtext';
    const label = document.createElement('span');
    label.className = 'rpage-n';
    label.textContent = String(n);
    label.setAttribute('aria-hidden', 'true');
    wrap.append(textLayer, label);
    frag.appendChild(wrap);
    pages.push({n, page, wrap, textLayer});
  }
  pdfView.pages = pages;
  pdfView.scale = pdfView.fitScale = readerFitScale();
  pages.forEach(layoutPdfPage);
  body.replaceChildren(frag);
  body.scrollLeft = 0;

  pdfView.io = new IntersectionObserver(function(entries){
    if(doc !== pdfView.doc) return;
    for(const {target, isIntersecting} of entries){
      const ps = pages[Number(target.dataset.page) - 1];
      ps.nearby = isIntersecting;
      if(isIntersecting) renderPage(ps.n);
    }
  }, { root:body, rootMargin:'800px 0px' });
  for(const ps of pages) pdfView.io.observe(ps.wrap);

  let saved = 1;
  try{ saved = parseInt(localStorage.getItem('colophon:pos:' + pdfView.itemId), 10) || 1; }catch(err){ /* 隐私模式 */ }
  goToPage(saved, false);
}

function layoutPdfPage(ps){
  const viewport = ps.page.getViewport({scale:pdfView.scale, rotation:(ps.page.rotate + pdfView.rotation) % 360});
  ps.viewport = viewport;
  ps.wrap.style.width = Math.max(1, Math.floor(viewport.width)) + 'px';
  ps.wrap.style.height = Math.max(1, Math.floor(viewport.height)) + 'px';
  ps.wrap.style.setProperty('--scale-factor', viewport.scale);
  ps.textLayer.dataset.mainRotation = viewport.rotation;
  if(ps.canvas) ps.canvas.hidden = ps.canvasRotation !== viewport.rotation;
}

async function renderPageText(ps){
  if(ps.textStarted) return;
  ps.textStarted = true;
  try{
    ps.textTask = pdfjsLib.renderTextLayer({
      textContentSource:ps.page.streamTextContent(),
      container:ps.textLayer,
      viewport:ps.viewport
    });
    await ps.textTask.promise;
  }catch(err){
    if(err.name !== 'AbortException') console.warn('PDF 文本层渲染失败', ps.n, err);
  }finally{
    ps.textTask = null;
  }
}

function renderPage(n){
  const ps = pdfView.pages[n - 1];
  if(!ps) return;
  renderPageText(ps);
  if(!pdfView.renderTimer) renderPageCanvas(ps);
}

async function renderPageCanvas(ps){
  const viewport = ps.viewport;
  if(ps.canvasViewport === viewport || ps.rasterJob?.viewport === viewport) return;
  ps.rasterJob?.task.cancel();
  let job;
  try{
    // 限制高倍率下的画布像素数，页面大小和文字位置仍按阅读倍率显示。
    const pixelScale = Math.min(window.devicePixelRatio || 1, 2,
      4096 / viewport.width, 4096 / viewport.height);
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.ceil(viewport.width * pixelScale));
    canvas.height = Math.max(1, Math.ceil(viewport.height * pixelScale));
    const task = ps.page.render({
      canvasContext:canvas.getContext('2d', {alpha:false}),
      viewport,
      transform:[pixelScale, 0, 0, pixelScale, 0, 0]
    });
    job = ps.rasterJob = {viewport, task};
    await task.promise;
    if(pdfView.pages[ps.n - 1] !== ps || ps.rasterJob !== job || ps.viewport !== viewport) return;
    ps.canvas?.remove();
    ps.wrap.prepend(canvas);
    ps.canvas = canvas;
    ps.canvasViewport = viewport;
    ps.canvasRotation = viewport.rotation;
  }catch(err){
    if(err.name !== 'RenderingCancelledException') console.error('PDF 页渲染失败', ps.n, err);
  }finally{
    if(ps.rasterJob === job) ps.rasterJob = null;
  }
}

function schedulePdfRender(delay){
  clearTimeout(pdfView.renderTimer);
  pdfView.renderTimer = setTimeout(function(){
    pdfView.renderTimer = 0;
    for(const ps of pdfView.pages){
      if(ps.nearby || ps.n === pdfView.current) renderPage(ps.n);
    }
  }, delay);
}

function goToPage(n, smooth){
  const doc = pdfView.doc;
  if(!doc) return;
  const target = Math.min(Math.max(1, n), doc.numPages);
  const ps = pdfView.pages[target - 1];
  const body = $('#readerBody');
  if(!ps || !body) return;
  pdfView.current = target;
  renderPage(target);
  body.scrollTo({ top: Math.max(0, ps.wrap.offsetTop - 8), behavior: smooth ? 'smooth' : 'auto' });
  updateReaderChrome();
  rememberPosition();
  syncReaderSidePage();
}

function syncCurrentPage(){
  if(!pdfView.doc || !pdfView.pages.length) return;
  const body = $('#readerBody');
  const mark = body.scrollTop + Math.min(body.clientHeight * 0.4, 320);
  let cur = 1;
  pdfView.pages.forEach(function(ps){
    if(ps.wrap.offsetTop <= mark) cur = ps.n;
  });
  if(cur !== pdfView.current){
    pdfView.current = cur;
    updateReaderChrome();
    rememberPosition();
    syncReaderSidePage();
  }
}

/* 换页只更新侧栏顶部的页码，不重绘整块面板——否则输入框会被打断 */
function syncReaderSidePage(){
  const el = $('#readerSide .rs-kicker');
  if(!el) return;
  const total = pdfView.doc ? pdfView.doc.numPages : 0;
  el.textContent = pdfView.doc
    ? '正在读 · 第 ' + (pdfView.current || 1) + (total ? ' / ' + total : '') + ' 页'
    : '没有托管 PDF · 只能凭标题和摘要打标';
}

function readerFitScale(rotation = pdfView.rotation){
  const body = $('#readerBody');
  const style = getComputedStyle(body);
  const available = body.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight);
  const {page} = pdfView.pages[0];
  const {width} = page.getViewport({scale:1, rotation:(page.rotate + rotation) % 360});
  return Math.max(0.3, Math.min(3, available / width));
}

function resizePdfPages(scale, rotation, pointer, renderDelay = 0){
  if(scale === pdfView.scale && rotation === pdfView.rotation){
    updateReaderChrome();
    return;
  }
  const body = $('#readerBody');
  const bounds = body.getBoundingClientRect();
  const x = pointer ? pointer.x : bounds.left + body.clientWidth / 2;
  const y = pointer ? pointer.y : bounds.top + body.clientHeight / 2;
  const mark = body.scrollTop + y - bounds.top;
  const ps = pdfView.pages.find(page => page.wrap.offsetTop + page.wrap.offsetHeight >= mark)
    || pdfView.pages[pdfView.pages.length - 1];
  const rect = ps.wrap.getBoundingClientRect();
  const oldViewport = ps.viewport;
  const offsetX = Math.max(0, Math.min(rect.width, x - rect.left));
  const offsetY = Math.max(0, Math.min(rect.height, y - rect.top));
  const pdfPoint = oldViewport.convertToPdfPoint(
    offsetX / rect.width * oldViewport.width, offsetY / rect.height * oldViewport.height);

  pdfView.scale = scale;
  pdfView.rotation = rotation;
  pdfView.pages.forEach(layoutPdfPage);

  // 将同一个 PDF 坐标留在原来的屏幕位置。
  const nextRect = ps.wrap.getBoundingClientRect();
  const [pageX, pageY] = ps.viewport.convertToViewportPoint(...pdfPoint);
  body.scrollLeft += nextRect.left + pageX / ps.viewport.width * nextRect.width - rect.left - offsetX;
  body.scrollTop += nextRect.top + pageY / ps.viewport.height * nextRect.height - rect.top - offsetY;
  updateReaderChrome();
  schedulePdfRender(renderDelay);
}

function zoomBy(factor, pointer){
  if(!pdfView.pages.length) return;
  const base = pdfView.fitScale;
  const relative = Math.min(4, Math.max(0.25, pdfView.scale / base * factor));
  pdfView.fit = false;
  resizePdfPages(base * relative, pdfView.rotation, pointer, pointer ? 120 : 0);
}

function fitWidth(){
  if(!pdfView.pages.length) return;
  pdfView.fit = true;
  pdfView.fitScale = readerFitScale();
  resizePdfPages(pdfView.fitScale, pdfView.rotation);
}

function rotatePage(){
  if(!pdfView.pages.length) return;
  const rotation = (pdfView.rotation + 90) % 360;
  const relative = pdfView.scale / pdfView.fitScale;
  pdfView.fitScale = readerFitScale(rotation);
  resizePdfPages(pdfView.fitScale * relative, rotation);
}

$('#readerBody').addEventListener('wheel', function(event){
  if(!event.ctrlKey || !event.deltaY) return;
  event.preventDefault();
  if(!pdfView.pages.length) return;
  const units = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? this.clientHeight : 1;
  pdfView.wheelDelta += event.deltaY * units;
  pdfView.wheelPointer = {x:event.clientX, y:event.clientY};
  if(pdfView.wheelFrame) return;
  pdfView.wheelFrame = requestAnimationFrame(function(){
    const delta = Math.max(-300, Math.min(300, pdfView.wheelDelta));
    pdfView.wheelFrame = pdfView.wheelDelta = 0;
    if(delta) zoomBy(Math.exp(-delta * 0.0014), pdfView.wheelPointer);
  });
}, {passive:false});

async function attachPdfTo(itemId, file){
  if(!file) return;
  if(!apiOnline){ toast('未连接本地服务，无法上传 PDF'); return; }
  if(!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf'){ toast('只接受 PDF 文件'); return; }
  const fd = new FormData();
  fd.append('file', file, file.name);
  setReaderLoading(true, '正在上传…');
  try{
    const res = await fetch('/api/items/' + encodeURIComponent(itemId) + '/file', { method:'POST', body: fd });
    if(!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    setReaderLoading(false);
    if(data.status === 'duplicate' && data.item_id && data.item_id !== itemId){
      toast('这个文件已经在库里的另一条上，已跳过去');
      renderAll();
      openReader();
      return;
    }
    await refreshPapers();
    const p = PAPERS.find(function(x){ return x.id === itemId; });
    if(!p || !p.hasFile){ toast('上传后没有找到这个文件'); return; }
    loadPdf(p);
  }catch(err){
    setReaderLoading(false);
    toast('上传失败，请检查本地服务是否在运行');
  }
}
