function msgHTML(m){
  if(m.role === 'user'){
    return '<div class="msg user"><div class="bubble">' + esc(m.text) + '</div></div>';
  }
  if(m.pending){
    return '<div class="msg ai"><div class="typing"><i></i><i></i><i></i></div></div>';
  }
  const cites = m.cites || [];
  const citesHTML = cites.length
    ? '<div class="cites">' + cites.map(function(c, i){
        const itemId = c.itemId || c;
        const found = PAPERS.find(x => x.id === itemId);
        const title = c.title || (found ? found.title : itemId);
        const page = c.page || 0;
        return '<button data-act="cite" data-id="' + esc(itemId) + '" data-page="' + page + '"' +
          ' title="' + (page > 0 ? '打开第 ' + page + ' 页' : '打开这条文献') + '">' +
          '<b>' + (i + 1) + '</b><span class="ct">' + esc(title) + '</span>' +
          (page > 0 ? '<span class="cp">p.' + page + '</span>' : '') +
        '</button>';
      }).join('') + '</div>'
    : '';
  if(m.error){
    return '<div class="msg ai">' +
      '<div class="aimeta">AI · 出错</div>' +
      '<div class="aitext aierr">' + esc(m.text) + '</div>' +
    '</div>';
  }
  return '<div class="msg ai">' +
    '<div class="aimeta">AI · 范围 ' + (m.n || 0) + ' 篇' +
      (cites.length ? ' · ' + cites.length + ' 条引用' : '') +
      (m.model ? ' · ' + esc(m.model) : '') + '</div>' +
    '<div class="aitext">' + fmtAI(m.text, cites) + '</div>' +
    citesHTML +
  '</div>';
}

function fmtAI(text, cites){
  let h = esc(text || '');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\[(\d+)\]/g, function(match, i){
    const citation = cites[parseInt(i, 10) - 1];
    if(!citation) return match;
    const itemId = citation.itemId || citation;
    const page = citation.page || 0;
    return '<button class="cite" data-act="cite" data-id="' + esc(itemId) + '" data-page="' + page + '">[' + i + ']</button>';
  });
  h = h.replace(/\n/g, '<br>');
  return h;
}

/* ============================================================
   AI 标签建议（按需调用模型，只在阅读器侧栏出现）
   ============================================================ */
function readerSuggestionHTML(p){
  const box = state.sugg[p.id];
  if(!state.ai.hasKey){
    return '<div class="rs-sugempty">接上模型后才能生成候选。' +
      '<button class="linkbtn" data-act="open-settings">配置模型</button></div>';
  }
  if(!box){
    return '<div class="rs-sugempty">还没有生成。' +
      '<button class="btn tiny" data-act="gen-sug" data-id="' + esc(p.id) + '">用模型提候选</button></div>';
  }
  if(box.status === 'loading'){
    return '<div class="rs-sugempty">正在读摘要并生成…</div>';
  }
  if(box.status === 'error'){
    return '<div class="rs-sugempty warn">' + esc(box.message || '生成失败') +
      ' <button class="linkbtn" data-act="gen-sug" data-id="' + esc(p.id) + '">重试</button></div>';
  }

  const onPaper = new Set(p.tags.topic);
  const items = (box.items || []).filter(function(s){
    return !state.dismissed.has(p.id + '|topic|' + s.name);
  });
  if(!items.length){
    return '<div class="rs-sugempty">没有新的候选。' +

  return items.map(function(s){
    const has = onPaper.has(s.name);
    return '<div class="rs-sug">' +
      '<div class="rs-sug-name">' + esc(s.name) +
        (s.reason ? '<span>' + esc(s.reason) + '</span>' : '') +

      '<div class="rs-sug-act">' +
        '<button class="btn tiny primary" data-act="accept-sug" data-facet="topic" data-value="' + esc(s.name) + '"' +
          (has ? ' disabled' : '') + '>' + (has ? '已在这篇' : '采纳') + '</button>' +
        '<button class="btn tiny" data-act="dismiss-sug" data-facet="topic" data-value="' + esc(s.name) + '">忽略</button>' +
      '</div>' +

  }).join('') +
  '<div class="rs-sugempty"><button class="linkbtn" data-act="gen-sug" data-id="' + esc(p.id) + '">重新生成</button></div>';
}

async function loadSuggestions(itemId){
  if(!apiOnline){ toast('未连接本地服务，无法生成建议'); return; }
  if(!state.ai.hasKey){ toast('先配置模型 Key'); openSettings(); return; }
  const p = PAPERS.find(x => x.id === itemId);
  if(!p) return;

  state.sugg[itemId] = { status:'loading', items:[] };
  renderDetail();
  if(state.readerOpen) renderReaderSide();

  try{
    const res = await fetch('/api/items/' + encodeURIComponent(itemId) + '/suggest-tags', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ limit: 4 })
    });
    const data = await res.json().catch(function(){ return {}; });
    if(!res.ok){
      throw new Error(typeof data.detail === 'string' ? data.detail : ('生成失败（' + res.status + '）'));
    }
    // 重新生成时，把之前忽略的也放回来
    Array.from(state.dismissed).forEach(function(key){
      if(key.indexOf(itemId + '|') === 0) state.dismissed.delete(key);
    });
    state.sugg[itemId] = {
      status: 'ready',
      items: Array.isArray(data.tags) ? data.tags : [],
      model: data.model || ''
    };
  }catch(err){
    state.sugg[itemId] = {
      status: 'error',
      items: [],
      message: String((err && err.message) || err)
    };
  }finally{
    renderDetail();
    if(state.readerOpen) renderReaderSide();
  }
}

/* AI 回答由后端 /api/ai/ask 生成 */

async function send(text){
  if(state.busy) return;
  const scope = aiScope();
  if(!scope.length) return;
  if(!state.ai.hasKey){ toast('先配置模型 Key'); openSettings(); return; }

  state.chat.push({role:'user', text:text});
  state.chat.push({role:'ai', pending:true});
  state.busy = true;
  state.pendingScroll = 'bottom';
  renderDetail();

  try{
    const res = await fetch('/api/ai/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        question: text,
        itemIds: scope.map(p => p.id),
        conversationId: state.conversationId
      })
    });
    const data = await res.json().catch(function(){ return {}; });
    if(!res.ok){
      const detail = typeof data.detail === 'string' ? data.detail : ('请求失败（' + res.status + '）');
      throw new Error(detail);
    }
    state.conversationId = data.conversationId || null;
    rememberConversation();
    let answer = String(data.answer || '');
    let citations = Array.isArray(data.citations) ? data.citations : [];
    // 只保留回答里实际引用的来源，并按首次出现重新编号
    const used = [];
    answer = answer.replace(/\[(\d+)\]/g, function(match, digit){
      const index = parseInt(digit, 10) - 1;
      if(index < 0 || index >= citations.length) return match;
      let position = used.indexOf(index);
      if(position === -1){
        used.push(index);
        position = used.length - 1;
      }
      return '[' + (position + 1) + ']';
    });
    if(used.length){
      citations = used.map(function(index){ return citations[index]; });
    }
    state.chat.pop();
    state.chat.push({
      role: 'ai',
      text: answer,
      cites: citations,
      n: data.scopeCount || scope.length,
      model: data.model || ''
    });
  }catch(err){
    state.chat.pop();
    state.chat.push({
      role: 'ai',
      error: true,
      text: String((err && err.message) || err)
    });
  }finally{
    state.busy = false;
    state.pendingScroll = 'bottom';
    renderDetail();
    const input = $('#chatInput');
    if(input) input.focus();
  }
}

function citeJump(itemId, page){
  selectPaper(itemId);
  openReader();
  let tries = 0;
  (function step(){
    tries++;
    if(!state.readerOpen) return;
    if(pdfView.itemId === itemId && pdfView.pages.length){
      goToPage(page, false);
      return;
    }
    if(tries < 120) setTimeout(step, 100);
  })();
}

async function restoreConversation(){
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('colophon:conv') || 'null'); }catch(err){ saved = null; }
  if(!saved || !saved.id) return;
  const current = (state.aiExpand ? PAPERS : getFiltered()).map(p => p.id).sort().join(',');
  if(saved.ids !== current) return;
  try{
    const res = await fetch('/api/conversations/' + encodeURIComponent(saved.id));
    if(!res.ok) return;
    const data = await res.json();
    const messages = (data.messages || []).filter(m => m.role !== 'system');
    if(!messages.length) return;
    state.conversationId = saved.id;
    state.chat = messages.map(function(m){
      if(m.role === 'assistant'){
        return {
          role: 'ai',
          text: m.content,
          cites: m.citations || [],
          n: (data.scope && data.scope.count) || 0,
          model: m.model || ''
        };
      }
      return { role: 'user', text: m.content };
    });
  }catch(err){
    /* 恢复失败就当没有历史 */
  }
}

function batchProgressText(batch){
  return '补全中 ' + batch.done + '/' + batch.total;
}

async function fetchAllMissing(){
  if(state.batchProgress) return;
  if(!apiOnline){ toast('未连接本地服务，无法抓取元数据'); return; }
  const papers = getFiltered().filter(p => p.needsReview);
  if(!papers.length) return;
  const batch = {done:0, total:papers.length};
  state.batchProgress = batch;
  renderListbar(papers);
  let completed = 0;
  let attempted = 0;
  let summary;
  try{
    for(const {id} of papers){
      const res = await fetch('/api/import/queue/fetch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({itemId:id, limit:1})
      });
      if(!res.ok) throw new Error('http ' + res.status);
      const data = await res.json();
      completed += data.completed ?? data.results.filter(result => result.complete).length;
      attempted += data.total;
      batch.done++;
      const progress = $('#batchProgress');
      if(progress) progress.textContent = batchProgressText(batch);
    }
    summary = '已补全 <b>' + completed + '</b> / ' + attempted + ' 篇' +
      (batch.total > attempted ? '，跳过 ' + (batch.total - attempted) + ' 篇' : '') +
      (attempted > completed ? '，其余仍待补全' : '');
  }catch(err){
    summary = '批量抓取中断，已处理 ' + batch.done + '/' + batch.total + ' 篇，请稍后再试';
  }finally{
    await refreshPapers();
    state.batchProgress = null;
    renderListbar(getFiltered());
  }
  toast(summary);
}

function renderCleanModal(){
  const modal = $('#modal');
  const s = state.clean || { loading: true };
  modal.classList.add('open');

  if(s.loading){
    modal.innerHTML = '<div class="modal-card clean-card"><div class="mhead"><div>' +
      '<h3>检查作者 / 单位</h3><p>正在扫一遍词表…</p></div></div></div>';
    return;
  }
  if(s.error){
    modal.innerHTML = '<div class="modal-card clean-card"><div class="mhead"><div>' +
      '<h3>检查作者 / 单位</h3><p style="color:var(--warn)">' + esc(s.error) + '</p></div>' +
      '<button class="btn icon" data-act="close-clean" title="关闭">✕</button></div>' +
      '<div class="metafoot"><button class="btn" data-act="open-clean">重试</button></div></div>';
    return;
  }

  const picks = s.picks;
  const renameN = s.data.authors.filter(a => picks[a.id] === 'rename').length
    + s.data.orgs.filter(o => picks[o.id] === 'rename').length;
  const dropN = s.data.authors.filter(a => picks[a.id] === 'drop').length
    + s.data.orgs.filter(o => picks[o.id] === 'drop').length;

  const row = function(kind, it){
    const pick = picks[it.id] || 'skip';
    const isAuto = it.action === 'auto';
    let target = '';
    if(pick === 'rename'){
      target = '<span class="carrow">→</span><span class="cnew">' +
        (it.id === 'custom' ? '' : esc(it.suggest || '')) + '</span>';
    }
    return '<div class="crow' + (pick === 'skip' ? ' skipped' : '') + '" style="--tone:' +
        (it.action === 'drop' ? 'var(--warn)' : (isAuto ? 'var(--ok)' : 'var(--muted)')) + '">' +
      '<span class="cbadge' + (it.action === 'drop' ? ' warn' : '') + '">' +
        (it.action === 'drop' ? '非人名' : (isAuto ? '自动' : '待确认')) + '</span>' +
      '<div class="cname"><span class="cold">' + esc(it.name) + '</span>' + target +
        '<div class="cwhy">' + esc(it.reason || '') + ' · ' + it.count + ' 篇</div>' +
      '</div>' +
      '<div class="cact">' +
        (it.action === 'drop'
          ? '<button class="tbtn' + (pick === 'drop' ? ' on' : '') + '"' +
              ' data-act="clean-pick" data-id="' + it.id + '" data-pick="drop">删掉</button>'
          : '<button class="tbtn' + (pick === 'rename' ? ' on' : '') + '"' +
              ' data-act="clean-pick" data-id="' + it.id + '" data-pick="rename">改为' + esc(it.suggest) + '</button>' +
            '<button class="tbtn' + (pick === 'drop' ? ' on' : '') + '"' +
              ' data-act="clean-pick" data-id="' + it.id + '" data-pick="drop">删掉</button>') +
        '<button class="tbtn' + (pick === 'skip' ? ' on' : '') + '"' +
          ' data-act="clean-pick" data-id="' + it.id + '" data-pick="skip">保留</button>' +
      '</div>' +
    '</div>';
  };

  const sect = function(title, list, kind, hint){
    return '<section class="csec">' +
      '<div class="slabel">' + title + ' <span class="hint">' + hint + '</span></div>' +
      (list.length
        ? list.map(it => row(kind, it)).join('')
        : '<p class="hintline">没有发现可疑写法。</p>') +
    '</section>';
  };

  modal.innerHTML = '<div class="modal-card clean-card">' +
    '<div class="mhead">' +
      '<div><h3>检查作者 / 单位</h3>' +
        '<p>共 ' + s.data.totals.authors + ' 位作者、' + s.data.totals.orgs + ' 个单位；' +
          '发现 ' + (s.data.authors.length + s.data.orgs.length) + ' 条可疑，' +
          '将改 ' + renameN + ' 条、删 ' + dropN + ' 条。写库前请逐条看。</p></div>' +
      '<button class="btn icon" data-act="close-clean" title="关闭">✕</button>' +
    '</div>' +
    '<div class="clean-policy">' +
      '<b>规则</b>「自动」= 去上标 / 修重音 / 解实体，可直接采纳；' +
      '「待确认」= 尾部单字母去掉后对不上任何已有作者，默认不动；' +
      '「非人名」= 邮箱、机构、地名与正文片段。' +
    '</div>' +
    sect('作者', s.data.authors, 'author', '按可疑程度排列，可逐条改判') +
    sect('单位', s.data.orgs, 'org', '多为 HTML 实体与截断') +
    '<div class="metafoot">' +
      '<span class="mnote-inline">只改你确认过的条目，其余一律不碰</span>' +
      '<button class="btn primary" data-act="clean-apply" style="margin-left:auto">应用 ' +
        (renameN + dropN) + ' 条</button>' +
    '</div>' +
  '</div>';
}

async function openClean(){
  state.modalMode = 'clean';
  state.modalOpen = true;
  state.clean = { loading: true };
  renderModal();
  try{
    const res = await fetch('/api/clean/scan', {cache:'no-store'});
    if(!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    const picks = {};
    // 默认只预选「自动」与「非人名」；「待确认」一律默认保留。
    // 注意：action 是 auto/drop/review，pick 是 rename/drop/skip，两者不是同一个词。
    data.authors.concat(data.orgs).forEach(function(it){
      if(it.action === 'drop') picks[it.id] = 'drop';
      else if(it.action === 'auto' && it.suggest) picks[it.id] = 'rename';
      else picks[it.id] = 'skip';
    });
    state.clean = { loading:false, data:data, picks:picks };
  }catch(err){
    state.clean = { loading:false, error:'读取失败，请重试' };
  }
  renderModal();
}

async function applyClean(){
  const s = state.clean;
  if(!s || !s.data) return;
  const authors = s.data.authors
    .filter(it => s.picks[it.id] === 'rename' || s.picks[it.id] === 'drop')
    .map(it => ({ id: it.id, action: s.picks[it.id], value: it.suggest || '' }));
  const orgs = s.data.orgs
    .filter(it => s.picks[it.id] === 'rename' || s.picks[it.id] === 'drop')
    .map(it => ({ id: it.id, action: s.picks[it.id], value: it.suggest || '' }));
  if(!authors.length && !orgs.length){ toast('没有勾选任何改动'); return; }
  try{
    const res = await fetch('/api/clean/apply', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({authors: authors, orgs: orgs})
    });
    if(!res.ok) throw new Error('apply');
    const r = await res.json();
    await refreshPapers();
    state.modalMode = 'tags';
    state.clean = null;
    renderModal();
    toast('已改 ' + (r.authorsRenamed + r.orgsRenamed) + ' 条、删 ' +
      (r.authorsDropped + r.orgsDropped) + ' 条，涉及 ' + r.itemsTouched + ' 篇');
  }catch(err){
    toast('应用失败，请重试');
  }
}

function toggleTerm(groupId, term){
  const filter = getGroupFilter(groupId,'any');
  const kind = groupKind(groupId);
  const key = Retrieval.termKey(kind,term);
  const i = filter.terms.findIndex(t => Retrieval.termKey(kind,t) === key);
  if(i >= 0) filter.terms.splice(i,1); else filter.terms.push(term);
  state.eval = null;
  state.pendingScroll = 'top';
  renderAll();
}

function toggleYear(year){
  if(Number.isInteger(year)) toggleTerm(Retrieval.YEAR_GROUP,year);
}

function renderFilterChange(focusId){
  state.eval = null;
  state.pendingScroll = 'top';
  renderAll();
  if(focusId) document.getElementById(focusId)?.focus({preventScroll:true});
}

function parseFilterYear(value){
  const text = value.trim();
  return /^[0-9]{1,4}$/.test(text) ? Number(text) : null;
}

function updateYearRange(){
  const draft = state.yearDraft;
  const from = parseFilterYear(draft.yearFrom), to = parseFilterYear(draft.yearTo);
  const filter = getGroupFilter(Retrieval.YEAR_GROUP);
  const current = filter.terms.find(t => t.range);
  const valid = from !== null && to !== null && from <= to;
  if(valid ? current && current.range[0] === from && current.range[1] === to : !current) return;

  filter.terms = filter.terms.filter(Number.isInteger);
  if(valid) filter.terms.unshift({range:[from,to]});
  renderFilterChange();
}

function confirmSingleYear(){
  const draft = state.yearDraft;
  const year = parseFilterYear(draft.yearSingle);
  if(year === null){ toast('请输入 0 到 9999 之间的整数年份'); $('#yearSingle').focus(); return; }
  const filter = getGroupFilter(Retrieval.YEAR_GROUP);
  if(!filter.terms.includes(year)) filter.terms.push(year);
  draft.yearSingle = '';
  renderFilterChange('yearSingle');
}

function removeSingleYear(year){
  const filter = getGroupFilter(Retrieval.YEAR_GROUP);
  filter.terms = filter.terms.filter(t => t !== year);
  renderFilterChange(state.yearDraft.adding ? 'yearSingle' : 'yearSingleAdd');
}

function addMetadataSelection(input){
  const groupId = input.dataset.metadataSearch;
  const value = input.value.trim();
  if(!value) return;
  const key = Retrieval.termKey(Retrieval.META,value);
  const option = groupEval(groupId).options.find(o => o.key === key && !o.selected);
  if(!option) return;
  state.metadataDraft[groupId] = '';
  getGroupFilter(groupId).terms.push(option.term);
  renderFilterChange();
}

const saveTimers = {};
const pendingPatch = {};

function scheduleSave(itemId, patch){
  if(!apiOnline) return;
  pendingPatch[itemId] = Object.assign(pendingPatch[itemId] || {}, patch);
  clearTimeout(saveTimers[itemId]);
  saveTimers[itemId] = setTimeout(function(){
    const body = pendingPatch[itemId];
    delete pendingPatch[itemId];
    delete saveTimers[itemId];
    fetch('/api/items/' + encodeURIComponent(itemId), {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body)
    }).then(function(res){
      if(!res.ok) throw new Error('http ' + res.status);
    }).catch(function(){ toast('保存失败，改动只在本页'); });
  }, 600);
}

async function addTag(facet, value, itemId, opts){
  const p = itemId ? PAPERS.find(x => x.id === itemId) : PAPERS.find(x => x.id === state.paperId);
  if(!p || !value) return false;
  value = value.trim();
  if(!value) return false;
  if(p.tags[facet].indexOf(value) !== -1){
    toast('这篇已经有「' + esc(value) + '」了');
    return false;
  }

  let target = null;
  if(facet === 'topic'){
    if(opts && opts.keepGroup){
      // 快捷标签 / AI 建议采纳：库里已有的标签就保持它原来的组归属，
      // 新标签落未分组（与 retrieval-model §5 一致）。
      target = { id:null };
    } else {
      target = groupFrom();
      if(target === undefined){
        toast('新组还没名字。填好组名再按回车，或点「取消」回到选组。');
        const nameInput = $('#rtNewName');
        if(nameInput) nameInput.focus();
        return false;
      }
      if(target === null){
        toast('还没选定组，请先选一个组或新建组。');
        return false;
      }
    }
  }

  // 先落本地，界面立刻有反馈
  if(facet === 'year') p.tags.year = [value];
  else p.tags[facet].push(value);

  if(!apiOnline){
    renderAll();
    toast('未连接本地服务，改动只在本页');
    return true;
  }

  try{
    const res = await fetch('/api/items/' + encodeURIComponent(p.id) + '/tags', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        facet: facet,
        name: value,
        group_id: target.id || undefined,
        group_name: target.name || undefined
      })
    });
    if(!res.ok) throw new Error('save');
    // 新建组成功后，面板切回选组模式，并把新组设为当前组
    if(target.isNew && target.name){
      await refreshGroups();
      const created = (state.groups || []).find(function(g){ return g.name === target.name; });
      if(created){
        state.groupSel = created.id;
        rememberGroup(created.id);
      }
      setNewGroupMode(false);
    }
    await refreshPapers();
    await refreshGroups();
    renderAll();
    if(state.readerOpen) renderReaderSide();
    toast('已加入 <b>' + labelOf(facet) + '：' + esc(value) + '</b>' +
      (target.isNew && target.name ? '，新组「' + esc(target.name) + '」' : ''));
    return true;
  }catch(err){
    // 落库失败：把本地加上的撤回，界面不能显示一条没存住的数据
    if(facet === 'year') p.tags.year = [];
    else p.tags[facet] = p.tags[facet].filter(function(t){ return t !== value; });
    renderAll();
    if(state.readerOpen) renderReaderSide();
    toast('保存失败，改动已撤回');
    return false;
  }
}

/* ---------- 组 ---------- */
const deletedTagIds = new Set();

async function refreshGroups(){
  if(!apiOnline) return;
  try{
    const data = await fetchTags();
    state.groups = (data.groups || []).map(g => {
      const tags = g.tags.filter(t => !deletedTagIds.has(t.id));
      return {...g, tags, count:tags.length};
    });
    state.unfiled = (data.unfiled || []).filter(t => !deletedTagIds.has(t.id));
    const validTags = new Set(state.groups.flatMap(g => (g.tags || []).map(t => t.id)).concat(state.unfiled.map(t => t.id)));
    state.tagQuery.include = state.tagQuery.include.filter(id => validTags.has(id));
    state.tagQuery.exclude = state.tagQuery.exclude.filter(id => validTags.has(id));
    const valid = new Set([Retrieval.STAR_GROUP,Retrieval.UNFILED].concat(METADATA_FACETS.map(f => '@' + f.key),state.groups.map(g => g.id)));
    Object.keys(state.groupFilters).forEach(id => { if(!valid.has(id)) delete state.groupFilters[id]; });
    state.eval = null;
    // 记住的组被删了：清掉，回落到未分组，不把标签静默塞进别的组
    if(state.groupSel && !state.groups.some(g => g.id === state.groupSel)){
      state.groupSel = null;
    }
    if(!state.groupSel) state.groupSel = loadGroupPref();
  }catch(err){ /* 组读不到不影响主流程 */ }
}

async function moveTagGroup(dialog){
  if(dialog.busy || dialog.stale) return;
  if(!apiOnline){ toast('未连接本地服务'); return; }
  dialog.busy = true;
  dialog.message = '';
  renderModal();
  try{
    const res = await fetch('/api/groups/assign', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        tag_id:dialog.tagId,
        group_id:dialog.targetId === Retrieval.UNFILED ? null : dialog.targetId,
        expected_group_id:dialog.sourceId === Retrieval.UNFILED ? null : dialog.sourceId
      })
    });
    if(res.status === 409 || res.status === 404 || res.status === 400){
      dialog.stale = true;
      dialog.message = '标签或分组已变化，请取消后重新选择。';
      await refreshGroups();
      renderAll();
      return;
    }
    if(!res.ok) throw new Error('assign');

    // 服务已保存：即使随后读库失败，也显示这次已确认的归属。
    const hit = findTagById(dialog.tagId);
    const target = findGroupDef(dialog.targetId);
    if(hit && target && (hit.group?.id ?? Retrieval.UNFILED) !== target.id){
      const sourceTags = hit.group?.tags ?? state.unfiled;
      sourceTags.splice(sourceTags.indexOf(hit.tag), 1);
      if(hit.group) hit.group.count = sourceTags.length;
      target.tags.push(hit.tag);
      if(dialog.targetId !== Retrieval.UNFILED) target.count = target.tags.length;
    }
    await refreshGroups();
    renderAll();
    if(state.readerOpen) renderReaderSide();
    dialog.busy = false;
    closeDialog();
    toast('已将「' + esc(dialog.name) + '」移到「' + esc(dialog.targetName) + '」');
  }catch(err){
    dialog.message = '移动失败，请重试。';
  }finally{
    dialog.busy = false;
    if(state.dialog === dialog) renderModal();
  }
}

const deletedPaperIds = new Set();

async function deletePaper(dialog){
  if(dialog.busy) return;
  dialog.busy = true;
  dialog.message = '';
  renderModal();
  const id = dialog.itemId;
  let data;
  try{
    const res = await fetch('/api/items/' + encodeURIComponent(id), {
      method:'DELETE', headers:{'X-Colophon-Delete':'permanent'}
    });
    data = await res.json();
    if(!(res.ok && data?.ok === true) && !(res.status === 404 && data?.detail === 'item not found')){
      if(res.status === 403) dialog.message = '请重启 Colophon 后重新确认删除。';
      else dialog.message = res.status === 409 && typeof data?.detail === 'string' ? data.detail : '删除失败，请重试。';
    }
  }catch(err){
    dialog.message = '删除失败，请重试。';
  }
  dialog.busy = false;
  if(dialog.message){
    renderModal();
    return;
  }

  deletedPaperIds.add(id);
  clearTimeout(saveTimers[id]);
  delete saveTimers[id];
  delete pendingPatch[id];
  delete state.sugg[id];
  if(state.readerItemId === id) closeReader();
  try{ localStorage.removeItem('colophon:pos:' + id); }catch(err){ /* 隐私模式 */ }
  PAPERS = PAPERS.filter(p => p.id !== id);
  closeDialog();
  renderAll();
  $('#resultsTitle')?.focus({preventScroll:true});
  if(data.filesDeleted) toast('已删除文献及 PDF 副本');
  else toast(data.ok ? '已删除文献' : '这篇文献已不存在');
}

function closeDialog(){
  const dialog = state.dialog;
  if(dialog?.busy) return;
  if(dialog?.kind === 'delete-paper'){
    state.dialog = null;
    state.modalMode = null;
    state.modalOpen = false;
    renderModal();
    $('#app').inert = false;
    const summary = $('.paper[data-id="' + CSS.escape(dialog.itemId) + '"] .paper-menu summary');
    (summary || $('#resultsTitle'))?.focus({preventScroll:true});
    return;
  }
  const focusAction = isTagMoveDialog() ? 'pick-tag-group' : dialog?.kind === 'delete-tag' ? 'del-tag' : null;
  state.dialog = null;
  if(state.modalMode === 'group-dialog' || state.modalMode === 'tag-def'){
    state.modalMode = 'tags';
  }
  renderModal();
  if(dialog?.libraryScroll !== undefined){
    const card = $('.modal-card', $('#modal'));
    if(card) card.scrollTop = dialog.libraryScroll;
  }
  if(focusAction){
    const button = $('[data-act="' + focusAction + '"][data-id="' + CSS.escape(dialog.tagId) + '"]');
    (button || $('[data-act="close-lib"]'))?.focus({preventScroll:dialog?.libraryScroll !== undefined});
  }
}

async function deleteTag(dialog){
  if(dialog.busy) return;
  if(!apiOnline){ toast('未连接本地服务'); return; }
  dialog.busy = true;
  dialog.message = '';
  renderModal();
  try{
    const res = await fetch('/api/tags/' + encodeURIComponent(dialog.tagId) + '?expected_count=' + dialog.count, {method:'DELETE'});
    const data = await res.json().catch(() => null);
    if(res.status === 409 && Number.isInteger(data?.detail?.affectedItems)){
      dialog.count = data.detail.affectedItems;
      dialog.message = '关联文献数量已变化，请重新确认。';
      return;
    }
    if(res.status === 404 && data?.detail === 'Not Found'){
      dialog.message = '当前服务缺少删除标签接口，请重启 Colophon 后重试。';
      return;
    }
    const deleted = res.ok && data?.ok === true;
    if(!deleted && !(res.status === 404 && data?.detail === 'tag not found')) throw new Error('delete tag');

    const id = dialog.tagId;
    deletedTagIds.add(id);
    for(const group of state.groups){
      group.tags = group.tags.filter(t => t.id !== id);
      group.count = group.tags.length;
    }
    state.unfiled = state.unfiled.filter(t => t.id !== id);
    state.tagQuery.include = state.tagQuery.include.filter(tagId => tagId !== id);
    state.tagQuery.exclude = state.tagQuery.exclude.filter(tagId => tagId !== id);
    removeDeletedTagsFromPapers(PAPERS);
    renderAll();
    await refreshPapers();
    dialog.busy = false;
    closeDialog();
    toast(deleted ? '已删除标签 <b>' + esc(dialog.name) + '</b>' : '这个标签已不存在');
  }catch(err){
    dialog.message = '删除失败，请重试。';
  }finally{
    dialog.busy = false;
    if(state.dialog === dialog){
      renderModal();
      $('[data-act="dialog-cancel"]')?.focus();
    }
  }
}

async function deleteGroup(id, name){
  if(!apiOnline){ toast('未连接本地服务'); return; }
  try{
    const res = await fetch('/api/groups/' + encodeURIComponent(id), {method:'DELETE'});
    if(!res.ok) throw new Error('delete');
    const data = await res.json();
    await refreshGroups();
    await refreshPapers();
    renderModal();
    toast('已删除组 <b>' + esc(name) + '</b>' + (data.movedToUnfiled ? '，' + data.movedToUnfiled + ' 个标签退回未分组' : ''));
  }catch(err){
    toast('删除失败，请重试');
  }
}

async function setTagDefinition(tagId, definition){
  if(!apiOnline){ toast('未连接本地服务'); return; }
  try{
    const res = await fetch('/api/tags/' + encodeURIComponent(tagId) + '/definition', {
      method:'PATCH',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({definition: definition})
    });
    if(!res.ok) throw new Error('definition');
    await refreshGroups();
    renderModal();
    toast('已保存定义');
  }catch(err){
    toast('保存失败，请重试');
  }
}

async function commitNewGroup(){

  const name = input ? input.value.trim() : '';
  if(!name){
    toast('组名不能为空');
    if(input) input.focus();

function syncScope(ps){
  const ids = (state.aiExpand ? PAPERS : ps).map(p => p.id).sort().join(',');
  if(state.scopeIds !== undefined && state.scopeIds !== ids && state.chat.length && !state.busy){
    state.chat = [];
    state.conversationId = null;
    forgetConversation();
    toast('范围变了，已开始新对话');
  }
  state.scopeIds = ids;
}

function renderAll(){
  state.eval = null;
  const ps = getFiltered();
  const restoreDetailFocus = state.detailOpen && state.tab === 'info' &&
    !ps.some(p => p.id === state.paperId) && $('#detail').contains(document.activeElement);
  if(state.paperId !== null && !ps.some(p => p.id === state.paperId)){
    state.paperId = null;
    if(state.tab === 'info'){
      state.detailOpen = false;
      state.detailReturnTo = null;
      state.detailListScroll = null;
    }
  }
  syncScope(ps);
  renderGroups();
  renderActionBar();
  renderListbar(ps);
  renderList(ps);
  renderDetail();
  if(restoreDetailFocus) $('#resultsTitle')?.focus({preventScroll:true});
  if(state.modalOpen) renderModal();
}

/* 事件委托 */
document.addEventListener('click', function(e){
  for(const menu of $$('.paper-menu[open]')){
    if(!menu.contains(e.target)) menu.open = false;
  }
  if(e.target.id === 'modal'){
    if(state.modalMode === 'import') closeImportBrowser();
    else if(state.modalMode === 'delete-paper' || state.dialog?.kind === 'delete-tag' || isTagMoveDialog()) closeDialog();
    else { state.modalOpen = false; renderModal(); }
    return;
  }

  const el = e.target.closest('[data-act]');
  if(!el){
    const paper = e.target.closest('#papers .paper');
    if(paper && !e.target.closest('button, summary, details')) selectPaper(paper.dataset.id);
    return;
  }
  const act = el.dataset.act;

  if(act === 'toggle-mode'){
    const mode = el.dataset.mode;
    state.mode = mode === 'all' || state.mode === mode ? null : mode;
    $('#papers').scrollTop = 0;
    renderFilterChange(el.id);
    if(state.filtersOpen) setFiltersOpen(false);
  }
  else if(act === 'open-filters'){ setFiltersOpen(true); }
  else if(act === 'close-filters'){ setFiltersOpen(false); }
  else if(act === 'tag-toggle' || act === 'tag-exclude'){
    const options = el.closest('.qg-options');
    const scrollLeft = options?.scrollLeft;
    const scrollTop = options?.scrollTop;
    toggleTagQuery(el.dataset.id, act === 'tag-exclude');
    const button = options && document.getElementById(el.id);
    if(button){
      button.closest('.qg-options').scrollTo(scrollLeft,scrollTop);
      button.focus({preventScroll:true});
    }
  }
  else if(act === 'tag-join'){
    state.tagQuery.op = el.dataset.op === 'or' ? 'or' : 'and';
    renderFilterChange(el.id);
  }
  else if(act === 'year-toggle'){
    toggleYear(Number(el.dataset.year));
  }
  else if(act === 'metadata-toggle'){
    toggleTerm(el.dataset.group,el.dataset.value);
  }
  else if(act === 'apply-rescue'){
    const groupId = el.dataset.group;
    const kind = el.dataset.kind === 'remove-tag' ? Retrieval.TAG : groupKind(groupId);
    if(el.dataset.kind === 'include-unknown'){
      getGroupFilter(groupId,'any').includeUnknown = true;
    }else if(el.dataset.kind === 'remove-tag'){
      const field = el.dataset.field === 'exclude' ? 'exclude' : 'include';
      state.tagQuery[field] = state.tagQuery[field].filter(id => id !== el.dataset.key);
    }else{
      const filter = getGroupFilter(groupId,'any');
      const removedRange = kind === Retrieval.YEAR && filter.terms.some(t => t.range && Retrieval.termKey(kind,t) === el.dataset.key);
      filter.terms = filter.terms.filter(t => Retrieval.termKey(kind,t) !== el.dataset.key);
      if(removedRange){
        state.yearDraft.yearFrom = '';
        state.yearDraft.yearTo = '';
      }
    }
    state.eval = null;
    state.pendingScroll = 'top';
    renderAll();
  }
  else if(act === 'group-expand'){
    const id = el.dataset.group;
    if(state.expandedGroups.has(id)) state.expandedGroups.delete(id); else state.expandedGroups.add(id);
    renderGroups();
    $(`.qg-more[data-group="${CSS.escape(id)}"]`)?.focus();
  }
  else if(act === 'groups-expand'){
    state.groupsExpanded = !state.groupsExpanded;
    renderGroups();
    $('#groupsExpand')?.focus();
  }
  else if(act === 'reset-all'){ clearAll(); }
  else if(act === 'year-single-add'){
    state.yearDraft.adding = true;
    renderGroups();
    $('#yearSingle').focus();
  }
  else if(act === 'year-single-confirm'){ confirmSingleYear(); }
  else if(act === 'year-remove'){ removeSingleYear(Number(el.dataset.year)); }
  else if(act === 'close-detail'){ closeDetail(); }
  else if(act === 'jump-note'){ $('#paperNote')?.focus(); }
  else if(act === 'select'){ selectPaper(el.dataset.id); }
  else if(act === 'to-ai'){
    if(!state.detailOpen) state.detailListScroll = $('#papers').scrollTop;
    state.tab = 'ai';
    state.detailOpen = true;
    state.detailReturnTo = '.ask-btn';
    state.pendingScroll = 'bottom';
    updateDetailSelection();
    renderDetail();
    $('#detail .detail-close')?.focus({preventScroll:true});
  }
  else if(act === 'to-info'){
    if(state.paperId !== null) selectPaper(state.paperId);
  }
  else if(act === 'open-pdf'){ openReader(el.dataset.id); }
  else if(act === 'reader-close'){ closeReader(); }
  else if(act === 'reader-prev'){ goToPage(pdfView.current - 1, true); }
  else if(act === 'reader-next'){ goToPage(pdfView.current + 1, true); }
  else if(act === 'reader-zoom-in'){ zoomBy(1.15); }
  else if(act === 'reader-zoom-out'){ zoomBy(1 / 1.15); }
  else if(act === 'reader-fit'){ fitWidth(); }
  else if(act === 'reader-rotate'){ rotatePage(); }
  else if(act === 'reader-attach'){ $('#attachInput').click(); }
  else if(act === 'delete-paper'){
    const p = PAPERS.find(x => x.id === el.dataset.id);
    if(!p) return;
    el.closest('.paper-menu').open = false;
    openDeletePaperDialog(p);
  }
  else if(act === 'copy-cite'){
    const p = PAPERS.find(x => x.id === el.dataset.id);
    if(!p) return;
    const menu = el.closest('.paper-menu');
    if(menu){ menu.open = false; menu.querySelector('summary').focus({preventScroll:true}); }
    const year = (p.tags.year && p.tags.year[0]) || 'n.d.';
    const authors = (p.authors && p.authors.length) ? p.authors.join(', ') : '佚名';
    const venue = p.venue ? p.venue + ', ' : '';
    const text = authors + '. ' + p.title + '. ' + venue + year + '.';
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(function(){ toast('引用已复制'); }, function(){ toast('复制失败，可手动选择'); });
    } else { toast('当前浏览器不支持自动复制'); }
  }
  else if(act === 'accept-sug'){
    const p = readerPaper() || PAPERS.find(x => x.id === state.paperId);
    if(!p) return;
    const value = el.dataset.value;
    const box = state.sugg[p.id];
    if(box && box.items) box.items = box.items.filter(s => s.name !== value);
    // 采纳的标签按 §5 走「未分组」：AI 不替用户选组，要归组去标签库整理
    addTag('topic', value, p.id, {keepGroup:true});
  }
  else if(act === 'dismiss-sug'){
    const p = readerPaper() || PAPERS.find(x => x.id === state.paperId);
    if(!p) return;
    state.dismissed.add(p.id + '|topic|' + el.dataset.value);
    renderDetail();
    if(state.readerOpen) renderReaderSide();
  }
  else if(act === 'gen-sug' || act === 'regen-sug'){
    const id = el.dataset.id || (readerPaper() || {}).id || state.paperId;
    if(id) loadSuggestions(id);
  }
  else if(act === 'open-clean'){
    openClean();
    return;
  }
  else if(act === 'close-clean'){
    state.modalMode = 'tags';
    state.clean = null;
    renderModal();
  }
  else if(act === 'clean-pick'){
    const id = el.dataset.id;
    if(!state.clean || !state.clean.picks) return;
    state.clean.picks[id] = el.dataset.pick;
    renderModal();
  }
  else if(act === 'clean-apply'){
    applyClean();
    return;
  }
  else if(act === 'create-group'){
    commitNewGroup();
  }
  else if(act === 'new-group'){
    openLibraryDialog('create-group', null, '');
  }
  else if(act === 'cancel-new-group'){
    setNewGroupMode(false);
    renderAll();
    if(state.readerOpen) renderReaderSide();
  }
  /* ---------- 阅读器里的打标签 ---------- */
  else if(act === 'reader-tags'){
    state.readerTags = state.readerTags === false;
    renderReaderSide();
    if(state.readerTags){
      setTimeout(function(){ const i = $('#rtValue'); if(i) i.focus(); }, 0);
    }
  }
  else if(act === 'rt-add'){
    readerAddTag();
    return;
  }
  else if(act === 'rt-quick'){
    const p = readerPaper();
    if(!p || el.disabled) return;
    addTag('topic', el.dataset.name, p.id, {keepGroup:true}).then(function(){
      renderReaderSide();
    });
    return;
  }
  else if(act === 'rt-del-tag'){
    readerRemoveTag(el.dataset.name);
    return;
  }
  else if(act === 'rt-star'){
    const p = readerPaper();
    if(!p) return;
    p.starred = !p.starred;
    state.eval = null;
    renderReaderSide();
    renderAll();
    scheduleSave(p.id, {starred: p.starred});
    return;
  }
  else if(act === 'rt-edit-meta'){
    const p = readerPaper();
    if(!p) return;
    state.metaItemId = p.id;
    state.modalMode = 'meta';
    state.modalOpen = true;
    renderModal();
    return;
  }
  else if(act === 'rt-fetch-meta'){
    const p = readerPaper();
    if(p) fetchMeta(p.id);
  }
  else if(act === 'rt-open-lib'){
    closeReader();
    state.modalMode = 'tags';
    state.modalOpen = true;
    renderModal();
    return;
  }
  else if(act === 'quick'){ send(el.dataset.q); }
  else if(act === 'cite'){
    const page = parseInt(el.dataset.page || '0', 10) || 0;
    if(page > 0) citeJump(el.dataset.id, page);
    else selectPaper(el.dataset.id);
  }
  else if(act === 'expand-on'){ state.expandConfirm = true; renderDetail(); }
  else if(act === 'expand-cancel'){ state.expandConfirm = false; renderDetail(); }
  else if(act === 'expand-confirm'){
    state.expandConfirm = false;
    state.aiExpand = true;
    state.chat = [];
    state.conversationId = null;
    forgetConversation();
    renderAll();
    toast('范围已扩到<b>全库 ' + PAPERS.length + ' 篇</b>');
  }
  else if(act === 'expand-off'){
    state.aiExpand = false;
    state.chat = [];
    state.conversationId = null;
    forgetConversation();
    renderAll();
    toast('已缩回当前筛选');
  }
  else if(act === 'open-settings'){ openSettings(); }
  else if(act === 'close-settings'){ state.modalOpen = false; renderModal(); }
  else if(act === 'save-settings'){ saveAISettings(); }
  else if(act === 'clear-key'){ clearAIKey(); }
  else if(act === 'clear-chat'){
    state.chat = [];
    state.conversationId = null;
    forgetConversation();
    state.pendingScroll = 'top';
    renderDetail();
  }
  else if(act === 'open-lib'){ state.modalMode = 'tags'; state.modalOpen = true; renderModal(); }
  else if(act === 'close-lib'){ state.modalOpen = false; renderModal(); }
  else if(act === 'edit-meta'){ state.metaItemId = state.paperId; state.modalMode = 'meta'; state.modalOpen = true; renderModal(); }
  else if(act === 'fetch-meta'){ fetchMeta(el.dataset.id); }
  else if(act === 'close-meta'){ state.modalOpen = false; renderModal(); }
  else if(act === 'save-meta'){ saveMetaFields(); }
  else if(act === 'fetch-all'){ fetchAllMissing(); }
  else if(act === 'del-group'){
    openLibraryDialog('delete-group', el.dataset.id, el.dataset.name || '');
  }
  else if(act === 'del-tag'){
    openLibraryDialog('delete-tag', el.dataset.id, el.dataset.name, Number(el.dataset.count));
  }
  else if(act === 'pick-tag-group'){
    chooseTagDestination(el.dataset.id);
  }
  else if(act === 'tag-def'){
    openTagDefDialog(el.dataset.id, el.dataset.name || '');
  }
  else if(act === 'dialog-pick-group'){
    const dialog = state.dialog;
    if(dialog?.kind === 'pick-tag-group') confirmTagMove(dialog.tagId, dialog.sourceId, el.dataset.id);
  }
  else if(act === 'dialog-confirm'){
    if(state.modalMode === 'delete-paper'){
      deletePaper(state.dialog);
      return;
    }
    if(state.dialog?.kind === 'move-tag'){
      moveTagGroup(state.dialog);
      return;
    }
    if(state.dialog?.kind === 'delete-tag'){
      deleteTag(state.dialog);
      return;
    }
    if(state.dialog && state.dialog.kind === 'tag-def'){
      const input = $('#tagDefInput');
      const def = input ? input.value.trim() : '';
      const tagId = state.dialog.tagId;
      closeDialog();
      if(tagId) setTagDefinition(tagId, def);
      return;
    }
    if(state.dialog && state.dialog.kind === 'create-group'){
      const input = $('#libNewGroupName');
      const name = input ? input.value.trim() : '';
      if(!name){ toast('组名不能为空'); if(input) input.focus(); return; }
      closeDialog();
      createGroup(name).then(function(id){
        if(id) toast('已新建组 <b>' + esc(name) + '</b>');
        renderModal();
      });
      return;
    }
    const id = state.dialog ? state.dialog.groupId : null;
    const name = state.dialog ? state.dialog.name : '';
    closeDialog();
    if(id) deleteGroup(id, name);
  }
  else if(act === 'dialog-cancel'){
    closeDialog();
  }
  else if(act === 'import'){ openImportBrowser(el); }
  else if(act === 'import-close'){ closeImportBrowser(); }
  else if(act === 'import-roots'){ loadImportLocation(); }
  else if(act === 'import-up'){ loadImportLocation(importView.location?.parent); }
  else if(act === 'import-enter'){ loadImportLocation(el.dataset.path); }
  else if(act === 'import-all'){ toggleImportSelection(); }
  else if(act === 'import-selected'){ runLocalImport({paths:[...importView.selected]}); }
  else if(act === 'import-folder'){ runLocalImport({folder:importView.location?.path}); }
  else if(act === 'reconnect'){ boot(); }
  else if(act === 'theme'){
    const root = document.documentElement;
    root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
    paintThemeBtn();
  }
});

document.addEventListener('change', function(e){
  if(e.target.id === 'yearIncludeUnknown'){
    getGroupFilter(Retrieval.YEAR_GROUP).includeUnknown = e.target.checked;
    renderFilterChange('yearIncludeUnknown');
    return;
  }
  if(e.target.id === 'starFilter'){
    getGroupFilter(Retrieval.STAR_GROUP).terms = e.target.checked ? [{star:true}] : [];
    renderFilterChange('starFilter');
    return;
  }
  if(e.target.dataset.metadataSearch){
    // Choosing a suggestion commits while the input is still focused.
    if(document.activeElement === e.target) addMetadataSelection(e.target);
    return;
  }
  if(e.target.dataset.change === 'group-op'){
    const filter = getGroupFilter(e.target.dataset.group,'any');
    filter.op = e.target.value;
    state.eval = null;
    renderAll();
    return;
  }
  if(e.target.id === 'sort'){
    state.sort = e.target.value;
    renderAll();
  }
  if(e.target.id === 'rtGroup'){
    if(e.target.value === '__new'){
      setNewGroupMode(true);
      renderReaderSide();
      setTimeout(function(){ const i = $('#rtNewName'); if(i) i.focus(); }, 0);
      return;
    }
    state.groupSel = e.target.value || null;
    if(state.groupSel) rememberGroup(state.groupSel);
    renderReaderSide();
    setTimeout(function(){ const i = $('#rtValue'); if(i) i.focus(); }, 0);
  }
  if(e.target.matches('[data-import-check]') && !importView.importing){
    const path = e.target.dataset.path;
    if(e.target.checked) importView.selected.add(path);
    else importView.selected.delete(path);
    paintImportSelection();
  }
  if(e.target.id === 'attachInput'){
    const id = pdfView.itemId || state.paperId;
    const picked = e.target.files && e.target.files[0];
    e.target.value = '';
    if(id && picked) attachPdfTo(id, picked);
  }
});

document.addEventListener('input', function(e){
  if(e.target.matches('[data-note]')){
    const p = PAPERS.find(p => p.id === e.target.dataset.note);
    if(p){
      p.note = e.target.value;
      scheduleSave(p.id, {note_md:p.note});
    }
    return;
  }
  if(e.target.dataset.metadataSearch){
    state.metadataDraft[e.target.dataset.metadataSearch] = e.target.value;
    return;

  if(/^year(From|To|Single)$/.test(e.target.id)){
    state.yearDraft[e.target.id] = e.target.value;
    if(e.target.id !== 'yearSingle' && !e.isComposing) updateYearRange();
    return;
  }
  if(e.target.id === 'search'){
    state.q = e.target.value.trim();
    state.eval = null;
    state.pendingScroll = 'top';
    renderAll();
    return;
  }
});

document.addEventListener('compositionend', function(e){
  if(e.target.id === 'yearFrom' || e.target.id === 'yearTo'){
    state.yearDraft[e.target.id] = e.target.value;
    updateYearRange();
  }
});

let readerScrollRaf = 0;
$('#readerBody').addEventListener('scroll', function(){
  if(!state.readerOpen) return;
  if(readerScrollRaf) return;
  readerScrollRaf = requestAnimationFrame(function(){
    readerScrollRaf = 0;
    syncCurrentPage();
  });
});

document.addEventListener('keydown', function(e){
  if(e.target.dataset.metadataSearch && e.key === 'Enter'){
    if(e.isComposing || e.keyCode === 229) return;
    addMetadataSelection(e.target);
    return;
  }
  if(e.target.id === 'yearSingle'){
    if(e.isComposing || e.keyCode === 229) return;
    if(e.key === 'Enter'){
      e.preventDefault();
      confirmSingleYear();
      return;
    }
    if(e.key === 'Backspace' && e.target.value === ''){
      const singles = getGroupFilter(Retrieval.YEAR_GROUP).terms.filter(Number.isInteger);
      e.preventDefault();
      if(!e.repeat && singles.length) removeSingleYear(singles[singles.length - 1]);
      return;
    }
    if(e.key === 'Escape'){
      e.preventDefault();
      state.yearDraft.adding = false;
      state.yearDraft.yearSingle = '';
      renderGroups();
      $('#yearSingleAdd').focus();
      return;
    }
  }
  if(e.key === 'Escape' && state.modalOpen){
    if(e.isComposing || e.keyCode === 229) return;
    if(state.modalMode === 'import'){ closeImportBrowser(); return; }
    if(state.modalMode === 'delete-paper' || state.dialog?.kind === 'delete-tag' || isTagMoveDialog()){ closeDialog(); return; }
    state.modalOpen = false;
    renderModal();
    if(state.readerOpen) $('[data-act="rt-edit-meta"]')?.focus({preventScroll:true});
    return;
  }
  if(state.readerOpen && !state.modalOpen){
    // 正在侧栏输入时，Esc 只退出输入框，不关阅读器——否则打了一半的标签会丢
    if(e.key === 'Escape' && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
      document.activeElement.blur();
      return;
    }
    if(e.key === 'Escape'){ e.preventDefault(); closeReader(); return; }
    if(e.key === 'ArrowRight'){ e.preventDefault(); goToPage(pdfView.current + 1, true); return; }
    if(e.key === 'ArrowLeft'){ e.preventDefault(); goToPage(pdfView.current - 1, true); return; }
    if(e.key === '+' || e.key === '='){ e.preventDefault(); zoomBy(1.15); return; }
    if(e.key === '-'){ e.preventDefault(); zoomBy(1 / 1.15); return; }
    if((e.key === 't' || e.key === 'T') && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
      e.preventDefault();
      state.readerTags = state.readerTags === false;
      renderReaderSide();
      if(state.readerTags) setTimeout(function(){ const i = $('#rtValue'); if(i) i.focus(); }, 0);
      return;
    }
  }
  if(state.modalOpen && (state.modalMode === 'import' || state.modalMode === 'delete-paper' || state.dialog?.kind === 'delete-tag' || isTagMoveDialog())){
    if(e.key === 'Tab'){
      const controls = $$('#modal button:not(:disabled), #modal input:not(:disabled)');
      const first = controls[0], last = controls[controls.length - 1];
      if(!controls.length || !$('#modal').contains(document.activeElement) ||
          document.activeElement === (e.shiftKey ? first : last)){
        e.preventDefault();
        (e.shiftKey ? last : first)?.focus();
      }
    }
    return;
  }
  if(!state.modalOpen && !state.readerOpen && e.key === 'Escape' && !e.isComposing){
    const openMenu = $('.paper-menu[open]');
    if(openMenu){ openMenu.open = false; openMenu.querySelector('summary').focus({preventScroll:true}); return; }
    if(state.filtersOpen){ setFiltersOpen(false); return; }
    if(state.detailOpen){ closeDetail(); return; }
  }
  if(e.key === '/' && !state.readerOpen && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    e.preventDefault();
    $('#search').focus();
  }
  if(e.key === 'Enter' && e.target.id === 'rtValue'){
    e.preventDefault();
    readerAddTag();
    return;
  }
  if(e.key === 'Enter' && e.target.id === 'rtNewName'){
    e.preventDefault();
    commitNewGroup();
    return;
  }
  if(e.key === 'Enter' && e.target.id === 'libNewGroupName'){
    e.preventDefault();
    const input = $('#libNewGroupName');
    const name = input ? input.value.trim() : '';
    if(!name){ toast('组名不能为空'); return; }
    closeDialog();
    createGroup(name).then(function(id){
      if(id) toast('已新建组 <b>' + esc(name) + '</b>');
      renderModal();
    });
    return;
  }
});

/* ============================================================
   PDF 阅读器（只读，不做批注）
   ============================================================ */
const pdfView = {
  doc:null, itemId:null, scale:1, fitScale:1, fit:true, rotation:0,
  pages:[], io:null, current:1, seq:0
};

function setReaderLoading(on, text){
  const el = $('#readerLoading');
  if(!el) return;
  if(text) el.textContent = text;
  el.classList.toggle('show', !!on);
}

function updateReaderChrome(){
  const total = pdfView.doc ? pdfView.doc.numPages : 0;
  const page = $('#readerPage');
  if(page) page.textContent = total ? (pdfView.current + ' / ' + total) : '– / –';
  const z = $('#readerZoom');
  if(z){
    const pct = pdfView.fitScale ? Math.round(pdfView.scale / pdfView.fitScale * 100) : 100;
    z.textContent = pdfView.fit ? '适应宽度' : pct + '%';
  }
  const prev = $('[data-act="reader-prev"]');
  const next = $('[data-act="reader-next"]');
  if(prev) prev.disabled = !total || pdfView.current <= 1;
  if(next) next.disabled = !total || pdfView.current >= total;
}

function destroyPdf(){
  if(pdfView.io){ pdfView.io.disconnect(); pdfView.io = null; }
  pdfView.pages.forEach(function(ps){
    if(ps.task){ try { ps.task.cancel(); } catch(err) { /* 已结束 */ } }
  });
  if(pdfView.doc){
    try { pdfView.doc.destroy(); } catch(err) { /* 已在销毁 */ }
    pdfView.doc = null;
  }
  pdfView.pages = [];
  pdfView.current = 1;
  pdfView.itemId = null;
  pdfView.scale = 1;
  pdfView.fitScale = 1;
  pdfView.fit = true;
  pdfView.rotation = 0;
}

function rememberPosition(){
  if(!pdfView.itemId) return;
  try{ localStorage.setItem('colophon:pos:' + pdfView.itemId, String(pdfView.current)); }catch(err){ /* 隐私模式 */ }
}

function readerMissing(item){
  destroyPdf();
  pdfView.itemId = item.id;
  const body = $('#readerBody');
  body.classList.add('blank');
  body.innerHTML =
    '<div class="rmissing">' +
      '<div class="em">▤</div>' +
      '<p>这条还没有托管 PDF。<br>补上之后就能在这里读，原文件不会被移动。</p>' +
      '<button class="btn primary" data-act="reader-attach">选择 PDF 文件</button>' +
    '</div>';
  updateReaderChrome();
  setReaderLoading(false);
}

function openReader(itemId = state.paperId){
  const p = PAPERS.find(x => x.id === itemId);
  if(!p) return;
  state.readerOpen = true;
  state.readerGroupNew = false;
  state.readerItemId = p.id;
  $('#reader').hidden = false;
  $('#readerTitle').innerHTML =
    '<span>' + esc(p.title || '未命名') + '</span>' +
    (p.fileName ? '<span class="rname">' + esc(p.fileName) + '</span>' : '');
  const body = $('#readerBody');
  body.classList.remove('blank');
  body.innerHTML = '';
  renderReaderSide();

  if(!p.hasFile){ readerMissing(p); return; }
  if(pdfView.itemId !== p.id) loadPdf(p);

  if(state.readerTags !== false){
    setTimeout(function(){ const i = $('#rtValue'); if(i) i.focus(); }, 0);
  }
}

function closeReader(){
  if(!state.readerOpen) return;
  rememberPosition();
  state.readerOpen = false;
  state.readerGroupNew = false;
  state.readerItemId = null;
  $('#reader').hidden = true;
  const body = $('#readerBody');
  body.innerHTML = '';
  body.classList.remove('blank');
  setReaderLoading(false);
  destroyPdf();
  const side = $('#readerSide');
  if(side){ side.innerHTML = ''; }
}

async function loadPdf(p){
  destroyPdf();
  pdfView.itemId = p.id;
  const body = $('#readerBody');
  body.innerHTML = '';
  body.classList.remove('blank');
  setReaderLoading(true, '正在载入 PDF…');
  updateReaderChrome();

  if(!window.pdfjsLib){
    setReaderLoading(false);
    body.classList.add('blank');
    body.innerHTML = '<div class="rmissing"><div class="em">⚠</div><p>PDF 组件没有加载成功。<br>请确认 web/vendor/pdfjs/ 下的文件存在。</p></div>';
    return;
  }

  try{
    const doc = await pdfjsLib.getDocument({
      url: '/api/items/' + encodeURIComponent(p.id) + '/file'
    }).promise;
    if(!state.readerOpen || pdfView.itemId !== p.id){
      try { doc.destroy(); } catch(err) { /* 已关闭 */ }
      return;
    }
    pdfView.doc = doc;
    await buildPages();
    setReaderLoading(false);
    updateReaderChrome();
  }catch(err){
    setReaderLoading(false);
    body.classList.add('blank');
    body.innerHTML =
      '<div class="rmissing">' +
        '<div class="em">⚠</div>' +
        '<p>这个 PDF 打不开。文件可能已损坏，或已不在原来的位置。</p>' +
        '<button class="btn" data-act="reader-close">关闭</button>' +
      '</div>';
    updateReaderChrome();
  }
}

async function buildPages(){
  const doc = pdfView.doc;
  if(!doc) return;
  const body = $('#readerBody');
  const first = await doc.getPage(1);
  const base = first.getViewport({ scale:1, rotation: pdfView.rotation });
  const avail = Math.max(240, body.clientWidth - 48);
  pdfView.fit = true;
  pdfView.scale = Math.max(0.3, Math.min(3, avail / base.width));
  pdfView.fitScale = pdfView.scale;

  // 先恢复上次的页码，再建页；否则 rebuild 会把位置写成第 1 页。
  const saved = Number(localStorage.getItem('colophon:pos:' + pdfView.itemId)) || 1;
  pdfView.current = Math.min(Math.max(1, saved), doc.numPages);

  await rebuildPages();
}

async function rebuildPages(){
  const doc = pdfView.doc;
  if(!doc) return;
  const body = $('#readerBody');
  const keep = pdfView.current || 1;

  if(pdfView.io){ pdfView.io.disconnect(); pdfView.io = null; }
  pdfView.pages.forEach(function(ps){
    if(ps.task){ try { ps.task.cancel(); } catch(err) { /* 已结束 */ } }
  });
  pdfView.pages = [];
  body.innerHTML = '';

  const frag = document.createDocumentFragment();
  for(let n = 1; n <= doc.numPages; n++){
    const page = await doc.getPage(n);
    const vp = page.getViewport({ scale: pdfView.scale, rotation: pdfView.rotation });
    const wrap = document.createElement('div');
    wrap.className = 'rpage-wrap';
    wrap.dataset.page = String(n);
    wrap.style.width = Math.floor(vp.width) + 'px';
    wrap.style.height = Math.floor(vp.height) + 'px';
    const canvas = document.createElement('canvas');
    const label = document.createElement('span');
    label.className = 'rpage-n';
    label.textContent = String(n);
    wrap.append(canvas, label);
    frag.appendChild(wrap);
    pdfView.pages.push({
      n, page, wrap, canvas,
      rendered:false, rendering:false, failed:false, task:null
    });
  }
  body.appendChild(frag);
  observePages();
  renderPage(keep);
  updateReaderChrome();
  goToPage(keep, false);
}

function observePages(){
  if(pdfView.io){ pdfView.io.disconnect(); pdfView.io = null; }
  const root = $('#readerBody');
  pdfView.io = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      if(entry.isIntersecting) renderPage(Number(entry.target.dataset.page));
    });
  }, { root: root, rootMargin: '800px 0px' });
  pdfView.pages.forEach(function(ps){
    if(!ps.rendered && !ps.failed) pdfView.io.observe(ps.wrap);
  });
}

async function renderPage(n){
  const ps = pdfView.pages.find(function(p){ return p.n === n; });
  if(!ps || ps.rendered || ps.rendering || ps.failed) return;
  ps.rendering = true;
  try{
    const vp = ps.page.getViewport({ scale: pdfView.scale, rotation: pdfView.rotation });
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const w = Math.floor(vp.width);
    const h = Math.floor(vp.height);
    ps.wrap.style.width = w + 'px';
    ps.wrap.style.height = h + 'px';
    ps.canvas.width = Math.floor(w * dpr);
    ps.canvas.height = Math.floor(h * dpr);
    ps.canvas.style.width = w + 'px';
    ps.canvas.style.height = h + 'px';
    const ctx = ps.canvas.getContext('2d', { alpha:false });
    ps.task = ps.page.render({
      canvasContext: ctx,
      viewport: vp,
      transform: dpr !== 1 ? [dpr, 0, 0, dpr, 0, 0] : null
    });
    await ps.task.promise;
    ps.task = null;
    ps.rendered = true;
    if(pdfView.io) pdfView.io.unobserve(ps.wrap);
  }catch(err){
    ps.task = null;
    ps.rendered = false;
    if(err && err.name === 'RenderingCancelledException') return;
    ps.failed = true;
    console.error('PDF 页渲染失败', n, err);
  }finally{
    ps.rendering = false;
  }
}

function goToPage(n, smooth){
  const doc = pdfView.doc;
  if(!doc) return;
  const target = Math.min(Math.max(1, n), doc.numPages);
  const ps = pdfView.pages.find(function(p){ return p.n === target; });
  const body = $('#readerBody');
  if(!ps || !body) return;
  pdfView.current = target;
  renderPage(target);
  body.scrollTo({ top: Math.max(0, ps.wrap.offsetTop - 8), behavior: smooth ? 'smooth' : 'auto' });
  updateReaderChrome();
  rememberPosition();
  syncReaderSidePage();
}

function syncCurrentPage(){
  if(!pdfView.doc || !pdfView.pages.length) return;
  const body = $('#readerBody');
  const mark = body.scrollTop + Math.min(body.clientHeight * 0.4, 320);
  let cur = 1;
  pdfView.pages.forEach(function(ps){
    if(ps.wrap.offsetTop <= mark) cur = ps.n;
  });
  if(cur !== pdfView.current){
    pdfView.current = cur;
    updateReaderChrome();
    rememberPosition();
    syncReaderSidePage();
  }
}

/* 换页只更新侧栏顶部的页码，不重绘整块面板——否则输入框会被打断 */
function syncReaderSidePage(){
  const el = $('#readerSide .rs-kicker');
  if(!el) return;
  const total = pdfView.doc ? pdfView.doc.numPages : 0;
  el.textContent = pdfView.doc
    ? '正在读 · 第 ' + (pdfView.current || 1) + (total ? ' / ' + total : '') + ' 页'
    : '没有托管 PDF · 只能凭标题和摘要打标';
}

async function zoomBy(factor){
  if(!pdfView.doc) return;
  const base = pdfView.fitScale || pdfView.scale;
  const rel = pdfView.fit ? 1 : pdfView.scale / base;
  const nextRel = Math.min(4, Math.max(0.25, rel * factor));
  pdfView.fit = false;
  pdfView.scale = base * nextRel;
  updateReaderChrome();
  await rebuildPages();
}

async function fitWidth(){
  if(!pdfView.doc) return;
  const first = await pdfView.doc.getPage(1);
  const base = first.getViewport({ scale:1, rotation: pdfView.rotation });
  const body = $('#readerBody');
  const avail = Math.max(240, body.clientWidth - 48);
  pdfView.fit = true;
  pdfView.scale = Math.max(0.3, Math.min(3, avail / base.width));
  pdfView.fitScale = pdfView.scale;
  updateReaderChrome();
  await rebuildPages();
}

async function rotatePage(){
  if(!pdfView.doc) return;
  const rel = pdfView.fit ? 1 : pdfView.scale / (pdfView.fitScale || pdfView.scale);
  pdfView.rotation = (pdfView.rotation + 90) % 360;
  const first = await pdfView.doc.getPage(1);
  const base = first.getViewport({ scale:1, rotation: pdfView.rotation });
  const body = $('#readerBody');
  const avail = Math.max(240, body.clientWidth - 48);
  pdfView.fitScale = Math.max(0.3, Math.min(3, avail / base.width));
  pdfView.scale = pdfView.fit ? pdfView.fitScale : pdfView.fitScale * rel;
  updateReaderChrome();
  await rebuildPages();
}

async function attachPdfTo(itemId, file){
  if(!file) return;
  if(!apiOnline){ toast('未连接本地服务，无法上传 PDF'); return; }
  if(!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf'){ toast('只接受 PDF 文件'); return; }
  const fd = new FormData();
  fd.append('file', file, file.name);
  setReaderLoading(true, '正在上传…');
  try{
    const res = await fetch('/api/items/' + encodeURIComponent(itemId) + '/file', { method:'POST', body: fd });
    if(!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    setReaderLoading(false);
    if(data.status === 'duplicate' && data.item_id && data.item_id !== itemId){
      toast('这个文件已经在库里的另一条上，已跳过去');
      renderAll();
      openReader();
      return;
    }
    await refreshPapers();
    const p = PAPERS.find(function(x){ return x.id === itemId; });
    if(!p || !p.hasFile){ toast('上传后没有找到这个文件'); return; }
    loadPdf(p);
  }catch(err){
    setReaderLoading(false);
    toast('上传失败，请检查本地服务是否在运行');
  }
}

let readerResizeTimer = null;
window.addEventListener('resize', function(){
  if(!state.readerOpen || !pdfView.doc) return;
  clearTimeout(readerResizeTimer);
  readerResizeTimer = setTimeout(function(){
    if(pdfView.fit) fitWidth(); else rebuildPages();
  }, 200);
});

/* ============================================================
   与后端同步
   ============================================================ */
function removeDeletedTagsFromPapers(papers){
  if(!deletedTagIds.size) return;
  for(const paper of papers){
    const ids = paper.topicIds;
    if(!ids?.some(id => deletedTagIds.has(id))) continue;
    paper.tags.topic = paper.tags.topic.filter((_, index) => !deletedTagIds.has(ids[index]));
    paper.topicIds = ids.filter(id => !deletedTagIds.has(id));
  }
}

async function fetchPapers(){
  const res = await fetch('/api/items', {cache:'no-store'});
  if(!res.ok) throw new Error('http ' + res.status);
  const data = await res.json();
  if(!Array.isArray(data.items)) throw new Error('bad payload');
  removeDeletedTagsFromPapers(data.items);
  return data.items;
}

async function refreshPapers(){
  if(!apiOnline) return;
  try{
    const pendingNotes = new Set(Object.keys(pendingPatch).filter(id => 'note_md' in pendingPatch[id]));
    const fresh = await fetchPapers();
    for(const paper of fresh){
      if(pendingNotes.has(paper.id) || pendingPatch[paper.id]?.note_md !== undefined){
        const local = PAPERS.find(p => p.id === paper.id);
        if(local) paper.note = local.note;
      }
    }
    PAPERS = fresh.filter(p => !deletedPaperIds.has(p.id));
    state.eval = null;
    await refreshGroups();
    renderAll();
  }catch(err){
    toast('读取书库失败，界面可能不是最新');
  }
}

const importView = {
  anchor:null, location:null, roots:[], selected:new Set(), loading:false,
  importing:false, message:'', sequence:0
};

function openImportBrowser(anchor){
  importView.anchor = anchor;
  state.modalOpen = true;
  state.modalMode = 'import';
  loadImportLocation(importView.location?.path, !importView.location);
}

function closeImportBrowser(){
  if(importView.importing) return;
  importView.sequence++;
  importView.loading = false;
  state.modalOpen = false;
  renderModal();
  importView.anchor?.focus();
}

async function importResponse(url, options){
  const res = await fetch(url, {
    ...options, headers:{...options?.headers, 'X-Colophon-Import':'1'}
  });
  const data = await res.json().catch(() => null);
  if(!res.ok || !data){
    throw new Error(typeof data?.detail === 'string' ? data.detail : '请求失败（HTTP ' + res.status + '）');
  }
  return data;
}

async function loadImportLocation(path, startAtDesktop = false){
  if(importView.importing) return;
  const seq = ++importView.sequence;
  importView.loading = true;
  importView.message = '';
  renderImportModal();
  try{
    const data = await importResponse('/api/fs/list' + (path ? '?path=' + encodeURIComponent(path) : ''));
    if(seq !== importView.sequence) return;
    importView.location = data;
    importView.selected.clear();
    if(!data.path) importView.roots = data.roots;
    const desktop = startAtDesktop && importView.roots.find(entry => entry.kind === 'desktop');
    if(desktop){
      const contents = await importResponse('/api/fs/list?path=' + encodeURIComponent(desktop.path));
      if(seq === importView.sequence) importView.location = contents;
    }
  }catch(err){
    if(seq === importView.sequence) importView.message = err.message;
  }finally{
    if(seq === importView.sequence){
      importView.loading = false;
      renderImportModal();
    }
  }
}

function importIcon(kind){
  const paths = {
    desktop:'<rect x="2" y="2.5" width="12" height="8.5" rx="1"/><path d="M8 11v3m-3 0h6"/>',
    downloads:'<path d="M8 2v8m-3-3 3 3 3-3M3 11v2.5h10V11"/>',
    documents:'<path d="M4 2h5l3 3v9H4zM9 2v3h3M6 8h4m-4 3h4"/>',
    home:'<path d="m2 7 6-5 6 5m-10-1v8h8V6m-6 8v-4h4v4"/>',
    drive:'<rect x="2" y="4" width="12" height="8" rx="1"/><path d="M2 9h12m-3 1.5h1"/>',
    folder:'<path d="M2 12.5V4h4.5L8 5.5h6v7z"/>',
    up:'<path d="M8 13V3M4 7l4-4 4 4"/>'
  };
  return '<svg class="impicon" viewBox="0 0 16 16" fill="none" stroke="currentColor"' +
    ' stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (paths[kind] || paths.folder) + '</svg>';
}

function renderImportModal(){
  const modal = $('#modal');
  const {location, selected, loading, importing, message} = importView;
  const busy = loading || importing;
  const disabled = busy ? ' disabled' : '';
  const locationName = importView.roots.find(entry => entry.path === location?.path)?.name;
  const shortcut = entry => '<button data-act="import-enter" data-path="' + esc(entry.path) + '"' + disabled +
    (entry.path === location?.path ? ' aria-current="location"' : '') + ' title="' + esc(entry.path) + '">' +
    importIcon(entry.kind) + '<span class="impname">' + esc(entry.name) + '</span></button>';
  const sidebar = importView.roots.filter(entry => entry.kind !== 'drive').map(shortcut).join('') +
    (importView.roots.some(entry => entry.kind === 'drive') ? '<h4>此电脑</h4>' +
      importView.roots.filter(entry => entry.kind === 'drive').map(shortcut).join('') : '');
  const directoryRow = (entry, hint) =>
    '<button class="improw" data-act="import-enter" data-path="' + esc(entry.path) + '"' + disabled + '>' +
      importIcon(entry.kind) + '<span class="impname">' + esc(entry.name) + '</span>' +
      '<span class="impsize">' + esc(hint) + '</span></button>';
  let rows = '';
  if(location?.path){
    rows = location.dirs.map(entry => directoryRow(entry, '文件夹')).join('') +
      location.files.map(file => '<label class="improw" title="' + esc(file.name) + '">' +
        '<input type="checkbox" data-import-check data-path="' + esc(file.path) + '"' +
        (selected.has(file.path) ? ' checked' : '') + disabled + '>' +
        '<span class="impname">' + esc(file.name) + '</span><span class="impsize">PDF</span></label>').join('');
  }else if(location){
    rows = location.roots.map(entry => directoryRow(entry, entry.path)).join('');
  }

  modal.classList.add('open');
  modal.innerHTML = '<div class="modal-card import-card" role="dialog" aria-modal="true" aria-labelledby="importTitle">' +
    '<div class="mhead"><h3 id="importTitle">导入</h3>' +
      '<button class="btn icon" data-act="import-close" aria-label="关闭" title="关闭"' +
        (importing ? ' disabled' : '') + '>×</button></div>' +
    '<div class="importbar"><button class="btn tiny icon" data-act="import-roots" title="常用位置" aria-label="常用位置"' +
      disabled + '>' + importIcon('home') + '</button>' +
      '<button class="btn tiny icon" data-act="import-up" title="上一级" aria-label="上一级"' +
      (location?.parent && !busy ? '' : ' disabled') + '>' + importIcon('up') + '</button>' +
      '<div class="importpath" title="' + esc(location?.path || '') + '">' +
      esc(locationName ? locationName + (locationName !== location.path ? '  ›  ' + location.path : '') : location?.path || '常用位置') + '</div></div>' +
    '<div class="importpane"><nav class="importnav" aria-label="常用位置与磁盘">' + sidebar + '</nav>' +
      '<div class="importbody" aria-busy="' + busy + '">' +
      '<div class="impcolumns"><span>名称</span><span>' + (location?.path ? '类型' : '位置') + '</span></div>' +
      (rows || '<div class="impempty">' + (loading ? '正在读取…' : location?.path ? '没有子文件夹或 PDF' : '没有可显示的位置') +
      '</div>') + '</div></div>' +
    (message ? '<p class="impmessage" role="status">' + esc(message) + '</p>' : '') +
    '<div class="importfoot"><div class="importsum"><span id="importCount" role="status"></span>' +
      (location?.files.length && !busy ? ' · <button class="linkbtn" data-act="import-all"></button>' : '') + '</div>' +
      '<div class="importacts"><button class="btn primary" data-act="import-selected"></button>' +
      '<button class="btn" data-act="import-folder"' + (location?.path && !busy ? '' : ' disabled') +
        '>导入当前文件夹（含子文件夹）</button></div></div></div>';
  paintImportSelection();
  if(!modal.contains(document.activeElement)){
    const card = $('.import-card', modal);
    card.tabIndex = -1;
    card.focus({preventScroll:true});
  }
}

function paintImportSelection(){
  const {location, selected, loading, importing} = importView;
  const count = selected.size;
  $('#importCount').textContent = importing ? '正在导入…' : loading ? '正在读取…' : location?.path
    ? (location.truncated ? '仅显示前 ' : '') + location.files.length + ' 个 PDF · 已选 ' + count
    : '选择一个位置';
  const button = $('[data-act="import-selected"]');
  button.disabled = !count || loading || importing;
  button.textContent = '导入选中的 PDF' + (count ? '（' + count + '）' : '');
  const all = $('[data-act="import-all"]');
  if(all) all.textContent = count === location.files.length ? '取消全选' : '全选';
}

function toggleImportSelection(){
  const {location, selected, loading, importing} = importView;
  if(loading || importing || !location?.files.length) return;
  const checked = selected.size !== location.files.length;
  selected.clear();
  if(checked) location.files.forEach(file => selected.add(file.path));
  $$('[data-import-check]').forEach(input => { input.checked = checked; });
  paintImportSelection();
}

async function runLocalImport(payload){
  if(importView.loading || importView.importing || (!payload.folder && !payload.paths?.length)) return;
  importView.importing = true;
  importView.message = '';
  renderImportModal();
  let data;
  try{
    data = await importResponse('/api/import/paths', {
      method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)
    });
  }catch(err){
    importView.message = '导入失败：' + err.message;
  }finally{
    importView.importing = false;
  }
  if(!data){
    renderImportModal();
    return;
  }

  const parts = [];
  if(data.imported) parts.push(data.imported + ' 篇已入库');
  if(data.duplicates) parts.push(data.duplicates + ' 篇重复跳过');
  if(data.errors.length) parts.push(data.errors.length + ' 项失败');
  const summary = parts.join(' · ') || '没有找到可导入的 PDF';
  if(!data.imported && !data.duplicates){
    importView.message = summary;
    renderImportModal();
    return;
  }

  closeImportBrowser();
  toast(summary);
  if(data.imported) await refreshPapers();
}

async function boot(){
  try{
    PAPERS = await fetchPapers();
    apiOnline = true;
  }catch(err){
    PAPERS = [];
    apiOnline = false;
  }
  if(!PAPERS.length){
    state.paperId = null;
  }
  if(apiOnline){
    await refreshGroups();
    await loadAISettings();
    await restoreConversation();
  }
  paintThemeBtn();
  renderAll();
  if(!apiOnline){
    toast('连不上本地服务，请确认 run.py 还在运行，然后刷新页面');
  }
}

/* ============================================================
   收尾
   ============================================================ */
function paintThemeBtn(){
  const dark = document.documentElement.dataset.theme === 'dark';
  const btn = $('#themeBtn');
  if(!btn) return;
  btn.innerHTML = dark
    ? '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3.2" stroke="currentColor" stroke-width="1.3"/><path d="M8 1.6v1.4M8 13v1.4M1.6 8h1.4M13 8h1.4M3.5 3.5l1 1M11.5 11.5l1 1M12.5 3.5l-1 1M4.5 11.5l-1 1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>'
    : '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M13.4 9.6A5.6 5.6 0 0 1 6.4 2.6a5.6 5.6 0 1 0 7 7Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>';
  btn.title = dark ? '切换浅色' : '切换深色';
  btn.setAttribute('aria-label',btn.title);
}

/* 启动：只认本地服务，连不上就显示重连提示 */
boot();
</script>
